<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 평가 한 바퀴</title>
<meta name="description" content="여고초등학교 교원 연수 — 제미나이와 바이브코딩으로 성취기준에서 성찰까지 수행평가를 설계하는 실습 아카이브">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Jua&display=swap" rel="stylesheet">
<style>
/* layout: fixed ruby-night sidebar + warm paper main column; step pages = header card, how-to row, capture cards, prompts */
:root{--bg:#fbf7f4;--paper:#ffffff;--ink:#1f2340;--sub:#5b6178;--line:#ece4df;--side:#211a3a;--side2:#2e2550;--ruby:#e5384f;--ruby2:#ff6b81;--rubyS:#fde8eb;--gold:#ffbf2e;--mint:#2fa877;--mintS:#e3f6ec;--sky:#eef3ff;--shadow:0 10px 30px rgba(31,35,64,.08)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#17142a;--paper:#211d38;--ink:#f1eef8;--sub:#b5b0cc;--line:#352f55;--rubyS:#3a2232;--mintS:#1d3a30;--sky:#232a48;--shadow:0 10px 30px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17142a;--paper:#211d38;--ink:#f1eef8;--sub:#b5b0cc;--line:#352f55;--rubyS:#3a2232;--mintS:#1d3a30;--sky:#232a48;--shadow:0 10px 30px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
img{max-width:100%;display:block}
/* layout */
.side{position:fixed;inset:0 auto 0 0;width:286px;background:linear-gradient(180deg,var(--side),#2a1f45);color:#efeaff;overflow-y:auto;z-index:20;padding:18px 14px 24px}
.main{margin-left:286px;padding:26px 30px 80px;max-width:1340px}
.brand{display:flex;gap:12px;align-items:center;padding:4px 6px 16px;cursor:pointer}
.brand img{width:58px;height:58px}
.brand b{font-size:19px;line-height:1.25;font-weight:700;display:block}.brand small{font-size:12px;color:#bdb3e6}
.nav a{display:block;text-decoration:none;padding:8px 12px;border-radius:12px;font-size:15px;font-weight:500;color:#e8e2ff;margin:1px 0}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.on{background:linear-gradient(135deg,var(--ruby),#c2264a);color:#fff;box-shadow:0 6px 16px rgba(229,56,79,.35)}
.nav a.home{font-weight:700}
.nav .pt{font-size:11.5px;font-weight:700;color:var(--gold);letter-spacing:.02em;margin:16px 10px 4px}
.nav a .ck{float:right;color:#7ee2b0;font-size:13px}
.side hr{border:0;border-top:1px solid rgba(255,255,255,.12);margin:16px 6px}
.ext a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;text-decoration:none;font-size:14.5px;color:#efeaff}
.ext a:hover{background:rgba(255,255,255,.07)}
.ext img{width:30px;height:30px}
.menuBtn{display:none}
/* hero */
.hero{position:relative;border-radius:30px;overflow:hidden;min-height:520px;box-shadow:var(--shadow);background:#2a1f45}
.hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(28,18,48,.92) 0,rgba(28,18,48,.72) 34%,rgba(28,18,48,.05) 62%)}
.hero .tx{position:relative;padding:54px 48px;max-width:600px;color:#fff}
.pill{display:inline-block;background:#fff;color:var(--side);font-weight:700;font-size:13.5px;border-radius:30px;padding:6px 16px}
.hero h1{font-size:54px;line-height:1.14;margin:22px 0 14px;font-weight:900;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{margin:0 0 6px;color:#e9e3ff;font-size:16px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.b{border:0;cursor:pointer;border-radius:30px;padding:13px 22px;font:inherit;font-weight:700;font-size:15px;text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.b.y{background:var(--gold);color:#2a1f45}.b.g{background:rgba(255,255,255,.12);color:#fff;border:1.5px solid rgba(255,255,255,.4)}
.b.r{background:var(--ruby);color:#fff}.b.w{background:var(--paper);border:1.5px solid var(--line);color:var(--ink)}
/* sections */
h2.sec{font-size:30px;font-weight:500;margin:46px 0 16px;letter-spacing:-.01em}
h2.sec small{font-size:14px;color:var(--sub);margin-left:10px;font-weight:400}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.part img{aspect-ratio:16/9;object-fit:cover;width:100%}
.part .in{padding:16px 18px 18px}.part .k{color:var(--ruby);font-weight:700;font-size:13px}
.part h3{margin:4px 0 8px;font-size:19px}.part ol{margin:0;padding:0;list-style:none}
.part li a{display:flex;gap:10px;padding:5px 0;text-decoration:none;font-size:15px;border-top:1px dashed var(--line)}
.part li a b{color:var(--ruby);min-width:22px}
/* cycle */
.cycle{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:center;padding:24px}
.cycle svg{width:100%;height:auto}
.cycle svg a text{cursor:pointer}
.cycle .why h3{font-size:24px;margin:0 0 8px}.cycle .why p{color:var(--sub);margin:0 0 10px}
.quote{border-left:4px solid var(--ruby);background:var(--rubyS);border-radius:0 14px 14px 0;padding:12px 16px;margin:12px 0;font-size:15px}
/* step page */
.shead{display:grid;grid-template-columns:1fr 380px;align-items:stretch;padding:0}
.shead .tx{padding:30px 30px}
.badge{display:inline-flex;gap:10px;align-items:center}.badge b{background:var(--ruby);color:#fff;border-radius:30px;padding:4px 14px;font-size:14px}
.badge span{color:var(--sub);font-size:14px;font-weight:500}
.shead h1{font-size:34px;line-height:1.3;margin:14px 0 10px;font-weight:500;letter-spacing:-.01em}
.shead p{color:var(--sub);margin:0}
.shead img{height:100%;width:100%;object-fit:cover}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.chip{background:var(--sky);color:#3b47b5;border-radius:30px;padding:3px 12px;font-size:13px;font-weight:700}
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.how div{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;gap:12px;font-weight:500;font-size:15px}
.how div b{flex:0 0 28px;height:28px;border-radius:50%;border:2px solid var(--ruby);color:var(--ruby);display:grid;place-items:center;font-size:14px}
.cap{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:22px;padding:16px;margin-bottom:18px}
.cap .im{border-radius:14px;overflow:hidden;border:1px solid var(--line);cursor:zoom-in;background:#f4f4f6}
.cap h4{margin:6px 0 12px;font-size:19px}
.cap ul{list-style:none;margin:0;padding:0}
.cap li{display:flex;gap:10px;margin:8px 0;font-size:15.5px}
.cap li i{flex:0 0 26px;height:26px;border-radius:50%;background:var(--ruby);color:#fff;font-style:normal;display:grid;place-items:center;font-size:13px;font-weight:700}
.cap li i.gr{background:var(--mint)}
details.pp{border:1.5px solid var(--line);border-radius:14px;margin:8px 0 8px 36px;background:var(--sky)}
details.pp summary{cursor:pointer;list-style:none;padding:8px 12px;display:flex;align-items:center;gap:8px;font-weight:700;color:#3b47b5;font-size:14.5px}
details.pp summary::after{content:'펼치기 ▾';margin-left:auto;color:var(--sub);font-weight:500;font-size:13px}
details.pp[open] summary::after{content:'접기 ▴'}
details.pp pre{margin:0 12px 10px;white-space:pre-wrap;font-family:inherit;font-size:13.5px;background:var(--paper);border-radius:10px;padding:10px;border:1px solid var(--line)}
.pid{background:#3b47b5;color:#fff;border-radius:8px;padding:1px 8px;font-size:13px}
.pr{padding:18px 20px;margin-bottom:16px}
.pr .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pr h4{margin:0;font-size:17.5px}.pr .where{margin-left:auto;background:#fff1c7;color:#7a5200;border-radius:30px;padding:3px 12px;font-size:12.5px;font-weight:700}
.pr pre{white-space:pre-wrap;font-family:inherit;font-size:15px;line-height:1.75;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.pr .cp{float:right}
.tip{border:1.5px dashed #d8cfe0;border-radius:16px;padding:12px 16px;margin:10px 0;font-size:15px;background:var(--paper)}
.tip b{color:var(--ruby);margin-right:8px}
.more{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,var(--side2),#4a2d6b);color:#fff;border-radius:22px;padding:16px 20px;margin-top:22px}
.more img{width:76px;height:76px}.more b{color:var(--gold);font-size:18px}
.navbtm{display:flex;justify-content:space-between;margin-top:28px;gap:10px}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.file{display:flex;gap:14px;align-items:center;padding:14px 16px;text-decoration:none}
.file .ex{flex:0 0 52px;height:52px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:13px;background:var(--ruby)}
.file .ex.zip{background:#6b5bd2}.file b{display:block;font-size:15px;line-height:1.35}.file small{color:var(--sub)}
/* results */
.gr3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.gcard{padding:16px}.gcard h5{margin:0 0 4px;font-size:16.5px}.gcard .pp2{color:var(--sub);font-size:13px}
.gcard.pick{outline:3px solid var(--gold)}.gcard .pk{background:var(--gold);color:#2a1f45;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700}
table.t{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.t th{width:84px;color:var(--ruby);font-weight:700;white-space:nowrap}
.gcard .gd,.gcard .wn{font-size:13.5px;border-radius:10px;padding:8px 10px;margin-top:8px}
.gd{background:var(--mintS)}.wn{background:var(--rubyS)}
table.rb{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px}
table.rb th{background:var(--side);color:#fff;padding:10px;text-align:left}
table.rb th:first-child{border-radius:12px 0 0 0}table.rb th:last-child{border-radius:0 12px 0 0}
table.rb td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;background:var(--paper)}
table.rb td.cat{font-weight:700;color:var(--ruby);white-space:nowrap}
.cl{list-style:none;padding:0;margin:8px 0}.cl li{padding:6px 0;border-bottom:1px dashed var(--line)}.cl li::before{content:'☐ ';color:var(--mint);font-weight:900}
.find{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}.find>div{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px}
.find p{margin:8px 0;font-size:14.5px}.lv{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--ruby);color:#fff;font-weight:700;margin-right:8px;font-size:13px}.lv.b{background:#f08a24}.lv.c{background:#7b6fd6}
.none{background:var(--rubyS)!important;text-align:center}.none big{display:block;font-size:22px;font-weight:900;color:var(--ruby);margin-top:10px}.sm{font-size:12px;color:var(--sub)}
.wr{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.wr .card{padding:14px 16px}.wr h5{margin:0 0 6px;font-size:16px}.wr p{margin:4px 0;font-size:14.5px}
.app{display:grid;grid-template-columns:420px 1fr;gap:20px;align-items:start}
.app iframe{width:100%;height:760px;border:0;border-radius:22px;box-shadow:var(--shadow);background:#effaf3}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.flow figure{margin:0;cursor:zoom-in}.flow img{border-radius:12px;border:1px solid var(--line)}.flow figcaption{font-size:13px;text-align:center;margin-top:6px;font-weight:500}
.promise{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.promise .card{padding:16px;text-align:center}.promise img{width:96px;height:96px;margin:0 auto 6px}.promise h5{margin:4px 0 6px;font-size:16.5px}.promise p{margin:0;font-size:14px;color:var(--sub)}
.imgs{display:grid;grid-template-columns:1fr 1.6fr;gap:16px}.imgs .card{padding:12px}.imgs figcaption{font-size:14px;color:var(--sub);margin-top:8px;text-align:center}
.gal{columns:3 320px;column-gap:14px}.gal figure{break-inside:avoid;margin:0 0 14px;background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:zoom-in}.gal figcaption{padding:8px 12px;font-size:14px}
.lb{position:fixed;inset:0;background:rgba(10,8,20,.88);display:none;align-items:center;justify-content:center;z-index:99;padding:24px;cursor:zoom-out}.lb.on{display:flex}.lb img{max-height:94vh;border-radius:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--side);color:#fff;border-radius:30px;padding:10px 20px;opacity:0;transition:.25s;z-index:100}.toast.on{opacity:1}
.foot{color:var(--sub);font-size:13px;margin-top:50px;text-align:center}

/* PART IV additions: tool workshop, order cards, pose sorting */
.tf{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.tf button{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:30px;padding:7px 16px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.tf button.on{background:var(--side);color:#fff;border-color:var(--side)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tl{padding:16px 16px 14px;display:flex;flex-direction:column;gap:8px;position:relative}
.tl.hide{display:none}
.tl .hd{display:flex;gap:12px;align-items:center}
.tl .hd img{width:56px;height:72px;object-fit:contain;flex:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.12))}
.tl h5{margin:0;font-size:17px;line-height:1.35}
.tl .nw{position:absolute;top:12px;right:12px;background:var(--gold);color:#2a1f45;border-radius:20px;padding:1px 9px;font-size:11.5px;font-weight:900}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tags span{font-size:12px;font-weight:700;border-radius:20px;padding:2px 9px;background:var(--sky);color:#3b47b5}
.tags span.w1{background:#fff1c7;color:#7a5200}.tags span.w2{background:var(--mintS);color:#1d7a55}.tags span.cv{background:#f3e8ff;color:#7a2fbf}
.tl p{margin:0;font-size:14.5px;color:var(--sub)}
.tl .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.tl .acts .b{padding:7px 13px;font-size:13px}
.tl details{border-top:1px dashed var(--line);padding-top:6px}
.tl summary{cursor:pointer;font-weight:700;font-size:13.5px;color:#3b47b5}
.tl pre{white-space:pre-wrap;font-family:inherit;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:260px;overflow:auto}
.orders{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.od{padding:0;display:flex;flex-direction:column}
.od .im{background:linear-gradient(160deg,#fff4dc,#ffe2b8);display:flex;justify-content:center;padding:14px 0 6px;position:relative}
.od .im img{height:120px;width:auto}
.od .im .tg{position:absolute;left:10px;top:10px;background:#fff;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;color:#b5541b}
.od .tx{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.od h5{margin:0;font-size:16.5px}.od p{margin:0;font-size:14px;color:var(--sub)}
.od .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}.od .acts .b{padding:7px 12px;font-size:13px}
.psort{display:grid;grid-template-columns:2fr 3fr 3fr 1.2fr;gap:12px}
.pg{border-radius:20px;padding:12px;border:2px solid;background:var(--paper)}
.pg h5{margin:0 0 8px;font-size:16px;display:flex;align-items:center;gap:8px}.pg h5 i{width:12px;height:12px;border-radius:50%;display:inline-block}
.pg .row{display:grid;gap:8px}
.pc2{display:flex;flex-direction:column;align-items:center;text-align:center;background:var(--bg);border-radius:16px;padding:10px 6px;position:relative}
.pc2 img{height:96px;width:auto}
.pc2 code{font-size:12px;font-weight:700;background:var(--paper);border-radius:8px;padding:1px 6px;margin-top:4px}
.pc2 b{font-size:13.5px;margin-top:3px}.pc2 small{font-size:12px;color:var(--sub);line-height:1.4}
.pc2 .five{position:absolute;top:6px;right:6px;background:#7a2fbf;color:#fff;border-radius:20px;padding:0 7px;font-size:11px;font-weight:900}
.jr{display:grid;grid-template-columns:440px 1fr;gap:20px;align-items:start;margin-top:18px}
.jr iframe{width:100%;height:820px;border:0;border-radius:22px;box-shadow:var(--shadow);background:#FFF7E6}
.steps5{counter-reset:k;list-style:none;padding:0;margin:0}
.steps5 li{counter-increment:k;display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}
.steps5 li::before{content:counter(k);flex:0 0 26px;height:26px;border-radius:50%;background:#FF9F1C;color:#fff;font-weight:900;display:grid;place-items:center;font-size:13px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.vs .card{padding:14px 16px}.vs h5{margin:0 0 6px;font-size:16px}.vs p{margin:4px 0;font-size:14px}
@media (max-width:1100px){.tools{grid-template-columns:repeat(2,1fr)}.orders{grid-template-columns:repeat(2,1fr)}.psort{grid-template-columns:1fr 1fr}.jr{grid-template-columns:1fr}}
@media (max-width:860px){.tools,.orders,.vs{grid-template-columns:1fr}.psort{grid-template-columns:1fr}}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.how{grid-template-columns:repeat(2,1fr)}.promise{grid-template-columns:repeat(3,1fr)}.cap{grid-template-columns:1fr}.app{grid-template-columns:1fr}.gr3{grid-template-columns:1fr}}
@media (max-width:860px){.flow{grid-template-columns:1fr 1fr}.side{transform:translateX(-100%);transition:.25s}.side.open{transform:none}.main{margin-left:0;padding-block:70px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.menuBtn{display:flex;position:fixed;top:12px;left:12px;z-index:30;background:var(--side);color:#fff;border:0;border-radius:14px;padding:10px 14px;font:inherit;font-weight:700;gap:6px}
.hero h1{font-size:36px}.hero .tx{padding:34px 22px}.hero .shade{background:linear-gradient(180deg,rgba(28,18,48,.88),rgba(28,18,48,.6))}
.shead{grid-template-columns:1fr}.shead img{max-height:220px}.g3,.g2,.find,.wr,.imgs,.cycle{grid-template-columns:1fr}.how{grid-template-columns:1fr}.promise{grid-template-columns:1fr 1fr}h2.sec{font-size:24px}}
</style>
</head><body>

명을 나타내나요?  2. 가장 많은 항목은?  3. ○○는 △△보다 몇 명 더 많나요?\n   4. 표를 막대그래프로 옮길 때 빠진 것은? (제목·눈금 중)  5. 이 그래프를 보고 할 수 있는 제안으로 알맞은 것은?\n③ 고르면 바로 맞았는지 알려 주기. 틀리면 정답을 바로 말하지 말고 '힌트' 한 줄 → 한 번 더 기회.\n④ 결과 — 맞힌 수와 함께 성취수준처럼 말해 주기: 5개 \"그래프를 읽고 제안까지!\" / 3~4개 \"그래프에서 사실을 잘 찾아요\" / 0~2개 \"눈금 한 칸부터 다시 보자\". 다시 볼 문제 번호를 알려 줘.\n⑤ [결과 복사] — \"번호, 맞힌 수, 틀린 문제 번호\"를 한 줄로 복사.\n\n[디자인] 밝은 파스텔, 큰 글씨, 버튼 크게. 정답이면 작은 축하 효과.\n[조건] 저장하지 않음. 외부 라이브러리 없이 화면 하나로. 모든 문구는 한국어.", "tags": ["평가 중", "학생", "저장 없음"]}, "T5": {"id": "T5", "title": "모둠 발표 동료평가 별점판", "where": "캔바 AI · 코드", "text": "초등학교 모둠 발표 「동료평가 별점판」 웹앱을 만들어 줘. 발표를 들은 학생이 태블릿으로 친구 모둠을 평가하고, 응답은 캔바 시트에 한 줄씩 쌓여.\n\n[화면 흐름]\n① 내 모둠(1~6모둠)과 번호 고르기 — 이름은 받지 않아.\n② 평가할 모둠 고르기 — 내 모둠은 고를 수 없게 흐리게.\n③ 기준 3가지를 별 1~3개로: 내용이 정확해요 / 그래프·자료가 알맞아요 / 잘 들리게 발표해요. 기준마다 '별 3개는 이런 모습' 예시 한 줄.\n④ 칭찬 한 줄 + 제안 한 줄(각 50자 이내, 둘 다 필수). 제안 칸 예시: \"그래프 눈금 숫자를 크게 쓰면 더 잘 보일 것 같아요.\"\n⑤ 제출 → \"따뜻한 평가 고마워요!\" → 다음 모둠 평가로.\n⑥ 선생님용(비밀번호 1234) — 모둠별 기준 평균 별 막대그래프(제목 · 눈금 · 숫자), 모둠별 칭찬·제안 모아 보기.\n\n[시트 열] 제출시각, 평가한 모둠, 번호, 평가받은 모둠, 내용, 자료, 발표, 칭찬, 제안\n[조건] 비난하는 말(바보, 못해 등)이 들어가면 제출 전에 \"친구가 들어도 기분 좋은 말로 바꿔 볼까요?\"라고 안내. 모든 문구는 한국어.", "tags": ["평가 중", "학생", "캔바 시트"]}, "T6": {"id": "T6", "title": "교사용 관찰 체크리스트 — 번호 × A·B·C", "where": "제미나이 · Canvas", "text": "교사용 「수행평가 관찰 체크리스트」 웹앱을 만들어 줘. 수업 중 돌아다니며 태블릿으로 빠르게 기록하는 용도야.\n\n[화면]\n- 위: 오늘 날짜, 평가 요소 3개 탭(예: 표로 정리하기 / 막대그래프 그리기 / 그래프 해석·제안) — 이름은 내가 바꿀 수 있게.\n- 가운데: 번호 1~30 카드 격자. 카드를 누를 때마다 A → B → C → 빈칸 순서로 바뀌고 색도 바뀌어(A 초록, B 노랑, C 분홍).\n- 카드를 길게 누르면 메모 한 줄(예: \"눈금 한 칸 크기를 스스로 바꿈\").\n- 아래: 요소별 A·B·C 인원 수를 작은 막대그래프로.\n- [CSV 복사] — 번호, 요소, 수준, 메모, 날짜.\n\n[조건] 학생 이름은 넣지 않고 번호만. 이 기기 브라우저에만 저장, [오늘 기록 지우기]는 두 번 확인. 손가락으로 누르기 쉽게 크게. 모든 문구는 한국어.", "tags": ["평가 중", "교사", "이 기기"]}, "C1": {"id": "C1", "title": "줄넘기 수행평가 기록장 — 닭핑 5포즈 + 캔바 시트", "where": "캔바 AI · 코드 · 닭핑 그림 5장 첨부", "text": "초등학교 체육 「줄넘기 수행평가 기록장」 웹앱을 만들어 줘. 함께 올린 닭핑 캐릭터 그림 5장(pose_wave · pose_read · pose_tablet · pose_question · pose_party)을 장면에 맞게 등장시켜 줘.\n\n[화면 흐름]\n① 시작 — 반(1~6반)과 번호(1~30번)만 고르기. 이름은 받지 않아. 닭핑(pose_wave)이 \"안녕! 오늘도 줄넘기 도전!\"이라고 말풍선으로 인사.\n② 기준 보기 — 종목 고르기: 앞으로 양발 모아 뛰기 / 뒤로 뛰기 / 번갈아 뛰기 / 엇걸어 뛰기 / 이단 뛰기. 고른 종목의 '별 3개 기준표'(30초 기준 ★·★★·★★★ 횟수)를 보여 주고, 도전 전에 '오늘 나는 별 몇 개?'를 예상해서 고르기. (pose_read)\n③ 도전 — [시작]을 누르면 3·2·1 뒤 30초 타이머. 짝꿍이 화면의 큰 버튼을 한 번 누를 때마다 +1, 숫자는 아주 크게 통통 튀게. 도전 중에는 닭핑(pose_tablet)이 옆에서 응원하고, 남은 10초에는 말풍선이 \"힘내! 거의 다 왔어!\"로 바뀌게.\n④ 돌아보기 — 횟수와 받은 별, 예상 별과 비교. '자세 · 리듬 · 끝까지 하기'를 별 1~3개로 스스로 평가하고, 다음 도전 다짐 한 줄. (pose_question)\n⑤ 제출 — 제출하면 캔바 시트에 한 줄씩 쌓이게: 제출시각, 반, 번호, 종목, 횟수, 받은 별, 예상 별, 자세, 리듬, 끝까지, 다짐. 완료 화면에 닭핑(pose_party)과 \"멋진 도전이었어!\" (같은 기기에서 다음 학생이 바로 시작할 수 있게 [처음으로] 버튼)\n⑥ 선생님용 — 맨 아래 작은 [선생님] 버튼, 비밀번호 1234. 종목별 평균 횟수와 별 개수별 학생 수를 막대그래프(제목 · 가로 · 세로 · 눈금 · 숫자)로. 닭핑은 pose_read.\n\n[닭핑 쓰는 규칙]\n- 한 화면에 닭핑은 한 번만, 말풍선과 함께. 위 괄호에 적은 포즈를 그 장면에 써 줘.\n- 그림은 배경이 투명한 PNG야. 둥근 카드 위에 살짝 띄운 느낌으로.\n\n[디자인] 노랑 · 주황 파스텔, 둥근 카드, 큰 글씨(18px 이상). 태블릿 세로 화면과 전자칠판 모두 잘 보이게.\n[조건] 학생 이름·사진은 받지 않아. 캔바 시트 연결이 안 되면 이 기기에 저장하고 선생님용 화면에 [결과 복사](탭 구분 표) 버튼을 넣어 줘. 모든 문구는 한국어.", "tags": ["캔바 코드", "캔바 시트", "그림 첨부"]}, "C1+": {"id": "C1+", "title": "선생님 화면 손보기 — 깨진 축 이름 · 한국어 열 이름", "where": "캔바 AI · 같은 대화에서", "text": "선생님 화면을 손봐 줘.\n1. 막대그래프 세로축 이름 '종목' 글자가 세로로 깨져 보여. 가로 글씨로 그래프 왼쪽 위에 놓아 줘.\n2. 연결된 캔바 시트의 열 이름을 한국어로 바꿔 줘: 제출시각, 반, 번호, 종목, 횟수, 받은 별, 예상 별, 자세, 리듬, 끝까지, 다짐.\n나머지는 그대로.", "tags": ["캔바 코드", "수정"]}, "C2": {"id": "C2", "title": "수업 이해도 신호등 (원조 주문서)", "where": "캔바 AI · 코드", "text": "초등학교 교실에서 쓸 \"수업 이해도 신호등\" 앱을 만들어 줘. 학생이 자기 폰이나 태블릿에서 열어 이름을 넣고 신호등 색 하나를 고르면 응답이 모이는 앱이야.\n[화면]\n① 맨 위 제목 \"오늘 수업, 어땠나요?\"\n② 이름(또는 번호) 입력칸\n③ 큰 버튼 3개: 🟢 잘 알겠어요 / 🟡 조금 헷갈려요 / 🔴 어려워요 — 하나를 누르면 바로 제출돼\n④ 그 아래 \"궁금한 점이 있으면 적어 주세요\" 한 줄 입력칸(선택)\n⑤ 제출되면 \"고마워요! 선생님이 확인할게요 😊\" 메시지가 뜨고 입력칸이 비워져. 이름이 비어 있으면 제출하지 말고 다정하게 안내해 줘.\n[응답 모으기]\n- 제출 내용(제출시각, 이름, 신호, 궁금한 점)이 캔바 시트로 수집되는 폼으로 연결해 줘. 선생님은 그 캔바 시트에서 색깔별 개수와 궁금한 점을 볼 거야.\n- 캔바 시트 연결이 안 되면 이렇게 해 줘: 화면 맨 아래 작은 \"선생님용\" 버튼 → 비밀번호 1234 → 이 기기에서 모인 응답을 초록·노랑·빨강 개수(큰 숫자)와 🔴를 누른 학생 이름 목록, 궁금한 점 목록(최신 순)으로 보여 주고, [결과 복사] 버튼을 누르면 \"제출시각, 이름, 신호, 궁금한 점\" 표(탭으로 구분)가 복사되게 해 줘.\n[디자인]\n글씨 크게, 색은 부드럽게, 학생에게 다정한 말투로. 휴대폰 세로 화면에서 버튼 3개가 손가락으로 누르기 쉽게 크게. 자동 새로고침은 넣지 마.\n[조건]\n화면 하나로. 외부 라이브러리 없이. 모든 문구는 한국어.", "tags": ["캔바 시트", "출구 카드"]}, "C3": {"id": "C3", "title": "줄넘기 카운터 (원조 주문서)", "where": "캔바 AI · 코드", "text": "다음 조건에 맞는 줄넘기 카운터 웹 앱을 만들어줘.\n\n[화면 구성]\n1. 로그인 화면: 학년, 반, 번호, 이름 입력 필드 → \"시작하기\" 버튼\n2. 카운터 화면:\n   - 상단: 학생 정보(예: 3학년 2반 15번 김철수) 표시\n   - 중앙: 큰 숫자(줄넘기 횟수) - 처음에 0\n   - 화면 아무 곳이나 탭/클릭하면 숫자가 1씩 증가\n   - 하단 버튼: \"초기화\"(0으로 리셋), \"기록 저장\" 버튼\n3. 기록 화면: 날짜별 줄넘기 기록을 표로 보여줌\n\n[디자인]\n- 초등학생 친화적인 밝고 큰 UI\n- 숫자는 최소 120px 이상 큰 글씨\n- 탭할 때마다 숫자에 바운스 애니메이션 효과\n- 색상: 초록색 계열 메인 컬러\n\n[기능]\n- 시트(Sheet) 기능으로 학생별 기록 저장 (이름, 날짜, 횟수)\n- 선생님이 전체 학생 기록을 한 눈에 볼 수 있는 교사용 보기 모드\n- 교사용 보기: 비밀번호 \"teacher\" 입력 시 접근 가능", "tags": ["캔바 시트", "스포츠클럽"]}, "C4": {"id": "C4", "title": "수행평가 웹앱 — 6학년 실과 「일과 직업」 (원조 주문서)", "where": "캔바 AI · 코드", "text": "6학년 실과 수행평가 웹앱을 만들어줘. 캔바 시트(Canva Sheets)와 연동해줘.\n \n[전체 흐름]\n1단계: 로그인 화면\n2단계: 수행평가 입력 화면\n3단계: 제출 완료 화면\n \n[1단계 - 로그인 화면]\n- 제목: \"6학년 실과 수행평가 - 일과 직업\"\n- 입력 필드 3개:\n① 반 (드롭다운: 1반~6반 중 선택)\n② 번호 (드롭다운: 1번~30번 중 선택)\n③ 이름 (텍스트 입력)\n- 모든 필드 필수 입력. 비어있으면 \"모두 입력해주세요\" 알림\n- \"시작하기\" 버튼 클릭 시 2단계로 이동\n \n[2단계 - 수행평가 입력 화면]\n- 상단에 \"6학년 O반 OO번 OOO\" 표시 (1단계 입력 정보 반영)\n- 아래 항목들을 순서대로 입력받아:\n \n질문1: \"일과 직업이 중요한 이유는 무엇인지 설명해 보세요.\"\n→ 여러 줄 텍스트 입력 (textarea, 최소 3줄 높이)\n \n구분선 넣고, 소제목: \"나의 적성을 탐색하여 내게 맞는 직업을 탐구해 봅시다.\"\n \n질문2: \"내가 좋아하는 것\" → 텍스트 입력\n질문3: \"내가 잘 하는 것\" → 텍스트 입력\n질문4: \"나의 장점\" → 텍스트 입력\n질문5: \"나의 단점\" → 텍스트 입력\n질문6: \"내가 관심이 있는 것들\" → 텍스트 입력\n질문7: \"원하는 직업\" → 텍스트 입력\n질문8: \"원하는 직업을 위해 노력해야 할 점\" → 여러 줄 텍스트 입력\n \n- 모든 항목 필수 입력\n- 하단에 \"제출하기\" 버튼\n- 제출 전 \"정말 제출하시겠습니까?\" 확인 팝업\n \n[3단계 - 제출 완료 화면]\n- \"제출이 완료되었습니다!\" 메시지\n- 내가 입력한 내용 요약 표시 (읽기 전용)\n- \"처음으로 돌아가기\" 버튼\n \n[캔바 시트 연동]\n- 캔바 시트와 직접 연동하여 제출 데이터를 자동 기록해줘\n- 시트 열(column) 구성:\nA: 제출시간\nB: 반\nC: 번호\nD: 이름\nE: 일과 직업이 중요한 이유\nF: 좋아하는 것\nG: 잘 하는 것\nH: 장점\nI: 단점\nJ: 관심 있는 것들\n function files(){return `<section class="card shead"><div class="tx"><div class="badge"><b>실습 자료</b></div><h1>내려받아 바로 쓰는 실습 자료</h1><p>교과서 · 성취기준 소스, 제미나이 결과를 인쇄용으로 정리한 예시, 프롬프트 카드</p></div><img src="art/part2.webp" alt=""></section><h2 class="sec">파일</h2><div class="files">${D.files.map(fileCard).join('')}</div><div class="tip" style="margin-top:20px"><b>TIP</b>교과서 PDF는 연수용으로 용량을 줄인 파일이에요(제미나이 업로드 OK). 수업에는 학교에 배부된 교과서 파일을 쓰세요.</div>${foot()}`}
function prompts(){return `<section class="card shead"><div class="tx"><div class="badge"><b>프롬프트 모음</b></div><h1>E · T · C · P — 복사해서 바로</h1><p>E 평가 한 바퀴(제미나이) · T 평가 도구 공방 · C 캔바 주문서 · P 캐릭터 포즈. + 가 붙은 것은 고치기·다시 요청 프롬프트예요.</p></div><img src="art/part4.webp" alt=""></section><div style="margin-top:22px">${Object.keys(D.prompts).map(promptCard).join('')}</div>${foot()}`}
function gallery(){const G=[['res/R4_worksheet_img.jpg','E4 귀여운 학생용 평가지'],['res/R5_rubric_slide.jpg','E5 TV용 별 3개 기준표'],['cap/g03_grasps_top.jpg','E1 GRASPS 평가안'],['cap/g05_rubric.jpg','E2 채점 루브릭'],['cap/g08_canvas_doc.jpg','E3 캔버스 평가지'],['cap/g14_wrapper1.jpg','E6 평가 래퍼'],['cap/g18_app_predict.jpg','E7 앱 — 예상 별'],['cap/g19_app_criteria.jpg','E7 앱 — 기준표'],['cap/g26_app_fixed.jpg','E7+ 앱 — 고친 결과'],['res/sheet_p1.jpg','정리한 평가지 PDF'],['cap/p03_stas_4su0401_level.jpg','포털 — 개발되어 있지 않습니다'],['cap/c04_app_start.jpg','C1 캔바 앱 — 닭핑 인사'],['cap/c06_app_challenge.jpg','C1 캔바 앱 — 30초 도전'],['cap/c09_app_teacher.jpg','C1 캔바 앱 — 선생님 화면'],['cap/c11_sheet.jpg','C1 캔바 시트에 쌓인 기록']];
 return `<h2 class="sec" style="margin-top:6px">결과물 갤러리<small>누르면 크게</small></h2><div class="gal">${G.map(g=>`<figure onclick="zoom('${g[0]}')"><img src="${g[0]}" alt="" loading="lazy"><figcaption>${g[1]}</figcaption></figure>`).join('')}</div>${foot()}`}
function go(id){location.hash=id}
function tf(b,k){document.querySelectorAll('#tf button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.tl').forEach(c=>c.classList.toggle('hide',k!=='all'&&!c.dataset.k.includes(k)))}
let DL=null;(async()=>{try{DL=await window.claude?.use?.('downloads')}catch(e){}})();
function dl(ev,path,dn){if(!DL)return true;ev.preventDefault();fetch(path).then(r=>r.blob()).then(b=>DL.save({filename:dn||path.split('/').pop(),data:b})).then(()=>toast('저장했어요')).catch(e=>{if(e&&e.code==='declined')return;toast('새 탭으로 열어요');window.open(path,'_blank')});return false}
function render(){const id=(location.hash||'#home').slice(1).replace(/^P-.*/,'');let h;const sid=id||'home';
 if(sid==='home')h=home();else if(sid==='files')h=files();else if(sid==='prompts')h=prompts();else if(sid==='gallery')h=gallery();else if(D.steps.find(s=>s.id===sid))h=step(sid);else h=home();
 $('#main').innerHTML=h;nav(sid);window.scrollTo(0,0);document.querySelector('.side').classList.remove('open')}
function mark(id){done[id]=!done[id];saveDone();render()}
function zoom(src){$('#lbi').src=src;$('#lb').classList.add('on')}
function copyP(id){const t=D.prompts[id].text;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(id+' 복사했어요 — '+(/^C|^T5/.test(id)?'캔바 AI 코드':'제미나이')+'에 붙여 넣으세요')).catch(()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast(id+' 복사했어요')})}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}
window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#P-'))return;render()});render();
</script>

</body></html>
