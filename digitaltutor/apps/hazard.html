<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>교실 위험 탐정 | 튜터 출동! 사고 지도 게임</title>
<link rel="icon" href="../art/narae_face.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
:root{--cream:#FFF8EC;--navy:#1F2A6B;--navy2:#0E1440;--orange:#ED7D31;--oink:#C0500C;--yellow:#FFC94D;--mint:#CFF3E2;--sky:#D6ECFF;--peach:#FFE1CC;--line:#EADFCB;--text:#1d2340;--sub:#5b6280;
--t1:#E8590C;--t2:#F2B705;--t3:#2B7FC4;--t4:#7B4DDB;--t5:#17845A;--t6:#D6336C}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--text);font-family:'Gowun Dodum','Noto Sans KR',system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;overflow-x:hidden}
h1,h2,h3,.jua{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;letter-spacing:-.2px}
button{font:inherit;cursor:pointer;border:0}
img{max-width:100%;display:block}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));background:rgba(255,248,236,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top a.back{flex:none;text-decoration:none;color:var(--navy);font-weight:700;font-size:13px;border:2px solid var(--line);border-radius:12px;padding:6px 10px;background:#fff}
.top .ttl{font-family:'Jua';font-size:clamp(16px,2.6vw,21px);color:var(--navy);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl em{font-style:normal;color:var(--orange)}
.pill{flex:none;background:var(--navy);color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.wrap{max-width:1180px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
[hidden]{display:none!important}

/* intro */
.hero{position:relative;border-radius:28px;overflow:hidden;min-height:420px;display:grid;align-items:end;box-shadow:0 18px 40px rgba(31,42,107,.18)}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,20,64,.92) 0%,rgba(14,20,64,.7) 42%,rgba(14,20,64,0) 75%)}
.hero .copy{position:relative;padding:34px clamp(20px,4vw,44px);max-width:620px;color:#fff}
.hero .tag{display:inline-block;background:#fff;color:var(--navy);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
.hero h1{font-size:clamp(32px,5.4vw,56px);margin:12px 0 8px;line-height:1.1}
.hero h1 em{font-style:normal;color:var(--yellow)}
.hero p{margin:0 0 18px;line-height:1.7;font-size:15.5px;color:#E6EAFF}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--yellow);color:var(--navy2);font-family:'Jua';font-size:19px;padding:12px 22px;border-radius:16px;box-shadow:0 6px 0 #c99a1e;transition:transform .12s}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #c99a1e}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:none;border:2px solid rgba(255,255,255,.5)}
.btn.navy{background:var(--navy);color:#fff;box-shadow:0 6px 0 #0b1033}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:20px}
.mode{display:flex;gap:14px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:22px;padding:16px;text-align:left;box-shadow:0 8px 20px rgba(31,42,107,.07);transition:transform .15s}
.mode:hover{transform:translateY(-3px)}
.mode img{width:74px;height:74px;object-fit:contain;flex:none}
.mode b{display:block;font-family:'Jua';font-size:21px;color:var(--navy)}
.mode span{color:var(--sub);font-size:14px;line-height:1.55}
.mode .st{display:inline-block;margin-top:6px;font-size:13px;color:var(--oink);font-weight:700}
.types{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:16px}
.tchip{border-radius:14px;padding:10px 6px;text-align:center;color:#fff;font-weight:700;font-size:13.5px;line-height:1.3}
.tchip i{display:block;font-style:normal;font-size:22px}

/* find game */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.bar .grow{flex:1;min-width:160px}
.timer{height:12px;border-radius:99px;background:#efe5d2;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--orange),var(--yellow));transition:width .25s linear}
.stat{background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 12px;font-weight:700;font-size:14px;color:var(--navy)}
.stat b{color:var(--oink)}
.hintbtn{background:#fff;border:2px solid var(--line);border-radius:14px;padding:5px 12px 5px 6px;display:flex;align-items:center;gap:6px;font-weight:700;color:var(--navy)}
.hintbtn img{width:28px;height:28px;object-fit:contain}
.scene{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 14px 34px rgba(31,42,107,.18);background:#ddd;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.scene>img{width:100%;height:auto}
.spot{position:absolute;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none}
.spot.found{border:4px solid var(--yellow);box-shadow:0 0 0 4px rgba(14,20,64,.55),0 0 22px rgba(255,201,77,.9);animation:pop .4s ease}
.spot.found b{position:absolute;left:50%;top:-14px;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:999px;font-size:12px;padding:2px 8px;white-space:nowrap;font-family:'Noto Sans KR';font-weight:700}
.spot.hint{border:4px dashed #fff;animation:pulse 1s infinite}
.miss{position:absolute;transform:translate(-50%,-50%);font-size:28px;pointer-events:none;animation:fade .7s forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.3)}70%{transform:translate(-50%,-50%) scale(1.15)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes fade{to{opacity:0;transform:translate(-50%,-110%)}}
.foundlist{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.fl{background:#fff;border:2px dashed var(--line);border-radius:14px;padding:8px 10px;font-size:13px;color:#aaa;min-height:54px;display:flex;align-items:center;gap:8px}
.fl.on{border-style:solid;color:var(--text)}
.fl .dot{width:12px;height:12px;border-radius:50%;flex:none;background:#ddd}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(14,20,64,.55);padding:16px}
.card{width:min(560px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:26px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:rise .3s ease}
@keyframes rise{from{transform:translateY(20px);opacity:0}}
.card .head{display:flex;gap:12px;align-items:center}
.card .head img{width:66px;height:66px;object-fit:contain;flex:none}
.card h3{margin:0;font-size:23px;color:var(--navy)}
.card p{line-height:1.7;margin:10px 0}
.crop{position:relative;border-radius:16px;overflow:hidden;height:170px;border:3px solid var(--yellow);margin:12px 0;background:#eee}
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tbtn{border-radius:14px;padding:12px 6px;color:#fff;font-weight:700;font-size:15px;line-height:1.25;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.tbtn i{display:block;font-style:normal;font-size:24px}
.tbtn:disabled{opacity:.35}
.tbtn.right{outline:4px solid var(--yellow);opacity:1}
.fb{border-radius:16px;padding:12px 14px;margin-top:12px;line-height:1.65}
.fb.ok{background:#E7F7EF;border:2px solid #9AD9B9}
.fb.no{background:#FFF0EA;border:2px solid #F6B99E}
.ment{background:var(--cream);border-radius:14px;padding:10px 12px;margin-top:10px;display:flex;gap:10px;align-items:flex-start}
.ment img{width:38px;height:38px;border-radius:50%;object-fit:cover;object-position:top;flex:none;border:2px solid var(--orange)}
.ment span{font-size:14.5px;line-height:1.6}
.ment b{color:var(--oink)}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}

/* speed quiz */
.sq{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.qcard{background:#fff;border:3px solid var(--line);border-radius:26px;padding:22px;min-height:250px;position:relative;box-shadow:0 12px 26px rgba(31,42,107,.1)}
.qcard .num{font-family:'Jua';color:var(--orange);font-size:18px}
.qcard .sit{font-size:clamp(19px,2.6vw,25px);line-height:1.5;margin:10px 0 0;font-family:'Jua';color:var(--navy)}
.qcard .kid{position:absolute;right:12px;bottom:0;width:120px;height:140px;object-fit:contain;object-position:bottom}
.qcard .kidline{display:inline-block;margin-top:12px;background:var(--sky);border-radius:16px 16px 16px 4px;padding:8px 12px;font-size:15px;max-width:calc(100% - 130px)}
.combo{font-family:'Jua';font-size:20px;color:var(--oink)}
.side{background:#fff;border:2px solid var(--line);border-radius:22px;padding:16px}
.side h3{margin:0 0 8px;color:var(--navy)}
.side ol{margin:0;padding-left:20px;line-height:1.8;font-size:14px}
.sbins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.flash{animation:flash .5s}
@keyframes flash{30%{transform:scale(1.03)}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* result */
.result{display:grid;grid-template-columns:260px minmax(0,1fr);gap:22px;align-items:center;background:#fff;border-radius:28px;padding:24px;box-shadow:0 14px 34px rgba(31,42,107,.12)}
.result .big{font-family:'Jua';font-size:48px;color:var(--navy);margin:0}
.result .badge{display:inline-block;background:var(--yellow);color:var(--navy2);font-family:'Jua';font-size:20px;border-radius:999px;padding:6px 16px}
.sumtable{width:100%;border-collapse:collapse;margin-top:16px;font-size:14px}
.sumtable th,.sumtable td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.sumtable th{color:var(--sub);font-weight:700}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (max-width:900px){.types{grid-template-columns:repeat(3,minmax(0,1fr))}.sq{grid-template-columns:1fr}.foundlist{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.modes{grid-template-columns:1fr}.result{grid-template-columns:1fr}.hero{min-height:480px}.hero .shade{background:linear-gradient(0deg,rgba(14,20,64,.95) 0%,rgba(14,20,64,.75) 55%,rgba(14,20,64,.1) 100%)}.qcard .kid{width:84px;height:100px}.qcard .kidline{max-width:calc(100% - 90px)}.tgrid,.sbins{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="top"><a class="back" href="../index.html#s1">← 아카이브로</a><div class="ttl">튜터 출동! <em>교실 위험 탐정</em></div><span class="pill" id="scorePill">0점</span></div>
<div class="wrap" id="app"></div>
<div class="modal" id="modal" hidden><div class="card" id="mcard"></div></div>
<script>
const TYPES=[
 {k:'body',name:'신체 안전',ico:'🦵',c:'var(--t1)',ex:'넘어짐 · 부딪힘'},
 {k:'elec',name:'전기 안전',ico:'⚡',c:'var(--t2)',ex:'감전 · 화상 · 화재'},
 {k:'dev',name:'기기 안전',ico:'📱',c:'var(--t3)',ex:'낙하 · 파손 · 끼임'},
 {k:'net',name:'인프라 장애',ico:'📶',c:'var(--t4)',ex:'와이파이 · 접속 · 전원'},
 {k:'asset',name:'자산 관리',ico:'🗂️',c:'var(--t5)',ex:'분실 · 바뀜 · 로그인 방치'},
 {k:'health',name:'건강 · 집중',ico:'👀',c:'var(--t6)',ex:'눈 피로 · 자세 · 과몰입'}];
const TBY=Object.fromEntries(TYPES.map(t=>[t.k,t]));
/* 숨은 위험 — x,y,r은 그림 가로세로 대비 % */
const SPOTS=[{"x": 45, "y": 81, "r": 8, "name": "통로 바닥의 충전선", "t": ["body", "elec"], "types": "🦵 신체 안전 (+⚡ 전기 안전)", "desc": "책상에서 늘어진 충전선이 통로 바닥을 길게 가로질러요.", "why": "발이 걸려 넘어지는 신체 안전사고가 먼저예요. 선이 밟히고 꺾이면 피복이 상해 전기 안전 문제로도 이어져요.", "hint": "걷다가 발에 걸리면 어떻게 될까요?", "ment": "“선은 책상 쪽으로! 바닥에 선이 보이면 넘지 말고 튜터 선생님을 불러요.”"}, {"x": 20, "y": 57, "r": 7, "name": "책상 끝에 걸친 태블릿", "t": ["dev"], "types": "📱 기기 안전", "desc": "태블릿이 책상 모서리 밖으로 반쯤 걸쳐 있어요.", "why": "팔꿈치만 스쳐도 떨어져 화면이 깨져요 — 기기 안전(낙하 · 파손). 깨진 유리에 손을 베일 수도 있어요.", "hint": "떨어지면 무엇이 망가질까요?", "ment": "“태블릿은 책상 가운데, 두 손바닥 안쪽에 쏙!”"}, {"x": 58, "y": 31, "r": 8, "name": "화면 보며 걷는 아이", "t": ["body"], "types": "🦵 신체 안전", "desc": "태블릿 화면만 보면서 통로를 걸어가요.", "why": "앞을 보지 않아 친구 · 책상 · 가방과 부딪히거나 넘어져요 — 신체 안전.", "hint": "앞을 안 보고 걸으면?", "ment": "“이동할 땐 화면은 가슴에 꼭, 눈은 앞을!”"}, {"x": 86, "y": 88, "r": 7, "name": "멀티탭 옆에 쏟아진 물", "t": ["elec"], "types": "⚡ 전기 안전", "desc": "책상 아래 멀티탭 바로 옆에서 물병이 쓰러져 물이 흘러요.", "why": "물과 전기가 만나면 감전 · 합선 · 화재 — 전기 안전이에요. 젖은 손으로 플러그를 만지는 것도 위험해요.", "hint": "물 + 콘센트 = ?", "ment": "“물병은 뚜껑 닫고 가방에! 멀티탭 근처엔 물을 두지 않아요.”"}, {"x": 10, "y": 28, "r": 6.5, "name": "충전함 위 부푼 태블릿", "t": ["elec", "dev"], "types": "⚡ 전기 안전 (+📱 기기 안전)", "desc": "충전함 위 태블릿 한 대가 베개처럼 볼록하게 부풀어 있어요.", "why": "부푼 리튬이온 배터리는 열폭주로 불이 날 수 있어요 — 전기 안전(화재). 기기도 바로 사용 중지예요.", "hint": "부푼 배터리는 무엇의 신호일까요?", "ment": "“볼록해진 기기는 만지지 말고 바로 알려 줘요! 튜터가 전원을 빼고 따로 둘게요.”"}, {"x": 57, "y": 4.5, "r": 5, "name": "천장 장비의 빨간 불", "t": ["net"], "types": "📶 인프라 장애", "desc": "천장 장비(공유기 · 프로젝터)에 빨간 불이 켜져 있어요.", "why": "장비의 빨간 불은 장애 신호 — 곧 접속 · 화면이 멈출 수 있어요(인프라 장애). 범위 · 유형 · 대안 · 정보로 보고해요.", "hint": "반 전체 수업이 멈출 수 있는 문제는?", "ment": "“접속이 안 되면 화면을 엎고 기다려요. 선생님이 다른 방법을 알려 줄게요.”"}, {"x": 64, "y": 70, "r": 7, "name": "통로 한가운데 책가방", "t": ["body"], "types": "🦵 신체 안전", "desc": "통로 한가운데 책가방이 놓여 있어요.", "why": "걸려 넘어지기 쉬워요 — 신체 안전. 기기를 들고 지나갈 때는 더 위험해요.", "hint": "지나가던 친구는?", "ment": "“가방은 의자 뒤 고리에 걸어요!”"}, {"x": 88, "y": 44, "r": 8, "name": "화면에 얼굴 붙인 아이", "t": ["health"], "types": "👀 건강 · 집중", "desc": "화면에 얼굴을 바짝 붙이고 구부정하게 엎드려 있어요.", "why": "눈 피로 · 목과 허리 불편 — 건강 · 집중 문제예요. 화면과 눈은 30cm 이상, 바른 자세로.", "hint": "오래 이렇게 보면 몸 어디가 힘들까요?", "ment": "“화면과 눈은 30cm, 등은 의자에 쭉! 20분마다 먼 곳 바라보기.”"}];
const QUIZ=[
 {s:'모둠 활동 시간, 지민이가 태블릿을 두 손으로 들고 화면을 보며 친구 자리로 걸어가요.',t:'body',kid:'minjun_sad',line:'잠깐만, 이거 보여 줄게!'},
 {s:'수업이 끝났는데 3번 태블릿이 충전함에 없어요. 아무도 어디 뒀는지 몰라요.',t:'asset',kid:'jihu_sad',line:'저는 분명히 넣었는데요…?'},
 {s:'젖은 손으로 콘센트에 충전기를 꽂으려는 학생이 있어요.',t:'elec',kid:'taeo_sad',line:'물 마시고 바로 꽂으면 돼요!'},
 {s:'충전함 문을 닫다가 손가락이 끼일 뻔했어요.',t:'dev',kid:'seoa_sad',line:'으앗! 문이 갑자기 닫혔어요…'},
 {s:'2교시 시작과 동시에 반 전체가 학습 플랫폼에 접속이 안 돼요.',t:'net',kid:'harin_sad',line:'계속 빙글빙글만 돌아요~'},
 {s:'쉬는 시간 내내 화면에 얼굴을 바짝 대고 영상을 보는 학생이 있어요.',t:'health',kid:'doyun_sad',line:'이것만 다 보고요…'},
 {s:'친구 태블릿과 바뀐 줄 모르고 다른 사람 계정으로 과제를 냈어요.',t:'asset',kid:'yuna_sad',line:'어? 이거 내 이름이 아닌데?'},
 {s:'멀티탭 하나에 충전기 여러 개와 전기난로까지 꽂혀 있어요.',t:'elec',kid:'taeo_sad',line:'추워서 꽂았어요!'},

function scenePct(ev){const r=$('#scene').getBoundingClientRect();return{x:(ev.clientX-r.left)/r.width*100,y:(ev.clientY-r.top)/r.height*100,ar:r.width/r.height};}

let qOrder=[],qt=null,qleft=0;

 $('#app').replaceChildren(el('div',{class:'bar'},el('div',{class:'grow'},el('div',{class:'timer'},el('i',{id:'qbar'}))),el('div',{class:'stat',id:'qsec',text:'8초'})),
  el('div',{class:'sq'},el('div',{},card,bins),side));

function answer(k,btn){
