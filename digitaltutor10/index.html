<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="디지털튜터 지역특화과정 특화 10차시 아카이브 — 디지털은 내 친구 4~5학년 교재 분석, 고학년 SW·AI 사이트 갤러리 46곳, 고학년 지원 실습 게임">
<meta property="og:title" content="튜터 출동! 고학년 · AI 놀이터 — 10차시 아카이브">
<meta property="og:description" content="앱과 친해지는 4학년, 원리를 체험하는 5학년, 그리고 스스로 서는 고학년">
<meta property="og:image" content="https://hongdonedu.github.io/fungigame2026/digitaltutor10/art/og.jpg">
<meta name="theme-color" content="#0E1440">
<title>튜터 출동! 고학년 · AI 놀이터 | 디지털튜터 10차시 아카이브</title>
<link rel="icon" href="art/narae_face.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: 노트북LM의 '출처 패널'처럼 왼쪽 세로 시간표(단계·목표) + 오른쪽 노트 페이지 */
:root{
  --ink:#1F2A6B; --ink2:#C2560C; --sun:#FFC94D; --mint:#17845A; --coral:#C9402C; --sky:#2B9BD6;
  --paper:#F3F5FA; --card:#ffffff; --line:#DCE1EE; --text:#141A3C; --muted:#5A6287; --chip:#FFF0E2; --chipText:#B9530A; --promptBg:#F6F7FC;
  --side:#0E1440; --sideText:#F4F6FF; --sideMuted:#B9C2EC; --sideActive:#1B2466; --deep:#0E1440; --deepRGB:14,20,64;
  --shadow:0 8px 26px rgba(var(--deepRGB),.10);
  --fDisplay:'Jua','Noto Sans KR',sans-serif; --fBody:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; --fSoft:'Gowun Dodum','Noto Sans KR',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#0D1230; --card:#161D45; --line:#2A3368; --text:#E9ECF8; --muted:#9EA7CF; --chip:#3A2614; --chipText:#FFB27A; --promptBg:#121a3d; --shadow:0 6px 22px rgba(0,0,0,.35); --ink:#FFC94D; --ink2:#FF9142; color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0D1230; --card:#161D45; --line:#2A3368; --text:#E9ECF8; --muted:#9EA7CF; --chip:#3A2614; --chipText:#FFB27A; --promptBg:#121a3d; --shadow:0 6px 22px rgba(0,0,0,.35); --ink:#FFC94D; --ink2:#FF9142; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--text);font-family:var(--fBody);font-size:15.5px;line-height:1.65;word-break:keep-all}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--side)}
a{color:var(--ink2)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100%}
/* ---------- sidebar ---------- */
.side{background:var(--side);color:var(--sideText);position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow-y:auto;padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;scrollbar-width:thin}
.brand{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;padding:4px 6px 14px}
.brand img{width:52px;height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.brand b{font-family:var(--fDisplay);font-weight:900;font-size:19px;line-height:1.15;display:block}
.brand small{color:var(--sideMuted);font-size:12.5px}
.navhome{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;color:var(--sideText);text-decoration:none;font-weight:700;font-size:14.5px}
.navhome[aria-current="page"],.navhome:hover{background:var(--sideActive)}
.partlab{margin:18px 6px 6px;font-size:11.5px;letter-spacing:.1em;color:var(--sun);font-weight:700}
.stepnav{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;text-decoration:none;color:var(--sideText)}
.stepnav:hover{background:rgba(255,255,255,.07)}
.stepnav[aria-current="page"]{background:var(--sideActive);box-shadow:inset 3px 0 0 var(--sun)}
.stepnav .n{display:none;width:20px;height:20px;border-radius:50%;place-items:center;font-size:11px;font-weight:900;background:var(--mint);color:#fff}
.stepnav.done .n{display:grid}
.stepnav .t{font-weight:700;font-size:14.5px;line-height:1.3}
.sidelinks{margin-top:18px;border-top:1px solid rgba(255,255,255,.12);padding-top:12px;display:grid;gap:2px}
.sidelinks a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--sideText);text-decoration:none;font-size:14px}
.sidelinks a:hover,.sidelinks a[aria-current="page"]{background:var(--sideActive)}
.sidelinks img{width:28px;height:28px;object-fit:contain}
.prog{margin:16px 6px 0;font-size:12px;color:var(--sideMuted)}
.prog .bar{height:6px;border-radius:9px;background:rgba(255,255,255,.12);margin-top:6px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--sun);width:0;transition:width .4s}
/* ---------- topbar (mobile) ---------- */
.top{display:none}
/* ---------- main ---------- */
main{min-width:0;padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1060px;margin:0 auto}
h1,h2,h3{text-wrap:balance;line-height:1.3;margin:0}
h2{font-family:var(--fDisplay);font-weight:900;font-size:25px;color:var(--ink);letter-spacing:-.01em}
h3{font-size:17px;font-weight:900}
.eyebrow{font-size:12px;letter-spacing:.14em;font-weight:700;color:var(--ink2)}
.sec{margin-top:34px;display:grid;gap:14px}
.sechead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sechead p{margin:0;color:var(--muted);font-size:14px}
.cite{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--chipText);background:var(--chip);border-radius:999px;padding:2px 10px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 11px;background:var(--chip);color:var(--chipText)}
.chip.sun{background:var(--sun);color:#2a1600}
/* hero */
.hero{position:relative;border-radius:26px;overflow:hidden;background:var(--deep);color:#fff;box-shadow:var(--shadow);aspect-ratio:16/8.2;max-width:100%}
.hero img{position:absolute;top:0;right:0;bottom:0;left:auto;width:64%;height:100%;object-fit:cover;object-position:28% center}
.hero .shade{position:absolute;inset:0;background:linear-gradient(90deg,var(--deep) 0%,var(--deep) 36%,rgba(var(--deepRGB),.55) 46%,rgba(var(--deepRGB),0) 60%)}
.hero .hcopy{position:relative;padding:clamp(20px,4vw,48px);max-width:560px;display:grid;gap:14px;height:100%;align-content:center}
.hero .tag{justify-self:start;background:#fff;color:var(--deep);font-weight:900;font-size:13px;border-radius:999px;padding:5px 14px}
.hero h1{font-family:var(--fDisplay);font-weight:900;font-size:clamp(28px,4.2vw,48px);line-height:1.22;letter-spacing:-.01em;text-shadow:0 4px 18px rgba(0,0,0,.35)}
.hero h1 em{font-style:normal;color:var(--sun)}
.hero p{margin:0;color:#dfe6f3;font-size:15px}
.hero .who{font-weight:700;color:#fff}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:10px 18px;font-weight:900;font-size:14.5px;text-decoration:none;background:var(--sun);color:#2a1600}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;border:1.5px solid rgba(255,255,255,.4)}
.btn.line{background:var(--card);color:var(--ink2);border:1.5px solid var(--line)}
.btn.small{padding:6px 13px;font-size:13px}
/* timeline */
.timeline{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:10px}
.tl{display:flex;height:46px;border-radius:12px;overflow:hidden;gap:3px}
.tl a{display:grid;place-items:center;text-decoration:none;color:#fff;font-weight:900;font-size:13px;min-width:0;padding:0 4px;text-align:center;line-height:1.15}
.tl a small{display:block;font-weight:500;font-size:10.5px;opacity:.85}
.tlleg{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
/* part cards */
.parts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.part{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.part .pic{aspect-ratio:16/9;background:var(--deep);overflow:hidden}
.part .pic img{width:100%;height:100%;object-fit:cover;object-position:68% 50%}
.part .body{padding:14px 16px 16px;display:grid;gap:8px;align-content:start}
.part .num{font-family:var(--fDisplay);font-weight:700;font-size:13px;color:var(--ink2);letter-spacing:.06em}
.part h3{font-size:16px}
.part ol{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.part li a{display:flex;gap:8px;text-decoration:none;color:var(--text);font-size:13.5px;align-items:baseline}
.part li a b{font-family:var(--fDisplay);font-weight:900;color:var(--ink2);min-width:20px}
/* three panels */
.panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:6px}
.panel b{font-family:var(--fDisplay);font-weight:900;font-size:18px;color:var(--ink)}
.panel p{margin:0;font-size:14px;color:var(--muted)}
.panel .where{font-size:12px;font-weight:700;color:var(--chipText)}
.bookbox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.bookbox img{width:64px}
.bookbox p{margin:0;font-size:14px;color:var(--muted)}
/* step header */
.stephead{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:0;background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
.stephead .l{padding:24px 26px;display:grid;gap:12px;align-content:center}
.stephead .r{position:relative;background:var(--deep);min-height:200px}
.stephead .r img.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:70% 50%;opacity:.95}
.stephead .r img.ico{position:absolute;right:14px;bottom:10px;width:110px;filter:drop-shadow(0 10px 16px rgba(0,0,0,.35))}
.snum{display:flex;align-items:center;gap:12px}
.snum b{font-family:var(--fDisplay);font-weight:900;font-size:14px;color:#fff;background:var(--ink2);border-radius:999px;padding:4px 14px}
.snum span{color:var(--muted);font-size:13px;font-weight:700}
.stephead h1{font-family:var(--fDisplay);font-weight:900;font-size:clamp(22px,2.7vw,31px);color:var(--ink);letter-spacing:-.01em}
.goal{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;background:var(--promptBg);border-radius:14px;padding:12px 14px}
.goal i{font-style:normal;font-weight:900;color:#2a1600;background:var(--sun);border-radius:8px;padding:2px 8px;font-size:12.5px;white-space:nowrap}
.goal p{margin:0;font-weight:700}
.intro{margin:0;max-width:72ch;font-family:var(--fSoft);font-size:16.5px;line-height:1.8}
/* files */
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.file{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;color:var(--text)}
.file:hover{border-color:var(--ink2)}
.file .k{width:44px;height:52px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:900;color:#fff;background:var(--coral)}
.file .k.png{background:var(--mint)} .file .k.txt{background:#7a7598} .file .k.hwp,.file .k.hwpx{background:#2b8fd6} .file .k.jpg{background:#d99a00} .file .k.xlsx{background:#1f8a4c}
.file b{display:block;font-size:14px;line-height:1.35}
.file small{color:var(--muted);font-size:12px}
.filebig{grid-template-columns:52px minmax(0,1fr) auto}
.filebig .dl{font-size:13px;font-weight:900;color:var(--ink2);white-space:nowrap}
/* todo */
.todo{counter-reset:t;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.todo li{counter-increment:t;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 48px;position:relative;font-weight:700;font-size:14px;line-height:1.45}
.todo li::before{content:counter(t);position:absolute;left:12px;top:11px;width:26px;height:26px;border-radius:50%;background:var(--ink2);color:#fff;display:grid;place-items:center;font-family:var(--fBody);font-weight:900;font-size:13px}
/* captures */
.caps{display:grid;gap:18px}
.cap{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:16px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.shot{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);cursor:zoom-in;background:#fff}
.shot img{display:block;width:100%;height:auto}
.mk{position:absolute;border:3px solid var(--coral);border-radius:6px;pointer-events:none}
.mk.green{border-color:var(--mint)}
.mk b{position:absolute;left:-13px;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:900;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.mk.green b{background:var(--mint)}
.capinfo{display:grid;gap:10px;align-content:start;padding:4px 2px}
.capinfo h3{font-size:16px}
.capinfo ol{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.capinfo li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:9px;font-size:14px;line-height:1.5}
.capinfo li b{width:24px;height:24px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font-size:12.5px}
.capinfo li.green b{background:var(--mint)}
/* formula */
.formula{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fx{border-radius:16px;padding:14px 16px;display:grid;gap:4px;background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c)}
.fx b{font-family:var(--fDisplay);font-weight:900;font-size:20px;color:var(--c)}
.fx span{font-size:13px;color:var(--muted)}
.fx em{font-style:normal;font-size:13.5px;font-weight:700}
/* prompts */
.prompts{display:grid;gap:14px}
.prompt{background:var(--promptBg);border:1.5px solid color-mix(in srgb,var(--ink2) 35%,transparent);border-radius:18px;padding:16px 18px;display:grid;gap:10px}
.phead{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pid{font-family:var(--fBody);font-weight:900;font-size:13px;color:#fff;background:var(--ink2);border-radius:8px;padding:2px 9px}
.phead h3{font-size:15.5px;flex:1 1 220px;min-width:0}
.pwhere{font-size:13px;color:var(--muted)}
.pwhere b{color:var(--text)}
.ptext{margin:0;white-space:pre-wrap;font-family:var(--fBody);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14.5px;line-height:1.75;max-height:none}
.pfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.copy{border:0;border-radius:999px;background:var(--ink2);color:#fff;font-weight:900;font-size:13.5px;padding:8px 16px;display:inline-flex;gap:6px;align-items:center}
.copy.ok{background:var(--mint)}
/* results */
.results{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.results.wide{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.res{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--card);cursor:zoom-in;padding:0}
.res img{display:block;width:100%;height:auto}
.res figcaption{font-size:12.5px;padding:8px 10px;color:var(--muted)}
/* tips */
.tips{display:grid;gap:8px}
.tip{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;background:var(--card);border:1px dashed color-mix(in srgb,var(--ink2) 45%,transparent);border-radius:14px;padding:12px 14px;font-size:14px}
.tip b{font-family:var(--fDisplay);font-weight:900;color:var(--ink2);font-size:14px}
.challenge{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:center;background:linear-gradient(120deg,var(--deep),var(--ink2));color:#fff;border-radius:18px;padding:14px 18px}
.challenge img{width:72px}
.challenge b{font-family:var(--fDisplay);font-weight:900;font-size:17px;color:var(--sun);display:block}
.challenge p{margin:0;font-size:14.5px}
/* checks */
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.check{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;text-align:left;color:var(--text)}
.check .box{width:28px;height:28px;border-radius:8px;border:2.5px solid var(--ink2);display:grid;place-items:center;color:#fff;font-weight:900}
.check.on .box{background:var(--mint);border-color:var(--mint)}
.check b{display:block;font-size:15.5px}
.check span{font-size:13.5px;color:var(--muted)}
/* footer nav */
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:40px;flex-wrap:wrap}
.pager a{flex:1 1 240px;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px;color:var(--text);display:grid;gap:2px}
.pager a small{color:var(--muted);font-size:12px}
.pager a b{font-size:15px}
.pager a.next{text-align:right}
.donebtn{border:2px solid var(--mint);background:transparent;color:var(--mint);font-weight:900;border-radius:999px;padding:9px 18px}
.donebtn.on{background:var(--mint);color:#fff}
/* prompt library */
.search{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search input{flex:1 1 260px;min-width:0;border:1.5px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:10px 16px;font:inherit}
.filter{border:1.5px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.filter[aria-pressed="true"]{background:var(--ink2);border-color:var(--ink2);color:#fff}
.empty{color:var(--muted);text-align:center;padding:30px}
/* character pipeline */
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.fl{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column}
.fl:not(:last-child)::after{content:'→';position:absolute;right:-16px;top:70px;font-family:var(--fDisplay);font-size:22px;color:var(--ink2);z-index:2}
.fl .pic{aspect-ratio:1/1;background:#fff8e6;border-radius:18px 18px 0 0;display:grid;place-items:center;overflow:hidden;cursor:zoom-in}
.fl .pic{position:relative}
.fl .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.fl .pic.cover img{width:100%;height:100%;object-fit:cover}
.fl .b{padding:10px 12px 12px;display:grid;gap:4px}
.fl .b i{font-style:normal;font-family:var(--fDisplay);font-size:14px;color:var(--ink2)}
.fl .b b{font-size:15px}
.fl .b span{font-size:13px;color:var(--muted)}
.fl .pin{margin-top:4px;grid-column:auto}
.fl .pin summary{padding:7px 10px;font-size:13px}
.fl .pin summary::after{content:'▾'}
.fl .pin[open] summary::after{content:'▴'}
.cutter{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.cutter img{width:100%;border-radius:12px;display:block}
.cutter b{font-family:var(--fDisplay);font-weight:900;font-size:19px;color:var(--ink)}
.cutter p{margin:4px 0 10px;font-size:14px;color:var(--muted)}
@media (max-width:900px){.flow{grid-template-columns:repeat(2,minmax(0,1fr))}.fl:nth-child(2)::after{display:none}.cutter{grid-template-columns:1fr}}
/* inline prompt under a capture step */
.pin{grid-column:2;margin-top:6px;background:var(--promptBg);border:1.5px solid color-mix(in srgb,var(--ink2) 35%,transparent);border-radius:12px}
.capinfo .pin.solo{margin-left:33px}
.pin summary{cursor:pointer;list-style:none;padding:7px 12px;font-weight:900;font-size:13.5px;color:var(--ink2);display:flex;align-items:center;gap:8px}
.pin summary::-webkit-details-marker{display:none}
.pin summary .pid{font-size:13px}
.pin summary::after{content:'펼치기 ▾';margin-left:auto;font-size:12px;color:var(--muted);font-weight:700}
.pin[open] summary::after{content:'접기 ▴'}
.pin .pset{padding:0 12px 6px;font-size:12px;color:var(--muted)}
.pin .ptext{margin:0 10px;font-size:13.5px;padding:10px 12px;line-height:1.7}
.pin .pfoot{padding:8px 10px 10px;display:flex;justify-content:flex-end}
/* live links to NotebookLM */
.livebox{background:var(--promptBg);border:1.5px solid color-mix(in srgb,var(--ink2) 30%,transparent);border-radius:18px;padding:14px 16px;display:grid;gap:10px}
.livebox .lh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.livebox .lh b{font-family:var(--fDisplay);font-weight:900;font-size:17px;color:var(--ink)}
.livebox .lh span{font-size:12.5px;color:var(--muted)}
.live{display:flex;flex-wrap:wrap;gap:8px}
.lv{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:8px 15px;background:var(--card);border:1.5px solid color-mix(in srgb,var(--ink2) 40%,transparent);color:var(--ink2);font-weight:900;font-size:14px;text-decoration:none}
.lv:hover{background:var(--ink2);color:#fff}
.nbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.nb{display:grid;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-decoration:none;color:var(--text)}
.nb:hover{border-color:var(--ink2)}
.nb b{font-size:15.5px}
.nb span{font-size:13px;color:var(--muted)}
.nb em{font-style:normal;font-size:13px;font-weight:900;color:var(--ink2)}
.res figcaption a.go{display:inline-block;margin-top:4px;font-weight:900;text-decoration:none}
/* trend keywords */
.trend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tr{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;align-items:start;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--sun);border-radius:18px;padding:16px}
.tr img{width:76px;height:auto}
.trn{font-size:11.5px;font-weight:900;letter-spacing:.08em;color:var(--ink2)}
.tr h3{font-family:var(--fDisplay);font-weight:900;font-size:19px;color:var(--ink);margin:2px 0 8px}
.tr h3 small{display:block;font-family:var(--fBody);font-size:12px;font-weight:700;color:var(--muted)}
.tr p{margin:0 0 6px;font-size:13.5px;line-height:1.55}
.tr p b{display:block;font-size:11.5px;color:var(--mint);font-weight:900}
.tline{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.tline li{padding:12px 14px;display:grid;gap:2px;position:relative;border-left:1px solid var(--line)}
.tline li:first-child{border-left:0}
.tline li:last-child{background:linear-gradient(135deg,var(--deep),var(--ink2));color:#fff}
.tline .ty{font-size:12px;font-weight:900;color:var(--sun);font-variant-numeric:tabular-nums}
.tline b{font-size:14.5px}
.tline span:not(.ty){font-size:12.5px;color:var(--muted)}
.tline li:last-child span:not(.ty){color:#dce5f3}
/* three faces */
.faces{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.face{background:linear-gradient(160deg,var(--deep),var(--sideActive));color:#fff;border-radius:20px;padding:18px;display:grid;gap:6px;justify-items:start;position:relative;overflow:hidden}
.face img{width:84px;height:auto;filter:drop-shadow(0 8px 12px rgba(0,0,0,.35))}
.face .fn{font-size:11.5px;font-weight:900;letter-spacing:.08em;color:var(--sun)}
.face b{font-family:var(--fDisplay);font-weight:900;font-size:19px}
.face p{margin:0;font-size:13.5px;color:#d9e2f1;line-height:1.6}
/* scenarios */
.scen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px;position:relative}
.sc img{position:absolute;right:10px;top:8px;width:58px}
.sc .sck{font-family:var(--fDisplay);font-weight:900;color:#fff;background:var(--ink2);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px}
.sc b{font-size:16px;padding-right:56px}
.sc p{margin:0;font-size:13.5px;color:var(--muted)}
.sc .scp{display:grid;gap:6px;margin-top:auto;padding-top:6px}
.sc .pin{grid-column:auto;margin:0}
/* duty (교감이 챙기는 연수) */
.duty{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.dt{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--sun);border-radius:16px;padding:14px 14px 12px;display:grid;gap:5px;align-content:start}
.dt .dk{font-size:13px;color:var(--muted);font-weight:700}
.dt b{font-family:var(--fDisplay);font-weight:900;font-size:19px;line-height:1.25;color:var(--ink)}
.dt p{margin:0;font-size:13.5px;line-height:1.55}
.dt small{color:var(--ink2);font-size:11.5px;font-weight:700}
.dutynote{margin:10px 0 0;font-size:13px;color:var(--muted)}
@media (max-width:900px){.duty{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.duty{grid-template-columns:1fr}}
/* review (typo check) */
.review{background:var(--card);border:1.5px dashed var(--coral);border-radius:18px;padding:16px 18px;display:grid;gap:10px}
.review p{margin:0;font-size:14px}
.review ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.review li{display:flex;align-items:center;gap:6px;background:var(--promptBg);border-radius:999px;padding:5px 12px;font-size:13.5px}
.review s{color:var(--coral);text-decoration-thickness:2px}
.review li span{color:var(--muted)}
.review li b{color:var(--mint)}
/* discussion */
.closing{position:relative;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);background:var(--deep)}
.closing img{width:100%;display:block}
.closing .ccap{position:absolute;left:0;right:0;bottom:0;padding:18px 22px 20px;background:linear-gradient(180deg,rgba(var(--deepRGB),0),rgba(var(--deepRGB),.82) 32%);color:#fff;text-align:center;display:grid;gap:6px}
.closing .ccap p{margin:0;font-weight:700;font-size:clamp(13px,1.6vw,17px);color:#e6ecf7}
.closing .ccap b{font-family:var(--fDisplay);font-weight:900;font-size:clamp(17px,2.4vw,27px);line-height:1.35;color:#fff}
@media (max-width:560px){.closing .ccap{position:static;background:var(--deep)}}
.discuss{background:linear-gradient(120deg,var(--deep),var(--ink2));color:#fff;border-radius:20px;padding:20px 22px;display:grid;gap:10px}
.discuss .dl{justify-self:start;background:var(--sun);color:#2a1600;font-weight:900;font-size:12.5px;border-radius:999px;padding:3px 12px}
.discuss p{margin:0;font-family:var(--fDisplay);font-weight:700;font-size:clamp(17px,2vw,21px);line-height:1.55}
.refs{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px;display:grid;gap:3px}
.results.info2{grid-template-columns:minmax(0,.62fr) minmax(0,1.38fr);align-items:start}
.nbs.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:900px){.trend,.faces,.scen{grid-template-columns:1fr}.tline{grid-template-columns:repeat(2,minmax(0,1fr))}.tline li:nth-child(3){border-left:0}.results.info2{grid-template-columns:1fr}}
@media (max-width:560px){.nbs.two{grid-template-columns:1fr}.tline{grid-template-columns:1fr}.tline li{border-left:0;border-top:1px solid var(--line)}}
/* lightbox */
.lb{position:fixed;inset:0;z-index:80;background:rgba(8,14,28,.9);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb .in{position:relative;max-width:min(1400px,100%);max-height:100%;overflow:auto}
.lb img{display:block;max-width:100%;height:auto;border-radius:10px}
.lb .x{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));border:0;border-radius:999px;background:#fff;color:var(--deep);font-weight:900;padding:8px 14px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink2);color:#fff;font-weight:700;border-radius:999px;padding:10px 18px;z-index:90;box-shadow:var(--shadow)}
@media (max-width:1100px){.parts{grid-template-columns:repeat(2,minmax(0,1fr))}.results{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(320px,88vw);height:100%;z-index:70;transform:translateX(-102%);transition:transform .25s;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(6,10,22,.55)}
  .top{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--side);color:#fff;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top button{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:6px 12px;font-weight:900}
  .top b{font-family:var(--fDisplay);font-weight:900;font-size:16px}
  .top img{width:30px}
  .cap{grid-template-columns:1fr}
  .stephead{grid-template-columns:1fr}.stephead .r{min-height:150px;order:-1}
  .panels,.formula{grid-template-columns:1fr}
  .hero{aspect-ratio:auto}.hero img{width:100%;object-position:62% center}.hero .shade{background:linear-gradient(180deg,rgba(var(--deepRGB),.35),rgba(var(--deepRGB),.94) 62%)}.hero .hcopy{padding-top:180px}
}
@media (max-width:560px){.parts,.checks,.nbs{grid-template-columns:1fr}.results{grid-template-columns:repeat(2,minmax(0,1fr))}body{font-size:15px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}


body{font-synthesis:none}
h2,.stephead h1,.hero h1,.brand b,.part h3,.panel b,.fx b,.closing .ccap b,.discuss p,.challenge b,.tip b,.top b,.ap b,.pp b{font-weight:400}
.hero h1{font-size:clamp(30px,4.4vw,52px);line-height:1.2}
.hero .hcopy{max-width:600px}
.brand img{width:60px}
.stephead .r img.ico{width:120px}
.sidelinks img{width:30px;height:30px}
/* roles */
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.role{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:4px;border-top:5px solid var(--c)}
.role .em{font-size:30px;line-height:1}
.role b{font-family:var(--fDisplay);font-weight:400;font-size:21px;color:var(--ink)}
.role i{font-style:normal;font-size:12.5px;font-weight:900;color:var(--c)}
.role p{margin:0;font-size:13.5px;color:var(--muted)}
/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;counter-reset:pp}
.pp{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 16px 14px;display:grid;gap:4px;counter-increment:pp}
.pp::before{content:counter(pp);position:absolute;right:14px;top:10px;font-family:var(--fDisplay);font-size:34px;color:color-mix(in srgb,var(--ink2) 22%,transparent)}
.pp:not(:last-child)::after{content:'→';position:absolute;right:-14px;top:50%;transform:translateY(-50%);font-size:20px;color:var(--ink2);z-index:2}
.pp b{font-family:var(--fDisplay);font-size:22px;color:var(--ink)}
.pp i{font-style:normal;font-size:12.5px;font-weight:900;color:var(--ink2)}
.pp p{margin:0;font-size:13.5px;color:var(--muted)}
/* warn */
.warn{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;background:color-mix(in srgb,var(--coral) 9%,var(--card));border:2px solid color-mix(in srgb,var(--coral) 55%,transparent);border-radius:16px;padding:14px 16px;font-weight:700}
.warn span{font-size:24px}
/* apply */
.apply{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.ap{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:6px;align-content:start}
.ap .bd{justify-self:start;font-family:var(--fDisplay);font-size:15px;color:#fff;background:var(--ink2);border-radius:10px;padding:2px 10px}
.ap b{font-family:var(--fDisplay);font-size:19px;color:var(--ink)}
.ap p{margin:0;font-size:13.5px;color:var(--muted)}
/* formula 4 */
.formula.f4{grid-template-columns:repeat(4,minmax(0,1fr))}
/* home extras */
.other{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:16px;align-items:center;background:linear-gradient(120deg,var(--deep),var(--ink2));color:#fff;border-radius:20px;padding:16px 20px;text-decoration:none}
.other img{width:120px;border-radius:12px}
.other b{font-family:var(--fDisplay);font-weight:400;font-size:20px;display:block}
.other span{font-size:13.5px;color:#e3e9f6}
.other em{font-style:normal;font-weight:900;background:var(--sun);color:#2a1600;border-radius:999px;padding:8px 14px;white-space:nowrap}
.mascot{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
.mascot img{width:100%;height:auto}
.hello{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 18px}
.hello img{width:110px}
.hello p{margin:0;font-family:var(--fSoft);font-size:16px;line-height:1.75}
.hello b{color:var(--ink2)}
.livebox .lh b{font-weight:400}
.lv.file{border-style:dashed}
.results .res img{aspect-ratio:16/10;object-fit:cover;object-position:left top}
.results.wide .res img{aspect-ratio:16/10}
@media (max-width:900px){.roles,.pipe,.formula.f4{grid-template-columns:repeat(2,minmax(0,1fr))}.pp:nth-child(2)::after{display:none}.other{grid-template-columns:1fr}.other img{display:none}.mascot{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (max-width:560px){.roles,.pipe,.formula.f4{grid-template-columns:1fr}.pp::after{display:none}.hello{grid-template-columns:72px minmax(0,1fr)}.hello img{width:72px}}

/* ===== 튜터 출동! 시즌 2 additions ===== */
.side{background:radial-gradient(120% 60% at 0% 0%,#1B2466 0%,#0E1440 60%)}
.brand img{width:58px;border-radius:50%;background:#fff3;padding:2px}
.hello{border:2px solid color-mix(in srgb,var(--ink2) 25%,var(--line))}
.goal{margin-top:2px}
.blk{display:grid;gap:12px}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:18px}
.tbl table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
.tbl th{background:var(--deep);color:#fff;text-align:left;padding:10px 14px;font-weight:900;font-size:13.5px}
.tbl td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
.tbl td:first-child{font-weight:900;white-space:nowrap;color:var(--ink)}
.tbl tr:nth-child(even) td{background:color-mix(in srgb,var(--chip) 45%,transparent)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.cd{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;gap:4px;align-content:start}
.cd .em{font-size:28px;line-height:1.1}
.cd b{font-family:var(--fDisplay);font-weight:400;font-size:19px;color:var(--ink)}
.cd p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55}
.cards.bad .cd{border-color:color-mix(in srgb,var(--coral) 40%,var(--line));background:color-mix(in srgb,var(--coral) 5%,var(--card))}
.cards.bad .cd b{color:var(--coral)}
.cards.sun .cd{border-top:5px solid var(--sun)}
.safer{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.sf{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:4px;align-content:start;position:relative}
.sf .L{font-family:var(--fDisplay);font-size:44px;line-height:1;color:var(--ink2)}
.sf i{font-style:normal;font-size:12px;font-weight:900;color:var(--muted);letter-spacing:.04em}
.sf b{font-size:16px;color:var(--ink)}
.sf p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.sf:not(:last-child)::after{content:'›';position:absolute;right:-10px;top:22px;font-size:26px;color:var(--ink2);z-index:2}
.scene{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:0;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.scene .sb{padding:16px 18px;display:grid;gap:10px;align-content:start}
.scene .sb p{margin:0;font-size:14.5px;line-height:1.7}
.scene .pic{background:var(--deep);min-height:180px;position:relative}
.scene .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rolechips{display:flex;flex-wrap:wrap;gap:6px}
.rolechips span{font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 11px;background:var(--chip);color:var(--chipText)}
.reveal{background:var(--promptBg);border:1.5px solid color-mix(in srgb,var(--ink2) 35%,transparent);border-radius:14px}
.reveal summary{cursor:pointer;list-style:none;padding:9px 14px;font-weight:900;font-size:14px;color:var(--ink2)}
.reveal summary::-webkit-details-marker{display:none}
.reveal summary::after{content:' ▾'}
.reveal[open] summary::after{content:' ▴'}
.reveal ul{margin:0;padding:0 14px 12px 32px;display:grid;gap:6px;font-size:14px;line-height:1.65}
.fill{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 18px;display:grid;gap:10px}
.fill p{margin:0;font-family:var(--fSoft);font-size:17px;line-height:1.9}
.blank{border:0;border-bottom:3px solid var(--ink2);background:var(--chip);color:transparent;font:inherit;font-weight:900;border-radius:6px 6px 0 0;padding:0 10px;min-width:5.5em;cursor:pointer;text-shadow:0 0 0 transparent}
.blank::before{content:'?';color:var(--ink2)}
.blank.on{color:var(--ink2)}
.blank.on::before{content:''}
.quiz{background:linear-gradient(135deg,color-mix(in srgb,var(--sun) 16%,var(--card)),var(--card));border:1.5px solid color-mix(in srgb,var(--sun) 60%,var(--line));border-radius:18px;padding:16px 18px;display:grid;gap:10px}
.quiz .qh{display:flex;gap:10px;align-items:flex-start}
.quiz .qh span{font-family:var(--fDisplay);background:var(--deep);color:var(--sun);border-radius:10px;padding:2px 10px;font-size:15px;white-space:nowrap}
.quiz .qh b{font-size:15.5px;line-height:1.55}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.opt{border:1.5px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;line-height:1.45}
.opt:hover{border-color:var(--ink2)}
.opt.ok{border-color:var(--mint);background:color-mix(in srgb,var(--mint) 12%,var(--card));font-weight:900}
.opt.no{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 10%,var(--card));text-decoration:line-through}

const FILE_BASE='files/';
const K='dt26-'+C.key;
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stepById=Object.fromEntries(C.steps.map(s=>[s.id,s]));
const partById=Object.fromEntries(C.parts.map(p=>[p.id,p]));
const ICO=n=>'art/'+n+'.webp';
const small=a=>a.replace('.webp','_s.webp');
let done={};try{done=JSON.parse(localStorage.getItem(K+'-done')||'{}')}catch(e){done={}}
const saveDone=()=>{try{localStorage.setItem(K+'-done',JSON.stringify(done))}catch(e){}};
let checks={};try{checks=JSON.parse(localStorage.getItem(K+'-checks')||'{}')}catch(e){checks={}}
function fileUrl(k){return FILE_BASE+encodeURIComponent(C.files[k].name)}
function linkOf(u){return u.startsWith('files:')?{href:fileUrl(u.slice(6)),file:true}:{href:u,file:false}}
function renderNav(){
  let h='';
  C.parts.forEach(p=>{
    h+=`<div class="partlab">PART ${p.num} · ${esc(p.title.split(' — ')[0])}</div>`;
    p.steps.forEach(id=>{const s=stepById[id];
      h+=`<a class="stepnav${done[id]?' done':''}" href="#${id}" data-view="${id}"><span class="t">${s.num}. ${esc(s.short)}</span><span class="n">✓</span></a>`;});
  });
  $('#stepNav').innerHTML=h;
  const n=Object.keys(done).filter(k=>done[k]).length;
  $('#progText').textContent=`완료 ${n} / ${C.steps.length}단계`;
  $('#progBar').style.width=(n/C.steps.length*100)+'%';
}
function shot(c,cls=''){
  const mk=(c.marks||[]).map(m=>`<span class="mk ${m[5]==='green'?'green':''}" style="left:${m[0]/c.w*100}%;top:${m[1]/c.h*100}%;width:${m[2]/c.w*100}%;height:${m[3]/c.h*100}%"><b>${m[4]}</b></span>`).join('');
  return `<div class="shot ${cls}" data-zoom="${esc(c.img)}" role="button" tabindex="0" aria-label="${esc(c.title)} 크게 보기"><img src="${esc(c.img)}" alt="${esc(c.title)}" loading="lazy" width="${c.w}" height="${c.h}">${mk}</div>`;
}
const PBY={};C.steps.forEach(s=>(s.prompts||[]).forEach(p=>PBY[p.id]=p));
function pin(pid,cls=''){const p=PBY[pid];if(!p)return '';
  return `<details class="pin ${cls}"><summary><span class="pid">${p.id}</span>📋 붙여 넣을 프롬프트</summary><pre class="ptext">${esc(p.text)}</pre><div class="pfoot"><button class="copy" data-copy="${p.id}">복사하기</button></div></details>`;}
function capCard(c){
  const colorOf=n=>{const m=(c.marks||[]).find(x=>x[4]===n);return m&&m[5]==='green'?'green':''};
  const at=n=>(c.pr||[]).filter(x=>x[0]===n).map(x=>pin(x[1])).join('');
  const li=(c.steps||[]).map((t,i)=>`<li class="${colorOf(i+1)}"><b>${i+1}</b><span>${esc(t)}</span>${at(i+1)}</li>`).join('');
  const solo=(c.pr||[]).filter(x=>x[0]===0).map(x=>pin(x[1],'solo')).join('');
  return `<div class="cap">${shot(c)}<div class="capinfo"><h3>${esc(c.title)}</h3>${li?`<ol>${li}</ol>`:''}${solo}</div></div>`;
}
function promptCard(p){
  return `<article class="prompt" id="${p.id}"><div class="phead"><span class="pid">${p.id}</span><h3>${esc(p.title)}</h3><span class="chip sun">${esc(p.tool)}</span></div>
  <div class="pwhere">붙여 넣을 곳 · <b>${esc(p.where)}</b></div>
  <pre class="ptext">${esc(p.text)}</pre>
  <div class="pfoot"><span></span><button class="copy" data-copy="${p.id}">복사하기</button></div></article>`;
}
function fileChip(k){const f=C.files[k];const kk=f.kind.toLowerCase();
  return `<a class="file" href="${fileUrl(k)}" target="_blank" rel="noopener" download><span class="k ${kk}">${f.kind}</span><span><b>${esc(f.label)}</b><small>${esc(f.use)}${f.size?' · '+f.size:''}</small></span></a>`;}
function liveBox(list){
  if(!list||!list.length) return '';
  return `<section class="sec"><div class="livebox"><div class="lh"><b>바로 열기</b><span>새 탭에서 열려요 · 휴대폰 · 태블릿에서도 그대로</span></div><div class="live">${list.map(([i,t,u])=>{const L=linkOf(u);const inpage=L.href.startsWith('#');return `<a class="lv${L.file?' file':''}" href="${esc(L.href)}"${inpage?'':' target="_blank" rel="noopener"'}${L.file?' download':''}>${i} ${esc(t)}${L.file?' ↓':(inpage?' →':' ↗')}</a>`}).join('')}</div></div></section>`;
}

/* ---------- interactive blocks ---------- */
function burst(el){const r=el.getBoundingClientRect();for(let i=0;i<14;i++){const s=document.createElement('i');s.className='spark';s.textContent=['⭐','✨','💛','🎉'][i%4];s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.setProperty('--dx',(Math.random()*240-120)+'px');s.style.setProperty('--dy',(-Math.random()*160-40)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),900);}}
function gsAnswer(btn){
  const box=document.getElementById(btn.dataset.gs);if(box.dataset.lock==='1')return;
  const items=JSON.parse(box.dataset.items);let i=+box.dataset.i;const it=items[i];const g=+btn.dataset.g;
  const fb=box.querySelector('.gfb');const card=box.querySelector('.gcard');
  if(g===it[1]){box.dataset.ok=+box.dataset.ok+1;box.dataset.streak=+box.dataset.streak+1;btn.classList.add('ok');card.classList.add('okc');fb.className='gfb ok';fb.textContent='딩동댕! '+it[1]+'학년 — '+it[2];burst(btn);}
  else{box.dataset.streak=0;btn.classList.add('no');card.classList.add('shake');fb.className='gfb no';fb.textContent='아쉬워요, 정답은 '+it[1]+'학년 — '+it[2];}
  fb.hidden=false;box.dataset.lock='1';
  box.querySelector('.gscore').textContent='맞힘 '+box.dataset.ok;
  const st=+box.dataset.streak;box.querySelector('.gstreak').textContent=st>=3?('🔥 '+st+'연속!'):'';
  setTimeout(()=>{i++;box.dataset.lock='0';box.querySelectorAll('.gbtn').forEach(b=>b.classList.remove('ok','no'));card.classList.remove('okc','shake');
    if(i>=items.length){card.innerHTML=`<i>🏆</i><b>${box.dataset.ok} / ${items.length} 맞혔어요!</b><span class="gsub">${+box.dataset.ok>=items.length-2?'교재 박사 튜터! 학년별 흐름이 머릿속에 쏙':'위의 교재 카드를 다시 보고 한 번 더 도전해요'}</span>`;box.querySelector('.gbtns').innerHTML=`<button class="gbtn g0" data-gs-reset>다시 하기 ↻</button>`;fb.hidden=true;box.querySelector('[data-gs-reset]').onclick=()=>{box.dataset.i=0;box.dataset.ok=0;box.dataset.streak=0;box.querySelector('.gbtns').innerHTML=[1,2,3].map(g=>`<button class="gbtn g${g}" data-gs="${box.id}" data-g="${g}">${g}학년</button>`).join('');gsShow(box,0);};if(+box.dataset.ok>=items.length-2)burst(card);return;}
    box.dataset.i=i;gsShow(box,i);fb.hidden=true;},1500);
}
function gsShow(box,i){const items=JSON.parse(box.dataset.items);box.querySelector('.gcard').innerHTML=`<i>📖</i><b>${esc(items[i][0])}</b><span class="gsub">${esc(box.dataset.qq)}</span>`;box.querySelector('.gcount').textContent=(i+1)+' / '+items.length;box.querySelector('.gscore').textContent='맞힘 '+box.dataset.ok;box.querySelector('.gstreak').textContent='';}
function ldPick(btn){
  const box=document.getElementById(btn.dataset.ld);const nx=+box.dataset.next;const k=+btn.dataset.k;const fb=box.querySelector('.lfb');
  if(k===nx){const slot=box.querySelector(`[data-slot="${k}"]`);slot.classList.add('on');slot.innerHTML=`<span>${k+1}</span>${btn.innerHTML}`;btn.remove();box.dataset.next=nx+1;fb.hidden=true;
    if(nx+1===+box.dataset.n){fb.hidden=false;fb.className='lfb ok';fb.textContent='완성! 많이 돕기 → 조금 돕기 → 스스로. 학생이 어느 칸에 있는지 보고 한 칸씩 손을 놓아요.';burst(slot);const r=document.createElement('button');r.className='btn line';r.textContent='다시 하기 ↻';r.onclick=()=>route();fb.after(r);}}
  else{btn.classList.add('shake');setTimeout(()=>btn.classList.remove('shake'),450);fb.hidden=false;fb.className='lfb no';fb.textContent=(nx+1)+'번째 칸은 지금보다 도움이 '+(k>nx?'조금 더 많은':'더 적은')+' 단계예요. 다시 골라 볼까요?';}
}
let DRT=null;
function drAct(btn){
  const box=document.getElementById(btn.dataset.dr);const items=JSON.parse(box.dataset.items);const act=btn.dataset.act;
  const tbtn=box.querySelector('[data-act="timer"]'),sbtn=box.querySelector('[data-act="show"]'),tm=box.querySelector('.dtime');
  if(act==='pick'){clearInterval(DRT);let used=(box.dataset.used||'').split(',').filter(Boolean).map(Number);if(used.length>=items.length)used=[];let i;do{i=Math.floor(Math.random()*items.length)}while(used.includes(i)&&used.length<items.length);used.push(i);box.dataset.used=used.join(',');box.dataset.i=i;
    const [img,grade,sit,model]=items[i];const st=box.querySelector('.dstage');st.innerHTML=`<div class="dcard spin"><img src="${esc(img)}" alt=""><div><span class="dg">${esc(grade)}</span><b>${esc(sit)}</b><p class="dmodel" hidden>💡 ${esc(model)}</p></div></div>`;
    tbtn.disabled=false;sbtn.disabled=false;tm.textContent='1:00';tm.classList.remove('end');btn.textContent='🎴 다른 카드 뽑기';return}
  if(act==='timer'){clearInterval(DRT);let s=60;tm.textContent='1:00';tm.classList.remove('end');DRT=setInterval(()=>{s--;tm.textContent='0:'+String(s).padStart(2,'0');if(s<=0){clearInterval(DRT);tm.textContent='시간 끝!';tm.classList.add('end');}},1000);return}
  if(act==='show'){const m=box.querySelector('.dmodel');if(m){m.hidden=false;const img=box.querySelector('.dcard img');if(img)img.src=img.src.replace('_sad.webp','_ok.webp');}return}
}
/* ---------- blocks ---------- */
let QID=0;
function sh(t,sub){return t?`<div class="sechead"><h2>${esc(t)}</h2>${sub?`<p>${esc(sub)}</p>`:''}</div>`:''}
function block(b){
  if(b.type==='table') return `<section class="sec">${sh(b.title,b.sub)}<div class="tbl"><table><thead><tr>${b.head.map(h=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`;
  if(b.type==='cards') return `<section class="sec">${sh(b.title,b.sub)}<div class="cards ${b.tone||''}">${b.items.map(([e,t,p])=>`<div class="cd"><span class="em" aria-hidden="true">${e}</span><b>${esc(t)}</b><p>${esc(p)}</p></div>`).join('')}</div></section>`;
  if(b.type==='safer') return `<section class="sec">${sh(b.title,'순서대로 — 학생 안전이 언제나 먼저')}<div class="safer">${b.items.map(([L,en,k,p])=>`<div class="sf"><span class="L">${L}</span><i>${esc(en)}</i><b>${esc(k)}</b><p>${esc(p)}</p></div>`).join('')}</div></section>`;
  if(b.type==='scene') return `<section class="sec">${sh(b.title,'역할을 나눠 1분 롤플레이')}<div class="scene"><div class="sb"><p>${esc(b.situation)}</p><div class="rolechips">${b.roles.map(r=>`<span>${esc(r)}</span>`).join('')}</div><details class="reveal"><summary>튜터 대응 예시 보기</summary><ul>${b.answer.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></details></div><div class="pic"><img src="${esc(b.img)}" alt="" loading="lazy"></div></div></section>`;
  if(b.type==='fill') return `<section class="sec">${sh(b.title,b.sub)}<div class="fill">${b.items.map(([a,ans,c])=>`<p>${esc(a)} <button class="blank" data-blank aria-label="빈칸 — 눌러서 답 보기">${esc(ans)}</button>${esc(c)}</p>`).join('')}</div></section>`;
  if(b.type==='quiz'){const id='q'+(QID++);return `<section class="sec"><div class="quiz" id="${id}"><div class="qh"><span>확인 문제</span><b>${esc(b.q)}</b></div><div class="opts">${b.opts.map((o,i)=>`<button class="opt" data-q="${id}" data-i="${i}" data-a="${b.a}">${['①','②','③','④','⑤'][i]} ${esc(o)}</button>`).join('')}</div><p class="why" hidden>✅ ${esc(b.why)}</p></div></section>`;}
  if(b.type==='quote') return `<section class="sec"><div class="quote"><i>${esc(b.label)}</i><p>${esc(b.text)}</p></div></section>`;
  if(b.type==='books') return `<section class="sec">${sh(b.title,b.sub)}<div class="books">${b.items.map(k=>`<article class="bk"><div class="cv" data-zoom="${esc(k.img)}" role="button" tabindex="0" aria-label="${esc(k.grade)} 표지 크게 보기"><img src="${esc(k.img)}" alt="디지털은 내 친구 ${esc(k.grade)} 표지" loading="lazy"></div><div class="bb"><span class="g">${esc(k.grade)}</span><b>${esc(k.name)}</b><span class="f">${esc(k.focus)}</span><ul>${k.units.map(u=>`<li>${esc(u)}</li>`).join('')}</ul>${k.pdf?`<a class="bkdl" href="${esc(k.pdf)}" download="${esc(k.dlname||'')}" target="_blank" rel="noopener">📥 교재 PDF 받기 <small>${esc(k.size||'')}</small></a>`:''}</div></article>`).join('')}</div>${b.all?`<div class="bkall">${b.items.filter(k=>k.pdf).map(k=>`<a href="${esc(k.pdf)}" download="${esc(k.dlname||'')}" target="_blank" rel="noopener">📥 ${esc(k.grade)} 교재 <small>${esc(k.size||'')}</small></a>`).join('')}</div>`:''}</section>`;
  if(b.type==='pages') return `<section class="sec">${sh(b.title,b.sub)}<div class="pages">${b.items.map(([src,cap])=>`<figure data-zoom="${esc(src)}" role="button" tabindex="0" aria-label="${esc(cap)} 크게 보기"><img src="${esc(src)}" alt="${esc(cap)}" loading="lazy"><figcaption>${esc(cap)}</figcaption></figure>`).join('')}</div></section>`;
  if(b.type==='gradesort'){const id='gs'+(QID++);return `<section class="sec">${sh(b.title,b.sub)}<div class="gsort" id="${id}" data-i="0" data-ok="0" data-streak="0" data-items='${esc(JSON.stringify(b.items))}' data-qq="${esc(b.q||'이 활동은 몇 학년 교재에 나올까요?')}"><div class="gtop"><span class="gcount">1 / ${b.items.length}</span><span class="gscore">맞힘 0</span><span class="gstreak"></span></div><div class="gcard"><i>📖</i><b>${esc(b.items[0][0])}</b><span class="gsub">${esc(b.q||'이 활동은 몇 학년 교재에 나올까요?')}</span></div><div class="gbtns">${(b.grades||[1,2,3]).map(g=>`<button class="gbtn g${g}" data-gs="${id}" data-g="${g}">${g}학년</button>`).join('')}</div><p class="gfb" hidden></p></div></section>`;}
  if(b.type==='flippages') return `<section class="sec">${sh(b.title,b.sub)}<div class="flips">${b.items.map(([src,cap,tip])=>`<button class="flip" data-flip><span class="fin"><span class="ffront"><img src="${esc(src)}" alt="${esc(cap)}" loading="lazy"><em>${esc(cap)}</em><i class="fhint">눌러서 튜터 포인트 ↻</i></span><span class="fback"><b>튜터 포인트</b><span>${esc(tip)}</span><em>${esc(cap)}</em></span></span></button>`).join('')}</div></section>`;
  if(b.type==='flipcards') return `<section class="sec">${sh(b.title,b.sub)}<div class="flips small">${b.items.map(([ic,t,kid,say])=>`<button class="flip" data-flip><span class="fin"><span class="ffront txt"><i class="fic">${esc(ic)}</i><b>${esc(t)}</b><span class="kidsay">${esc(kid)}</span><i class="fhint">눌러서 튜터의 한마디 ↻</i></span><span class="fback"><b>튜터의 한마디</b><span class="tsay">${esc(say)}</span><em>${esc(t)}</em></span></span></button>`).join('')}</div></section>`;
  if(b.type==='ladder'){const id='ld'+(QID++);const order=b.items.map((x,i)=>i);const sh2=order.slice().sort((a,c)=>((a*7+3)%b.items.length)-((c*7+3)%b.items.length));return `<section class="sec">${sh(b.title,b.sub)}<div class="ladder" id="${id}" data-next="0" data-n="${b.items.length}"><div class="lrail">${b.items.map((x,i)=>`<div class="lslot" data-slot="${i}"><span>${i+1}</span></div>`).join('')}</div><div class="lpool">${sh2.map(i=>`<button class="lbtn" data-ld="${id}" data-k="${i}"><b>${esc(b.items[i][0])}</b><small>${esc(b.items[i][1])}</small></button>`).join('')}</div><p class="lfb" hidden></p></div></section>`;}
  if(b.type==='draw'){const id='dr'+(QID++);return `<section class="sec">${sh(b.title,b.sub)}<div class="draw" id="${id}" data-items='${esc(JSON.stringify(b.items))}' data-i="-1"><div class="dstage"><div class="dcard back"><span class="dq">?</span><b>상황 카드</b><small>${b.items.length}장 중 한 장</small></div></div><div class="dctrl"><button class="btn" data-dr="${id}" data-act="pick">🎴 카드 뽑기</button><button class="btn line" data-dr="${id}" data-act="timer" disabled>⏱️ 1분 시작</button><button class="btn line" data-dr="${id}" data-act="show" disabled>💡 모범 멘트</button><span class="dtime">1:00</span></div></div></section>`;}
  if(b.type==='video') return `<section class="sec">${sh(b.title,b.sub||'썸네일을 누르면 유튜브에서 열려요')}<div class="vids">${b.items.map(([v,t,sub])=>`<a class="vid" href="https://www.youtube.com/watch?v=${esc(v)}" target="_blank" rel="noopener"><span class="vimg"><img src="yt/${esc(v)}.webp" alt="" loading="lazy"><i aria-hidden="true">▶</i></span><b>${esc(t)}</b><small>${esc(sub)}</small></a>`).join('')}</div></section>`;
  if(b.type==='guide') return `<section class="sec"><div class="guide"><div class="gh"><b>📘 ${esc(b.title)}</b><span>교재 원문을 튜터 눈높이로 옮겼어요</span></div><ul>${b.items.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div></section>`;
  if(b.type==='sitestrip'){const ss=b.ids.map(id=>SBY[id]).filter(Boolean);return `<section class="sec">${sh(b.title,b.sub)}<div class="sitegrid">${ss.map(siteCard).join('')}</div><p class="more"><a class="btn line" href="#gallery">갤러리에서 46곳 모두 보기 →</a></p></section>`;}
  if(b.type==='flow') return `<section class="sec">${sh(b.title,b.sub)}<div class="flow2">${b.items.map(([i,t,p])=>`<div class="fw"><i>${esc(i)}</i><b>${esc(t)}</b><p>${esc(p)}</p></div>`).join('')}</div></section>`;
  return '';
}
function gameCards(){return C.games.map(g=>`<a class="game" href="${esc(g.href)}" target="_blank" rel="noopener"><div class="gpic"><img src="${esc(g.img)}" alt="" loading="lazy"><span class="chip">${esc(g.chip)}</span></div><div class="gbody"><b>${esc(g.title)}</b><span>${esc(g.text)}</span><em>플레이 ▶</em></div></a>`).join('');}
function viewGames(){return `<section class="sec" style="margin-top:0"><div class="eyebrow">GAMES</div><h2>${esc(C.gamesTitle)}</h2><p class="intro">${esc(C.gamesIntro)}</p><div class="games">${gameCards()}</div></section>`;}
function viewHome(){
  const parts=C.parts.map(p=>`<article class="part"><div class="pic"><img src="${small(p.art)}" alt="${esc(p.title)} 그림" loading="lazy"></div><div class="body"><span class="num">PART ${p.num}</span><h3>${esc(p.title)}</h3><ol>${p.steps.map(id=>{const s=stepById[id];return `<li><a href="#${id}"><b>${s.num}.</b><span>${esc(s.short)}</span></a></li>`}).join('')}</ol></div></article>`).join('');
  const pipe=C.pipeline.map(([b,i,p])=>`<div class="pp"><i>${esc(i)}</i><b>${esc(b)}</b><p>${esc(p)}</p></div>`).join('');
  const picks=SITES.filter(x=>x.pick).slice(0,6);
  const cats=CATS.map(([k,e,n,d])=>`<a class="catbtn" href="#gallery" data-gocat="${k}"><i>${e}</i><b>${esc(n)}</b><small>${SITES.filter(x=>x.cat===k).length}곳 · ${esc(d)}</small></a>`).join('');
  return `<section class="hero"><img src="${C.cover}" alt="${esc(C.coverAlt)}"><div class="shade"></div>
   <div class="hcopy"><span class="tag">${esc(C.meta.target)}</span><h1>${C.hero.h1}</h1>

function siteFilter(x){
  if(gcat!=='all'&&x.cat!==gcat) return false;
  if(gopt.free&&!x.tags.includes('가입 없음')) return false;
  if(gopt.ko&&!x.tags.includes('한국어')) return false;
  if(gopt.nocam&&(x.tags.includes('카메라')||x.tags.includes('마이크'))) return false;
  if(gopt.pick&&!x.pick) return false;
  if(gopt.fav&&!fav[x.id]) return false;
  if(gq){const t=(x.name+x.en+x.one+x.how+x.unit+x.tip+x.tags.join(' ')).toLowerCase();if(!t.includes(gq.toLowerCase()))return false;}
  return true;
}

function route(){
  let v=(location.hash||'#home').slice(1);
  if(!(v==='home'||v==='games'||v==='gallery'||stepById[v]||/^T\d+b?$/.test(v))) v='home';
  let target=null;
  if(/^T\d+b?$/.test(v)){const s=C.steps.find(s=>(s.prompts||[]).some(p=>p.id===v));target=v;v=s?s.id:'home';}
  QID=0;
  const html=v==='home'?viewHome():v==='games'?viewGames():v==='gallery'?viewSites():viewStep(stepById[v]);
  $('#view').innerHTML=html;
  document.querySelectorAll('[data-view]').forEach(a=>{if(a.dataset.view===v)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  $('#side').classList.remove('open');
  if(target){const el=document.getElementById(target);if(el)el.scrollIntoView({block:'start'});}else if(!KEEP)window.scrollTo(0,0);KEEP=false;
  const t={home:C.meta.title,games:'게임으로 실습',gallery:'AI 사이트 갤러리'}[v]||('STEP '+stepById[v].num+' · '+stepById[v].short);
  document.title=t+' | '+C.meta.suffix;
}

  const dr=e.target.closest('[data-dr]');if(dr){drAct(dr);return}
  const fv=e.target.closest('[data-fav]');if(fv){const id=fv.dataset.fav;fav[id]=!fav[id];if(!fav[id])delete fav[id];saveFav();document.querySelectorAll(`[data-fav="${CSS.escape(id)}"]`).forEach(b=>{b.classList.toggle('on',!!fav[id]);b.textContent=fav[id]?'★':'☆';b.setAttribute('aria-pressed',!!fav[id])});const fb=document.getElementById('favbox');if(fb)fb.outerHTML=favPanel();toast(fav[id]?'찜했어요 ★':'찜을 풀었어요');if(gopt.fav&&location.hash==='#gallery'){KEEP=true;route();}return}
  const fc=e.target.closest('[data-favcopy]');if(fc){const t=favList().map((x,i)=>`${i+1}. ${x.name} (${x.en}) — ${x.one}\n   ${x.url}`).join('\n');const done=()=>toast('찜 목록을 복사했어요');try{navigator.clipboard.writeText('고학년 SW·AI 사이트 찜 목록\n'+t).then(done,()=>toast('복사가 안 되면 목록을 길게 눌러 복사하세요'))}catch(_){toast('복사가 안 되면 목록을 길게 눌러 복사하세요')}return}
  const fx=e.target.closest('[data-favclear]');if(fx){fav={};saveFav();KEEP=true;route();toast('찜 목록을 비웠어요');return}
  const gc=e.target.closest('[data-gcat]');if(gc){gcat=gc.dataset.gcat;KEEP=true;route();return}
  const go=e.target.closest('[data-gopt]');if(go){const k=go.dataset.gopt;gopt[k]=!gopt[k];KEEP=true;route();return}
  const gk=e.target.closest('[data-gocat]');if(gk){gcat=gk.dataset.gocat;return}
  const jp=e.target.closest('[data-jump]');if(jp){e.preventDefault();const el=document.getElementById('site-'+jp.dataset.jump);if(el){el.scrollIntoView({block:'center'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1200)}else{gcat='all';gopt={free:false,ko:false,nocam:false,pick:false,fav:false};gq='';KEEP=true;route();setTimeout(()=>{const el2=document.getElementById('site-'+jp.dataset.jump);if(el2)el2.scrollIntoView({block:'center'})},50)}return}
  const f=e.target.closest('[data-filter]');if(f){pf=f.dataset.filter;route();return}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const z=e.target.closest&&e.target.closest('[data-zoom]');if(z)openLB(z.dataset.zoom)}});
document.addEventListener('input',e=>{if(e.target.id==='gq'){gq=e.target.value.trim();const pos=e.target.selectionStart;KEEP=true;route();const i=$('#gq');i.focus();i.setSelectionRange(pos,pos);return}if(e.target.id==='pq'){pq=e.target.value.trim();const pos=e.target.selectionStart;route();const i=$('#pq');i.focus();i.setSelectionRange(pos,pos)}});
$('#menuBtn').addEventListener('click',()=>$('#side').classList.toggle('open'));
$('#main').addEventListener('click',()=>$('#side').classList.remove('open'));

window.addEventListener('hashchange',route);
renderNav();route();

</script>
</body>
</html>
