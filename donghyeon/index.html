<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>동현초 연수 길잡이</title>
<meta name="description" content="패들렛 순서 그대로 따라가는 바이브코딩 연수 길잡이">
<meta property="og:title" content="동현초 연수 길잡이">
<meta property="og:image" content="https://hongdonedu.github.io/fungigame2026/donghyeon/img/home.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#FBF6EF; --surface:#FFFFFF; --sunken:#F5EEE4; --ink:#2A2340; --muted:#6E6684; --line:#ECE2D4;
  --side:#211B3D; --side-2:#2C2550; --side-ink:#F4EFFF; --side-muted:#A99FCB; --side-line:rgba(255,255,255,.09);
  --gold:#F5B342; --shadow:0 1px 2px rgba(42,35,64,.06),0 8px 24px -12px rgba(42,35,64,.18);
  --display:'Jua','Noto Sans KR',system-ui,sans-serif; --body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#16122A; --surface:#211B3A; --sunken:#1B1631; --ink:#F3EEFF; --muted:#AFA6CB; --line:#342C55;
  --side:#110E22; --side-2:#1E1938; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.25;margin:0;text-wrap:balance}
img{max-width:100%;display:block}
[hidden]{display:none!important}

/* ── 틀 ── */
.app{display:flex;height:100dvh;overflow:hidden}
.side{width:288px;flex:none;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:18px 14px 16px;gap:4px;z-index:40;overflow:hidden;
  background-image:radial-gradient(120% 60% at 0% 0%,rgba(245,179,66,.16),transparent 60%),radial-gradient(90% 50% at 100% 100%,rgba(166,75,211,.22),transparent 65%)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 12px}
.brand .orb{width:30px;height:30px;border-radius:50%;flex:none;background:radial-gradient(circle at 32% 30%,#fff 0 12%,transparent 13%),conic-gradient(from 210deg,#F5B342,#E2588C,#7458F5,#2C87DB,#16A589,#F5B342);box-shadow:0 0 18px rgba(245,179,66,.55)}
.brand b{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.01em}
.brand small{display:block;font-size:12px;color:var(--side-muted);margin-top:-3px}
.brand .x{margin-left:auto;display:none;background:none;border:0;color:var(--side-muted);font-size:22px;width:36px;height:36px;border-radius:10px}
.side-label{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--side-muted);padding:10px 10px 6px}
.nav{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin:0 -4px;padding:0 4px;scrollbar-width:thin}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;padding:6px 10px;border-radius:12px;text-align:left;color:var(--side-ink);transition:background .15s}
.nav button:hover{background:var(--side-line)}
.nav button[aria-current="true"]{background:var(--side-2);box-shadow:inset 3px 0 0 var(--c)}
.nav .ic{width:28px;height:28px;border-radius:10px;flex:none;display:grid;place-items:center;font-family:var(--display);font-size:16px;background:color-mix(in srgb,var(--c) 26%,transparent);color:#fff;border:1px solid color-mix(in srgb,var(--c) 55%,transparent)}
.nav .tx{flex:1;min-width:0}
.nav .tx b{display:block;font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .tx small{display:block;font-size:12px;color:var(--side-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .ok{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;border:1.5px solid var(--side-line);color:transparent}
.nav button.done .ok{background:var(--c);border-color:var(--c);color:#fff}
.side-foot{border-top:1px solid var(--side-line);padding-top:12px;margin-top:8px;display:flex;flex-direction:column;gap:10px}
.who{display:flex;align-items:center;gap:12px;padding:4px 6px}
.who .face{width:58px;height:58px;border-radius:18px;flex:none;background:linear-gradient(160deg,#FFF6E8,#F6E3FF);overflow:hidden;position:relative}
.who .face img{position:absolute;left:50%;top:6px;width:84%;transform:translateX(-50%)}
.who b{display:block;font-size:15px}
.who small{font-size:12.5px;color:var(--side-muted)}
.prog{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--side-muted);padding:0 6px}
.prog .bar{flex:1;height:7px;border-radius:9px;background:var(--side-line);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#F5B342,#E2588C,#7458F5);transition:width .4s}
.prog b{color:var(--side-ink);font-variant-numeric:tabular-nums}
.padlet-btn{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border-radius:12px;padding:9px 12px;background:rgba(255,255,255,.08);border:1px solid var(--side-line);font-weight:700;font-size:14px}
.padlet-btn:hover{background:rgba(255,255,255,.14)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(8px)}
.menu{display:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:18px}
.crumb{font-family:var(--display);font-size:18px;display:flex;align-items:center;gap:8px;min-width:0}
.crumb .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.crumb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;text-decoration:none;white-space:nowrap}
.page{flex:1;overflow-y:auto;scroll-behavior:smooth}
.wrap{max-width:1080px;margin:0 auto;padding-block:22px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:26px}

/* ── 배너 ── */
.banner{position:relative;border-radius:28px;overflow:hidden;background:#2a2140;min-height:300px;display:flex;align-items:flex-end;box-shadow:var(--shadow);isolation:isolate}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;object-position:center 32%;transform:scale(1.02);transition:transform 8s ease}
.banner:hover img{transform:scale(1.06)}
.banner::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(18,12,36,.86) 0%,rgba(18,12,36,.5) 42%,rgba(18,12,36,0) 72%)}
.banner .in{padding:26px 28px;color:#fff;display:flex;flex-direction:column;gap:8px;max-width:760px}
.step-tag{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:5px 13px 5px 6px;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);font-weight:700;font-size:14px;border:1px solid rgba(255,255,255,.22)}
.step-tag i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--c);font-family:var(--display);font-size:15px}
.banner h1{font-size:clamp(26px,4vw,40px);text-shadow:0 2px 14px rgba(0,0,0,.35)}
.banner p{margin:0;font-size:clamp(15px,1.8vw,18px);opacity:.92;max-width:44em}
.banner.big{min-height:min(62vh,520px)}
.banner.big h1{font-size:clamp(30px,5vw,52px)}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:14px;padding:10px 18px;font-weight:700;font-size:15px;text-decoration:none;transition:transform .12s,filter .12s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
.btn.gold{background:var(--gold);color:#2A1C00}
.btn.glass{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.3)}

/* ── 섹션 ── */
.sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-h h2{font-size:24px}
.sec-h span{color:var(--muted);font-size:14px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:12px;counter-reset:s}
.steps li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px 14px 54px;position:relative;min-width:0;font-size:15px;line-height:1.55}
.steps li::before{content:counter(s);position:absolute;left:14px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);font-family:var(--display);font-size:17px}
.steps code,.desc code{font-family:ui-monospace,Consolas,monospace;font-size:.9em;background:var(--sunken);padding:1px 6px;border-radius:6px;word-break:break-all}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.trio div{border-radius:20px;padding:16px;background:color-mix(in srgb,var(--c) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 25%,var(--line));display:flex;flex-direction:column;gap:2px}
.trio .e{font-size:30px;line-height:1}
.trio b{font-family:var(--display);font-weight:400;font-size:21px}
.trio code{font-family:ui-monospace,Consolas,monospace;font-weight:700;color:var(--c);font-size:14px}
.trio small{color:var(--muted);font-size:13.5px}
.tip{display:flex;gap:12px;align-items:flex-start;border-radius:18px;padding:14px 16px;background:color-mix(in srgb,var(--gold) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 40%,var(--line));font-size:15px}
.tip b{white-space:nowrap}

/* 오늘의 순서 타일 */
.flow{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:20px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.tile .th{aspect-ratio:16/9;position:relative;overflow:hidden;background:var(--sunken)}
.tile .th img{width:100%;height:100%;object-fit:cover}
.tile .th i{position:absolute;left:10px;top:10px;font-style:normal;min-width:30px;height:30px;padding:0 6px;border-radius:10px;display:grid;place-items:center;background:var(--c);color:#fff;font-family:var(--display);font-size:16px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.tile .tx{padding:10px 14px 13px;display:flex;flex-direction:column;gap:1px}
.tile b{font-family:var(--display);font-weight:400;font-size:18px}
.tile small{color:var(--muted);font-size:13px}
.tile.done .tx b::after{content:" ✓";color:var(--c)}

/* 카드 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:9px;min-width:0;box-shadow:0 1px 0 rgba(42,35,64,.03)}
.card .k{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kind{font-size:12px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,transparent);color:color-mix(in srgb,var(--c) 80%,var(--ink))}
.tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.card h3{font-size:20px}
.card .desc{margin:0;color:var(--muted);font-size:14.5px;line-height:1.55}
.card .pics{display:flex;gap:8px;background:repeating-conic-gradient(var(--sunken) 0% 25%,var(--surface) 0% 50%) 0 0/14px 14px;border-radius:14px;padding:8px;justify-content:center}
.card .pics{flex-wrap:wrap}.pics figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:5px}.pics img{max-height:140px;width:auto;min-width:0;object-fit:contain}.pics.many img{max-height:92px}.pics.many .dl{font-size:11px;padding:2px 6px}.pics .dl{font-size:12px;font-weight:700;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px 8px;white-space:nowrap}.pics .dl:hover{border-color:var(--c,#F5B342)}
.card .row{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px}
.b{display:inline-flex;align-items:center;gap:6px;border-radius:11px;padding:7px 12px;font-size:14px;font-weight:700;text-decoration:none;border:1px solid var(--line);background:var(--surface)}
.b:hover{background:var(--sunken)}
.b.main{background:var(--c);border-color:var(--c);color:#fff}
.b.main:hover{filter:brightness(1.07);background:var(--c)}
.b.copied{background:#16A589;border-color:#16A589;color:#fff}
details.pr{border-radius:14px;background:var(--sunken);border:1px solid var(--line)}
details.pr summary{cursor:pointer;list-style:none;padding:8px 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
details.pr summary::-webkit-details-marker{display:none}
details.pr summary::before{content:"▸";color:var(--c);transition:transform .15s}
details.pr[open] summary::before{transform:rotate(90deg)}
details.pr summary .cp{margin-left:auto}
details.pr pre{margin:0;padding:0 14px 14px;white-space:pre-wrap;word-break:break-word;font-family:var(--body);font-size:13.5px;line-height:1.6;max-height:320px;overflow:auto}
.links{display:flex;flex-wrap:wrap;gap:8px}

.pager{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:20px}
.pager a,.pager button{flex:1 1 200px;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:12px 16px;text-align:left;text-decoration:none;display:flex;flex-direction:column;gap:1px}
.pager small{color:var(--muted);font-size:12.5px}
.pager b{font-family:var(--display);font-weight:400;font-size:18px}
.pager .next{text-align:right}
.pager .mark{flex:0 1 auto;align-items:center;justify-content:center;text-align:center;background:color-mix(in srgb,var(--c) 12%,var(--surface));border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
.pager .mark.on{background:var(--c);color:#fff;border-color:var(--c)}

/* 마무리 */
.closing{position:relative;border-radius:28px;overflow:hidden;min-height:min(78vh,640px);display:flex;align-items:flex-end;isolation:isolate;box-shadow:var(--shadow)}
.closing img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.closing::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(20,12,30,.88) 0%,rgba(20,12,30,.55) 34%,rgba(20,12,30,0) 64%)}
.closing .in{padding:34px 34px 38px;color:#fff;display:flex;flex-direction:column;gap:10px;max-width:820px}
.closing h1{font-size:clamp(28px,4.4vw,46px);text-shadow:0 2px 16px rgba(0,0,0,.4)}
.closing p{margin:0;font-family:var(--display);font-size:clamp(20px,2.6vw,28px);color:#FFE2A8}
.recap{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.recap button{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 12px;text-align:left;display:flex;gap:10px;align-items:center}
.recap i{font-style:normal;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--c);color:#fff;font-family:var(--display);flex:none}
.recap span{font-size:14px;font-weight:700;min-width:0}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:#211B3D;color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;font-size:14.5px;transition:.25s;z-index:90;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.scrim{display:none}

.view{animation:rise .35s ease both;display:flex;flex-direction:column;gap:26px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}.banner img{transition:none}}

@media (max-width:920px){
  .side{position:fixed;top:0;bottom:0;left:0;transform:translateX(-104%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 60px rgba(0,0,0,.4);padding-top:max(18px,env(safe-area-inset-top,0px));padding-left:max(14px,env(safe-area-inset-left,0px))}
  .app.open .side{transform:none}
  .app.open .scrim{display:block;position:fixed;inset:0;background:rgba(10,6,24,.45);z-index:35}
  .brand .x{display:grid;place-items:center}
  .menu{display:grid;place-items:center}
  .top{padding-top:max(10px,env(safe-area-inset-top,0px))}
}
@media (max-width:800px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){
  .wrap{padding-block:14px 48px}
  .view{gap:20px}
  .steps{grid-template-columns:minmax(0,1fr)}
  .banner,.banner.big{display:block;min-height:0;border-radius:22px;background:#241C3F}
  .banner img{position:relative;aspect-ratio:16/9;height:auto;transform:none}
  .banner::before{display:none}
  .banner .in{padding:16px 18px 20px}
  .trio{grid-template-columns:1fr;gap:8px}
  .trio div{display:grid;grid-template-columns:auto auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:12px 14px}
  .trio .e{grid-row:1/3;font-size:28px}
  .trio b{font-size:19px}
  .trio small{grid-column:2/4}
  .cards{grid-template-columns:minmax(0,1fr)}
  .flow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile b{font-size:16px}
  .closing{min-height:520px;border-radius:22px}
  .closing .in{padding:22px}
  .chip .lbl{display:none}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" aria-label="오늘의 순서">
    <div class="brand"><span class="orb" aria-hidden="true"></span><div><b>연수 길잡이</b><small>동현초 · 10월 27일</small></div><button class="x" id="closeBtn" aria-label="목록 닫기">✕</button></div>
    <div class="side-label">오늘의 순서</div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="who"><div class="face"><img src="../gwangnam/1026/img/teacher.png" alt=""></div><div><small>명진초</small><b>최일훈 선생님</b></div></div>
      <div class="prog"><span>진행</span><div class="bar"><i id="progBar"></i></div><b id="progTx">0/9</b></div>
      <a class="padlet-btn" id="padletSide" target="_blank" rel="noopener">📌 패들렛 열기</a>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <header class="top">
      <button class="menu" id="menuBtn" aria-label="순서 열기">☰</button>
      <div class="crumb" id="crumb"><span class="dot"></span><span></span></div>
      <div class="sp"></div>
      <a class="chip" id="padletTop" target="_blank" rel="noopener">📌 <span class="lbl">패들렛</span></a>
    </header>
    <div class="page" id="page"><div class="wrap" id="view"></div></div>
  </main>
</div>

<script>

S와 JavaScript는 전부 index.html 안에 넣고, 다른 파일(css.html, js.html 등)이나 <?= ?> 템플릿 문법은 쓰지 마.\n2. 웹 앱으로 배포할 거야. doGet()은 HtmlService.createHtmlOutputFromFile('index')를 돌려주고, .addMetaTag('viewport', 'width=device-width, initial-scale=1')을 붙여서 휴대폰에서도 잘 보이게 해.\n3. 화면에서 저장·조회는 google.script.run(withSuccessHandler / withFailureHandler)으로 Code.gs 함수를 호출해.\n4. 시트는 SpreadsheetApp.openByUrl(위 시트 주소)로 열어. 필요한 탭이 없으면 만들고, 비어 있으면 처음 실행할 때 헤더 행을 자동으로 써 줘.\n5. 외부 라이브러리·CDN 없이 순수 HTML/CSS/JS만. 화면의 모든 문구는 한국어.\n6. 출력: 코드 블록 두 개(각 블록 첫 줄에 // 파일명 주석), 중간 생략(\"...\", \"나머지는 동일\") 없이 전체 코드. 코드 다음에 배포 순서를 4줄로."}, {"kind": "시트", "title": "칭찬 게시판 냉장고", "desc": "칭찬이 쌓이는 구글 시트", "tags": [], "url": "https://docs.google.com/spreadsheets/d/191NiJdqJrz8q2yy_hV-lUeLB2zkmudtGB8-tbfJPLN0/edit?gid=0#gid=0", "padlet": "https://padlet.com/oneteacher/1027-ai-s024v9bx5ad6wymbbapb/wish/9kmlZV5KbKlVQpgV"}], "links": [["구글 스프레드시트", "https://docs.google.com/spreadsheets/u/0/"], ["구글 앱스 스크립트", "https://script.google.com/home/?hl=ko"]]}, {"id": "s6", "num": "⑥", "label": "식재료 납품", "short": "공용 API · 급식 · 날씨", "color": "#3C9A4A", "art": "../gwangnam/1026/img/s6.webp", "title": "재료는 매일 납품받아요", "analogy": "급식 · 날씨 같은 데이터는 기관이 매일 보내 줘요. 우리는 요리만 하면 돼요.", "steps": ["제미나이에 <b>\"공용 API 찾아줘\"</b>", "나이스 포털에서 <b>학교 코드</b> 알아내기 (동현초 C10 · 7191065)", "급식 프롬프트의 <b>학교 코드만 바꾸기</b>", "날씨 · 포켓몬처럼 <b>키 없는 API</b>는 HTML 하나로"], "cards": [{"kind": "프롬프트", "title": "공용 API 찾기", "desc": "제미나이에 그대로 물어보기", "tags": [], "padlet": "https://padlet.com/oneteacher/1027-ai-s024v9bx5ad6wymbbapb/wish/LNV1Q7r7o7DOamq3", "prompts": [["API 찾기", "HTML로 바로 호출 가능한 활용할 수 있는 공용 API 찾아줘"]]}, {"kind": "프롬프트", "title": "학교 정보 API 찾기", "desc": "급식 · 학사일정 · 시간표", "tags": [], "padlet": "https://padlet.com/oneteacher/1027-ai-s024v9bx5ad6wymbbapb/wish/E1P8aXbNDN9jZwA9", "prompts": [["학교 정보 API", "우리 학교 급식 · 학사일정 · 시간표 같은 학교 정보를 가져올 수 있는 사이트 주소와 공공 API를 알려 줘. 학교 코드 찾는 방법도 같이."]]}, {"kind": "사이트", "title": "나이스 교육정보 개방 포털", "desc": "급식 · 학사일정 · 시간표 API가 모여 있는 곳", "tags": [], "url": "https://open.neis.go.kr/portal/mainPage.do", "padlet": "https://padlet.com/oneteacher/1027-ai-s024v9bx5ad6wymbbapb/wish/lkROZPwJYJvXQjMg"}, {"kind": "자료", "title": "학교 코드 알아내기", "desc": "동현초등학교 → 교육청 C10(부산) · 학교 7191065", "tags": [], "url": "https://open.neis.go.kr/hub/schoolInfo?Type=json&SCHUL_NM=%EB%8F%99%ED%98%84%EC%B4%88%EB%93%B1%ED%95%99%EA%B5%90", "padlet": "https://padlet.com/oneteacher/1027-ai-s024v9bx5ad6wymbbapb/wish/Ae2Rav0eKeA4Znz4"}, {"kind": "앱", "title": "급식 알리미 (광남초 예시)", "desc": "어제 · 오늘 · 내일 급식을 앱스 스크립트로 — Code.gs의 학교 코드만 7191065로 바꾸면 동현초", "tags": [], "url": "https://script.google.com/macros/s/AKfycbyjaWCym7W-Bqt4Tray6-hd3-NFvLg1F-iMQPZWh_c5ngUzmVa_GfOVrOR2uK5u9XxtkQ/exec", "padlet": "https://padlet.com/oneteacher/1027-ai-s024v9bx5ad6wymbbapb/wish/R7dXadM5J54mQ6bl"}, {"kind": "프롬프트", "title": "오늘의 급식 만들기", "desc": "녹산초 예시 — Code.gs 맨 위 학교 코드만 바꾸면 우리 학교 (동현초 C10 · 7191065)", "tags": [], "padlet": "https://padlet.com/oneteacher/1027-ai-s024v9bx5ad6wymbbapb/wish/PR3NWxqzBzjpab0O", "prompt": "나는 부산 녹산초등학교 교사야. 우리 학교 오늘 급식을 보여 주는 웹앱을 앱스 스크립트로 만들려고 해. Code.gs와 index.html 코드가 필요해.\n[API]\n나이스 교육정보 개방포털 급식식단정보 API를 Code.gs에서 UrlFetchApp으로 호출해(브라우저에서 직접 부르지 말고).\n호출 주소 형식:\nhttps://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&ATPT_OFCDC_SC_CODE=C10&SD_SCHUL_CODE=7201106&MLSV_YMD=(YYYYMMDD)\n- Code.gs 맨 위에 상수로: OFFICE_CODE = \"C10\"(부산교육청), SCHOOL_CODE = \"7201211\"(녹산초등학교), SCHOOL_NAME = \"녹산초등학교\", API_KEY = \"\". 다른 학교는 이 값만 바꾸면 되게.\n- API_KEY가 비어 있으면 주소에 KEY 파라미터를 붙이지 마(인증키 없이도 5건까지 나오고 하루 급식은 그 안에 들어가). 값이 있으면 &KEY=값 을 붙여.\n- 날짜는 화면이 아니라 Code.gs에서 만들어. Utilities.formatDate(날짜, \"Asia/Seoul\", \"yyyyMMdd\")를 써서 한국 시간 기준으로.\n- 응답 구조: 성공하면 mealServiceDietInfo[1].row[0]에 데이터가 있고, 그 안의 DDISH_NM(메뉴), CAL_INFO(칼로리), MMEAL_SC_NM(식사명, 보통 \"중식\"), MLSV_YMD(날짜)를 써. 급식이 없는 날은 mealServiceDietInfo 대신 RESULT.CODE가 \"INFO-200\"으로 오니까 그때는 \"오늘은 급식이 없어요 🙂\"를 보여 줘. 그 외 오류는 \"급식 정보를 가져오지 못했어요. 잠시 후 다시 눌러 주세요\".\n- DDISH_NM은 메뉴가 <br/>로 이어져 있고, 메뉴 이름 뒤에 알레르기 번호가 괄호로 붙어 있어(예: \"감자국 (5.6.13)\"). <br/>로 나눠 한 줄씩 보여 주고, 괄호 안 번호는 메뉴 이름과 분리해서 작은 회색 글씨로.\n- 알레르기 번호의 뜻을 화면 맨 아래 작은 글씨로 표시: 1 난류, 2 우유, 3 메밀, 4 땅콩, 5 대두, 6 밀, 7 고등어, 8 게, 9 새우, 10 돼지고기, 11 복숭아, 12 토마토, 13 아황산류, 14 호두, 15 닭고기, 16 쇠고기, 17 오징어, 18 조개류(굴·전복·홍합 포함), 19 잣.\n[화면]\n① 맨 위: \"화명초등학교 오늘 급식\" + 날짜(9월 28일 월요일처럼 한국어, 요일 포함)\n② [◀ 어제] [오늘] [내일 ▶] 버튼으로 날짜 이동. 이동해도 제목 날짜가 같이 바뀌게.\n③ 메뉴를 카드 안에 한 줄씩 크게(첫 줄이 밥, 둘째 줄이 국인 경우가 많으니 순서 그대로), 알레르기 번호는 각 줄 오른쪽에 작게\n④ 카드 아래에 칼로리(CAL_INFO)를 작게, 식사명(MMEAL_SC_NM)도 함께\n⑤ 불러오는 동안 \"급식을 가져오는 중…\", 급식 없는 날과 오류는 위 문구대로\n⑥ 하루 안에 같은 날짜를 다시 누르면 다시 부르지 않게 화면 안에서 기억(객체에 저장)\n[디자인]\n글씨 크게, 색은 부드럽게(연노랑·연주황 계열, 급식판 느낌), 학생에게 다정한 말투로. 휴대폰 세로 화면에서도 잘 보이게. 자동 새로고침은 넣지 마.\n[기술 조건 — 반드시 지켜 줘]\n1. 파일은 딱 두 개만: Code.gs, index.html. CSS와 JavaScript는 전부 index.html 안에 넣고, 다른 파일(css.html, js.html 등)이나 <?= ?> 템플릿 문법은 쓰지 마.\n2. 웹 앱으로 배포할 거야. doGet()은 HtmlService.createHtmlOutputFromFile('index')를 돌려주고, .addMetaTag('viewport', 'width=device-width, initial-scale=1')을 붙여 줘.\n3. 화면에서 조회는 google.script.run(withSuccessHandler / withFailureHandler)으로 Code.gs 함수를 호출해. 화면은 날짜 오프셋(-1, 0, +1)만 넘기고, 실제 날짜 계산과 API 호출·정리는 전부 Code.gs에서.\n4. UrlFetchApp.fetch에는 muteHttpExceptions: true를 넣고, 응답 코드가 200이 아니면 오류 메시지로 처리해.\n5. 외부 라이브러리·CDN 없이 순수 HTML/CSS/JS만. 화면의 모든 문구는 한국어.\n6. 출력: 코드 블록 두 개(각 블록 첫 줄에 // 파일명 주석), 중간 생략(\"...\", \"나머지는 동일\") 없이 전체 코드. 코드 다음에 배포 순서를 4줄로."}, {"kind": "앱", "title": "동현초 기상 관측소", "desc": "키 없는 Open-Meteo 날씨 API · HTML 하나 — 동현초(부산 금정구 동현로 36) 좌표", "tags": ["5학년 과학", "날씨와 우리 생활"], "url": "https://hongdonedu.github.io/foodweb/extra/weather.html", "padlet": "https://padlet.com/oneteacher/1027-ai-s024v9bx5ad6wymbbapb/wish/dMA1W8wxlxPvZ4OV", "prompt": "너는 초등학교 과학 선생님을 돕는 웹 개발자야. 5학년 과학 '날씨와 우리 생활' 단원에서 쓸 '동현초 기상 관측소' 웹앱을 HTML 파일 하나로 만들어줘.\n성취기준: [6과06-01] 기상 요소를 조사하고, 날씨가 우리 생활에 주는 영향을 인식할 수 있다.\n\n[데이터] 키가 필요 없는 Open-Meteo API를 fetch로 호출 (동현초 좌표):\nhttps://api.open-meteo.com/v1/forecast?latitude=35.2224&longitude=129.0924&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,cloud_cover,surface_pressure,wind_speed_10m,wind_direction_10m&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FSeoul\n\n[화면]\n① 현재 기온을 아주 크게, 날씨 설명(맑음·흐림·비·눈)은 weather_code를 한글+이모지로\n② 습도 · 풍속과 풍향(16방위 한글) · 기압 · 구름량 · 강수량 · 오늘 최고/최저 — 6칸, 칸마다 초등 눈높이 한 줄 설명\n③ 기압이 1013hPa보다 높으면 \"고기압\", 낮으면 \"저기압\"이라고 판단해 주는 상자 (구름량과 연결해 설명)\n④ \"지금 값 기록하기\" 버튼: 관측자 이름과 함께 표에 쌓이고 localStorage에 저장 (하루 세 번 기록해 비교), \"기록 지우기\"\n⑤ 머리글에 안내 캐릭터 그림(pose_tablet.png), 맨 아래 출처 표시(Open-Meteo)와 pose_check.png\n\n[조건]\n- 둥근 글씨(Jua), 하늘색 테마, 폰·태블릿에서 잘 보이게\n- 서버 없이 파일 하나로, API 키 없음"}, {"kind": "프롬프트", "title": "우리 반 포켓몬 도감", "desc": "PokeAPI(키 없음)로 번호 · 이름 검색", "tags": [], "padlet": "https://padlet.com/oneteacher/1027-ai-s024v9bx5ad6wymbbapb/wish/BJkrQAdXPXrXaEge", "prompt": "나는 초등학교 교사야. 학생들이 번호나 이름으로 포켓몬을 찾아보는 \"우리 반 포켓몬 도감\" 웹페이지를 HTML 파일 하나로 만들려고 해. 서버 없이 브라우저에서 바로 열리는 index.html 하나만 필요해.\n[API]\nPokeAPI(키 필요 없음)를 fetch로 직접 호출해. 포켓몬 하나를 보여 주려면 두 주소를 모두 불러야 해:\n- https://pokeapi.co/api/v2/pokemon/(번호 또는 영어이름) → id, height, weight, types, stats, sprites\n- https://pokeapi.co/api/v2/pokemon-species/(번호) → names 배열에서 language.name이 \"ko\"인 name(한국어 이름), flavor_text_entries에서 language.name이 \"ko\"인 첫 항목의 flavor_text(한국어 도감 설명, 줄바꿈 문자는 공백으로)\n그림은 sprites.other[\"official-artwork\"].front_default를 쓰고, 없으면 sprites.front_default.\n타입 영어 이름은 한국어로 바꿔서 표시: normal 노말, fire 불꽃, water 물, grass 풀, electric 전기, ice 얼음, fighting 격투, poison 독, ground 땅, flying 비행, psychic 에스퍼, bug 벌레, rock 바위, ghost 고스트, dragon 드래곤, dark 악, steel 강철, fairy 페어리. 타입마다 어울리는 파스텔 배경색.\n[화면]\n① 맨 위: \"우리 반 포켓몬 도감\" 제목, 검색칸(번호 1~151 또는 영어 이름) + [찾기] 버튼, 그 옆에 [🎲 오늘의 포켓몬] 버튼(1~151 중 무작위)\n② 카드 하나에: 큰 그림, 번호(No.025처럼 세 자리), 한국어 이름을 아주 크게, 영어 이름은 작게, 타입 배지, 키(m)·몸무게(kg) — API 값은 10으로 나눠서 표시\n③ 한국어 도감 설명 한 문단\n④ 능력치 6개(HP, 공격, 방어, 특수공격, 특수방어, 스피드)를 가로 막대로, 막대 길이는 값/255 비율\n⑤ 카드 아래 [◀ 이전] [다음 ▶] 버튼으로 번호 이동(1~151 안에서만)\n⑥ 불러오는 동안 \"포켓몬을 찾는 중…\", 없는 번호·이름이면 \"그런 포켓몬은 없어요. 1~151 사이 번호나 영어 이름을 넣어 주세요\"\n⑦ 한 번 불러온 포켓몬은 다시 부르지 않게 화면 안에서 기억(객체에 저장)해 줘\n[디자인]\n글씨 크게, 둥근 카드, 색은 부드럽게, 학생에게 다정한 말투. 휴대폰 세로 화면에서도 잘 보이게.\n[기술 조건 — 반드시 지켜 줘]\n1. 파일은 index.html 하나. CSS·JS 모두 안에 넣고 외부 라이브러리·CDN 없이.\n2. 파일을 더블클릭해서 열어도(file://) 동작해야 해. 자동으로 여러 포켓몬을 한꺼번에 불러오지 마(한 번에 한 마리만).\n3. 모든 문구는 한국어.\n4. 출력: 코드 블록 하나, 생략 없이 전체 코드. 코드 뒤에 \"메모장에 붙여넣고 index.html로 저장(인코딩 UTF-8) → 더블클릭\" 순서 3줄."}, {"kind": "사이트", "title": "PokeAPI", "desc": "포켓몬 데이터를 주는 무료 API", "tags": [], "url": "https://pokeapi.co/", "padlet": "https://padlet.com/oneteacher/1027-ai-s024v9bx5ad6wymbbapb/wish/MxrmZYelPlGdZGOq"}]}, {"id": "s7", "num": "⑦", "label": "셰프 초빙", "short": "생성형 API · 제미나이", "color": "#A64BD3", "art": "../gwangnam/1026/img/s7.webp", "title": "AI 셰프를 주방에 모셔요", "analogy": "열쇠(API 키)는 금고(시트)에, 셰프(제미나이)는 주방(Code.gs)에서만 일해요.", "steps": ["AI 스튜디오 → <b>Create API key</b> → 복사", "시트 <b>[설정] 탭 A1</b>에 붙여 넣기 — 코드에는 쓰지 않아요", "급식앱에 <b>알레르기 분석</b> 프롬프트 더하기", "편집기에서 함수 한 번 실행(권한 허용) → <b>배포 관리 → 새 버전</b>"], "tip": "키는 비밀번호와 같아요. 연수가 끝나면 AI 스튜디오에서 지우고 새로 만드세요.", "cards": [{"kind": "시작", "title": "제미나이 API 키 받기", "desc": "Create API key → 복사 → 시트 [설정] 탭 A1", "tags": [], "url": "https://aistudio.google.com/apikey", "padlet": "https://padlet.com/oneteacher/1027-ai-s024v9bx5ad6wymbbapb/wish/YBl3Z2Y3E318Qv16"}, {"kind": "앱", "title": "API 붙인 급식앱", "desc": "오늘 급식의 알레르기 식품을 AI가 다정하게 알려 줘요", "tags": [], "url": "https://script.google.com/macros/s/AKfycbzzDAO0gYs6ug7evOaCdjDx7rQNxC4hIx_B1Yrz-VV2MpK3O1crVps-FUtWgoLl3bHUBg/exec", "padlet": "https://padlet.com/oneteacher/1027-ai-s024v9bx5ad6wymbbapb/wish/yEPVZk7XKX5RZb0Y", "prompt": "위에서 만든 급식 앱에 \"알레르기 분석하기\" 기능을 추가해 줘. 기존 기능은 그대로 두고, 바뀐 파일(Code.gs, index.html)의 전체 코드를 생략 없이 다시 보여 줘.\n[제미나이 API 키 — 시트에서 읽기]\n- Code.gs 맨 위에 SHEET_URL = \"여기에 내 스프레드시트 주소\" 상수를 추가해.\n- 제미나이 API 키는 코드에 쓰지 말고, SpreadsheetApp.openByUrl(SHEET_URL).getSheetByName(\"설정\").getRange(\"A1\").getValue()로 읽어 와. \"설정\" 탭이 없으면 만들고 A1에 \"여기에 제미나이 API 키를 붙여넣으세요\"라고 써 둬.\n- A1이 비어 있거나 그 안내 문구 그대로면 분석하지 말고 화면에 \"설정 탭 A1에 제미나이 API 키를 넣어 주세요\"를 보여 줘.\n- 키 값은 어떤 경우에도 화면(index.html)으로 보내지 마. 제미나이 호출은 Code.gs에서만.\n- 시트를 여는 부분도 try/catch로 감싸서, 권한 오류가 나면 \"앱스 스크립트 편집기에서 함수를 한 번 실행해 권한을 허용해 주세요\"를 보여 줘.\n[제미나이 호출 — Code.gs]\n- 모델: gemini-flash-lite-latest (항상 최신 Flash-Lite를 가리키는 이름). 주소: https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-lite-latest:generateContent\n- 응답이 404나 503이면 gemini-flash-latest로 한 번 더 시도해.\n- UrlFetchApp.fetch로 POST. 헤더에 \"x-goog-api-key\": 키, contentType \"application/json\", payload는 JSON.stringify({ contents: [{ parts: [{ text: 프롬프트 }] }] }). muteHttpExceptions: true를 넣어.\n- 응답 코드별 안내: 400·401·403은 \"API 키를 확인해 주세요\", 429는 \"요청이 많아요. 잠시 후 다시 눌러 주세요\", 503은 \"지금 AI 셰프가 바빠요. 잠시 후 다시 눌러 주세요\", 그 외는 \"분석에 실패했어요. 잠시 후 다시 시도해 주세요\".\n- 실패하면 안내 문구 아래에 작은 글씨로 응답 코드와 구글이 보낸 오류 문장(응답 JSON의 error.message)을 같이 보여 줘.\n- 결과 글은 JSON.parse(응답).candidates[0].content.parts[0].text에서 꺼내.\n- 제미나이에게 보낼 프롬프트는 Code.gs에서 만들어: 그날 급식 메뉴 목록(알레르기 번호 포함)과 알레르기 번호표(1 난류, 2 우유, 3 메밀, 4 땅콩, 5 대두, 6 밀, 7 고등어, 8 게, 9 새우, 10 돼지고기, 11 복숭아, 12 토마토, 13 아황산류, 14 호두, 15 닭고기, 16 쇠고기, 17 오징어, 18 조개류, 19 잣)를 함께 넣고, \"초등학생에게 다정한 말투로, 오늘 급식에서 조심할 알레르기 식품을 번호가 아닌 식품 이름으로 바꿔 3~4문장으로 알려 줘. 어떤 메뉴에 무엇이 들어 있는지 말해 주고, 마지막 문장은 '알레르기가 있는 친구는 꼭 선생님께 말해 주세요'로 끝내. 의학적 판단이나 진단은 하지 마\"라고 지시해.\n[캐시 — 같은 날짜는 다시 부르지 않기]\n- 분석 결과는 시트의 \"분석\" 탭에 날짜(yyyyMMdd) | 결과 글 | 분석 시각 순서로 저장해. 탭이 없으면 헤더와 함께 만들어.\n- 분석 버튼을 눌렀을 때 그 날짜 결과가 \"분석\" 탭에 이미 있으면 제미나이를 부르지 말고 저장된 글을 보여 줘.\n[화면]\n- 급식 카드 아래에 [🔍 알레르기 분석하기] 버튼. 급식이 없는 날은 버튼을 숨겨.\n- 누르면 버튼이 비활성화되고 \"AI가 급식을 살펴보는 중…\"이 보이다가, 결과가 오면 연한 파란색 카드에 결과 글을 보여 줘. 카드 아래 작은 글씨로 \"AI가 만든 안내예요. 정확한 내용은 급식 담당 선생님께 확인하세요\".\n- 오류가 나도 alert 창은 쓰지 말고 결과 카드 안에 안내를 보여 줘.\n- 날짜를 바꾸면 이전 분석 카드는 지워지고 버튼이 다시 활성화돼.\n- 저장된 결과를 보여 줄 때는 카드 위에 작게 \"저장된 분석\"이라고 표시.\n[기술 조건]\n- 기존 기술 조건(파일 2개, doGet, google.script.run, 순수 HTML/CSS/JS, 한국어) 그대로.\n- 출력: 코드 블록 두 개(각 블록 첫 줄에 // 파일명 주석), 생략 없이 전체 코드.\n- 각 코드 블록 맨 마지막 줄에 끝 표시를 넣어 줘: Code.gs는 // ===== Code.gs 끝 =====, index.html은 <!-- ===== index.html 끝 ===== -->\n- 코드 다음에 순서를 4줄로 알려 줘: ① 설정 탭 A1에 키 넣기 ② 편집기에서 함수를 한 번 실행해 시트 권한 허용 ③ 배포 관리 → 새 버전 ④ 웹 앱 새로고침"}], "links": [["구글 스프레드시트", "https://docs.google.com/spreadsheets/u/0/"], ["AI 스튜디오", "https://aistudio.google.com/"]]}, {"id": "end", "num": "♥", "label": "마무리", "short": "데이터 너머를 읽는 눈", "color": "#F27A54", "art": "img/end.webp", "title": "웹앱과 데이터 너머를 읽는 눈은 선생님들께 있습니다", "analogy": "그 눈이 교실을 행복하게 만듭니다. 숙제 — 10/30(금)까지 오늘 만든 앱 하나를 다시 만들어 진열장에 올려 보세요."}], "padlet": "https://padlet.com/oneteacher/1027-ai-s024v9bx5ad6wymbbapb"};
const V = DATA.views, $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STEPS = V.filter(v => v.id !== 'home');
let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem('dh1027-done') || '[]')); } catch (e) {}
const save = () => { try { localStorage.setItem('dh1027-done', JSON.stringify([...done])); } catch (e) {} };

$('#padletSide').href = $('#padletTop').href = DATA.padlet;

function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1600); }
async function copy(text, btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch (e2) {} ta.remove();
  }
  toast(ok ? '복사했어요! 제미나이에 붙여 넣으세요' : '복사가 안 돼요. 펼쳐서 직접 선택해 주세요');
  if (ok && btn) { const o = btn.innerHTML; btn.classList.add('copied'); btn.innerHTML = '✓ 복사됨'; setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = o; }, 1400); }
}

function navHTML() {
  $('#nav').innerHTML = V.map(v => `<button data-go="${v.id}" style="--c:${v.color}" class="${done.has(v.id) ? 'done' : ''}">
    <span class="ic">${v.num || '★'}</span><span class="tx"><b>${esc(v.label)}</b><small>${esc(v.short)}</small></span>${v.id === 'home' ? '' : '<span class="ok">✓</span>'}</button>`).join('');
  const n = STEPS.filter(v => done.has(v.id)).length;
  $('#progBar').style.width = (n / STEPS.length * 100) + '%';
  $('#progTx').textContent = n + '/' + STEPS.length;
}

function cardHTML(c) {
  const prompts = c.prompts ? c.prompts : (c.prompt ? [['프롬프트', c.prompt]] : []);
  const fname = s => s.split('/').pop();
  const pics = c.img ? `<div class="pics${c.img.length > 3 ? ' many' : ''}">${c.img.map(s => `<figure><img src="${esc(s)}" alt="${esc(fname(s))}" loading="lazy"><a class="dl" href="${esc(s)}" download="${esc(fname(s))}" title="${esc(fname(s))} 받기">⬇ ${esc(fname(s))}</a></figure>`).join('')}</div>` : '';
  const zip = c.zip ? `<a class="b main" href="${esc(c.zip)}" download>📦 ${c.img ? c.img.length + '장 ' : ''}한꺼번에 받기 (ZIP)</a>` : '';
  const tags = (c.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('');
  const open = c.url ? `<a class="b main" href="${esc(c.url)}" target="_blank" rel="noopener">${c.kind === '앱' ? '앱 열기' : '열기'} ↗</a>` : '';
  const quick = prompts.length === 1 ? `<button class="b" data-copy="0">📋 프롬프트 복사</button>` : '';
  const pad = c.padlet ? `<a class="b" href="${esc(c.padlet)}" target="_blank" rel="noopener">📌 패들렛</a>` : '';
  const det = prompts.map((p, i) => `<details class="pr"><summary>${esc(p[0])} 보기${prompts.length > 1 ? `<button class="b cp" data-copy="${i}">📋 복사</button>` : ''}</summary><pre>${esc(p[1])}</pre></details>`).join('');
  return `<article class="card"><div class="k"><span class="kind">${esc(c.kind)}</span>${tags}</div><h3>${esc(c.title)}</h3>${c.desc ? `<p class="desc">${esc(c.desc)}</p>` : ''}${pics}<div class="row">${open}${zip}${quick}${pad}</div>${det}</article>`;
}

function pagerHTML(i) {
  const v = V[i], prev = V[i - 1], next = V[i + 1];
  return `<div class="pager">
    ${prev ? `<a href="#${prev.id}" data-go="${prev.id}"><small>← 이전</small><b>${prev.num ? prev.num + ' ' : ''}${esc(prev.label)}</b></a>` : ''}
    ${v.id !== 'home' && v.id !== 'end' ? `<button class="mark ${done.has(v.id) ? 'on' : ''}" data-mark="${v.id}"><b>${done.has(v.id) ? '✓ 이 단계 끝!' : '이 단계 끝 ✓'}</b></button>` : ''}
    ${next ? `<a class="next" href="#${next.id}" data-go="${next.id}"><small>다음 →</small><b>${next.num ? next.num + ' ' : ''}${esc(next.label)}</b></a>` : ''}
  </div>`;
}

function render(id) {
  const i = Math.max(0, V.findIndex(v => v.id === id)), v = V[i];
  document.documentElement.style.setProperty('--c', v.color);
  $('#crumb').style.setProperty('--c', v.color);
  $('#crumb span:last-child').textContent = v.id === 'home' ? '시작하기' : `${v.num} ${v.label}`;
  document.querySelectorAll('#nav button').forEach(b => b.setAttribute('aria-current', b.dataset.go === v.id));
  let h = '';
  if (v.id === 'home') {
    h += `<section class="banner big"><img src="${v.art}" alt="노트북과 태블릿 위로 빛나는 앱 아이콘을 띄워 보는 선생님들"><div class="in">
      <h1>${esc(v.title)}</h1><p>${esc(v.analogy)}</p>
      <div class="cta"><a class="btn gold" href="#s1" data-go="s1">▶ ① 시식 코너부터</a><a class="btn glass" href="${DATA.padlet}" target="_blank" rel="noopener">📌 패들렛 열기</a></div></div></section>`;
    h += `<div class="sec-h"><h2>오늘의 순서</h2><span>식당을 차리듯 한 단계씩</span></div><div class="flow">${STEPS.map(s => `<button class="tile ${done.has(s.id) ? 'done' : ''}" data-go="${s.id}" style="--c:${s.color}"><div class="th"><img src="${s.art}" alt="" loading="lazy"><i>${s.num}</i></div><div class="tx"><b>${esc(s.label)}</b><small>${esc(s.short)}</small></div></button>`).join('')}</div>`;
    h += `<div class="sec-h"><h2>준비물</h2><span>먼저 열어 두세요</span></div><div class="cards">${v.cards.map(cardHTML).join('')}</div>`;
  } else if (v.id === 'end') {
    h += `<section class="closing"><img src="${v.art}" alt="노을 진 운동장에서 태블릿 속 앱을 아이들에게 보여 주는 선생님들"><div class="in"><span class="step-tag" style="--c:${v.color}"><i>♥</i>마무리</span><h1>${esc(v.title)}</h1><p>${esc(v.analogy)}</p></div></section>`;
    h += `<div class="sec-h"><h2>오늘 차린 가게</h2><span>다시 보고 싶은 곳을 누르세요</span></div><div class="recap">${STEPS.filter(s => s.id !== 'end').map(s => `<button data-go="${s.id}" style="--c:${s.color}"><i>${s.num}</i><span>${esc(s.label)}</span></button>`).join('')}</div>`;
    h += pagerHTML(i);
  } else {
    h += `<section class="banner"><img src="${v.art}" alt=""><div class="in"><span class="step-tag"><i>${v.num}</i>${esc(v.label)} · ${esc(v.short)}</span><h1>${esc(v.title)}</h1><p>${esc(v.analogy)}</p></div></section>`;
    if (v.trio) h += `<div class="trio">${v.trio.map(t => `<div><span class="e">${t[0]}</span><b>${t[1]}</b><code>${t[2]}</code><small>${t[3]}</small></div>`).join('')}</div>`;
    if (v.steps) h += `<div class="sec-h"><h2>이렇게 해요</h2></div><ol class="steps" style="--cols:${v.steps.length<=4?v.steps.length:3}">${v.steps.map(s => `<li>${s}</li>`).join('')}</ol>`;
    if (v.tip) h += `<div class="tip"><b>🔑 잊지 마세요</b><span>${esc(v.tip)}</span></div>`;
    h += `<div class="sec-h"><h2>패들렛 자료</h2><span>${v.cards.length}개</span></div><div class="cards">${v.cards.map(cardHTML).join('')}</div>`;
    if (v.links) h += `<div class="links">${v.links.map(l => `<a class="chip" href="${esc(l[1])}" target="_blank" rel="noopener">↗ ${esc(l[0])}</a>`).join('')}</div>`;
    h += pagerHTML(i);
  }
  if (v.id === 'home') h += pagerHTML(i);
  $('#view').innerHTML = `<div class="view">${h}</div>`;
  $('#view').querySelectorAll('.card').forEach((el, k) => { el.__c = (v.cards || [])[k]; });
  $('#page').scrollTop = 0;
  $('#app').classList.remove('open');
  try { history.replaceState(null, '', '#' + v.id); } catch (e) {}
}

document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go) { e.preventDefault(); render(go.dataset.go); return; }
  const cp = e.target.closest('[data-copy]');
  if (cp) {
    e.preventDefault(); e.stopPropagation();
    const c = cp.closest('.card').__c; const list = c.prompts ? c.prompts : [['', c.prompt]];
    copy(list[+cp.dataset.copy][1], cp); return;
  }
  const mk = e.target.closest('[data-mark]');
  if (mk) {
    const id = mk.dataset.mark; done.has(id) ? done.delete(id) : done.add(id); save(); navHTML();
    if (done.has(id)) { toast('잘하셨어요! 다음 단계로 가요'); const i = V.findIndex(v => v.id === id); setTimeout(() => render(V[i + 1].id), 500); }
    else render(id);
  }
});
$('#menuBtn').onclick = () => $('#app').classList.add('open');
$('#closeBtn').onclick = $('#scrim').onclick = () => $('#app').classList.remove('open');
addEventListener('keydown', e => { if (e.key === 'Escape') $('#app').classList.remove('open'); });
addEventListener('hashchange', () => render(location.hash.slice(1)));

navHTML();
render(location.hash.slice(1) || 'home');
</script>
</body>
</html>
