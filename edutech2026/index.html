<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="2026 교원 에듀테크 활용 직무연수 기본·심화 과정 길잡이">

<title>에듀테크 직무연수 길잡이</title>

<style>
/* 레이아웃: 왼쪽 보라 사이드바(과정 전환 + 단계 목록) + 크림 본문, 광남초·동현초 길잡이와 같은 계열 */
:root{
  --bg:#FBF6EF; --surface:#FFFFFF; --sunken:#F5EEE4; --ink:#2A2340; --muted:#6E6684; --line:#ECE2D4;
  --side:#211B3D; --side2:#2C2550; --sideink:#F4EFFF; --sidemut:#A99FCB; --sideline:rgba(255,255,255,.09);
  --gold:#F5B342; --coral:#E2588C; --teal:#16A589; --blue:#2C87DB; --violet:#7458F5;
  --chipbg:#FDF3E0; --chipink:#8A5E12;
  --shadow:0 1px 2px rgba(42,35,64,.06),0 8px 24px -12px rgba(42,35,64,.18);
  --display:'Jua','Noto Sans KR',system-ui,sans-serif;
  --body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16122A; --surface:#211B3A; --sunken:#1B1631; --ink:#F3EEFF; --muted:#AFA6CB; --line:#342C55;
  --side:#110E22; --side2:#1E1938; --chipbg:#3A2E14; --chipink:#F2CE8C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16122A; --surface:#211B3A; --sunken:#1B1631; --ink:#F3EEFF; --muted:#AFA6CB; --line:#342C55;
  --side:#110E22; --side2:#1E1938; --chipbg:#3A2E14; --chipink:#F2CE8C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;
  -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.3;margin:0;text-wrap:balance}
img{max-width:100%;display:block}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}

.app{display:flex;height:100%;overflow:hidden}
/* ── 사이드바 ── */
.side{width:292px;flex:none;background:var(--side);color:var(--sideink);display:flex;flex-direction:column;
  padding:18px 14px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));gap:4px;z-index:40;overflow:hidden;
  background-image:radial-gradient(120% 60% at 0% 0%,rgba(245,179,66,.16),transparent 60%),
                   radial-gradient(90% 50% at 100% 100%,rgba(116,88,245,.25),transparent 65%)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 10px}
.orb{width:30px;height:30px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 32% 30%,#fff 0 12%,transparent 13%),
  conic-gradient(from 210deg,#F5B342,#E2588C,#7458F5,#2C87DB,#16A589,#F5B342);
  box-shadow:0 0 18px rgba(245,179,66,.55)}
.brand b{font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:.01em}
.brand small{display:block;font-size:12px;color:var(--sidemut);margin-top:-3px}
.brand .x{margin-left:auto;display:none;background:none;border:0;color:var(--sidemut);font-size:22px;width:36px;height:36px;border-radius:10px}
.cswitch{display:flex;gap:6px;background:rgba(0,0,0,.25);padding:5px;border-radius:14px;margin:2px 4px 8px}
.cswitch button{flex:1;border:0;background:transparent;color:var(--sidemut);padding:8px 4px;border-radius:10px;
  font-family:var(--display);font-size:15px;transition:background .15s,color .15s}
.cswitch button.on{background:var(--gold);color:#2A2340}
.cswitch button:not(.on):hover{background:var(--sideline);color:var(--sideink)}
.side-label{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--sidemut);padding:8px 10px 4px}
.nav{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin:0 -4px;padding:0 4px;scrollbar-width:thin}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:7px 10px;
  border-radius:12px;text-align:left;color:var(--sideink);transition:background .15s}
.nav button:hover{background:var(--sideline)}
.nav button.on{background:var(--side2);box-shadow:inset 0 0 0 1px var(--sideline)}
.nav .no{flex:none;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;
  font-family:var(--display);font-size:13px;background:rgba(255,255,255,.08);color:var(--sidemut)}
.nav button.on .no{background:var(--gold);color:#2A2340}
.nav .nm{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .ck{flex:none;font-size:13px;color:var(--gold);opacity:0;transition:opacity .15s}
.nav button.done .ck{opacity:1}
.side-foot{border-top:1px solid var(--sideline);padding:10px 10px 0;font-size:12px;color:var(--sidemut);line-height:1.5}
.side-foot b{color:var(--sideink);font-weight:500}

/* ── 본문 ── */
.main{flex:1;min-width:0;overflow-y:auto;overscroll-behavior:contain}
.top{position:sticky;top:0;z-index:30;display:none;align-items:center;gap:10px;background:var(--bg);
  border-bottom:1px solid var(--line);padding:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .mn{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:40px;height:40px;font-size:18px}
.top .tt{font-family:var(--display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{max-width:880px;margin:0 auto;padding-block:26px 60px;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

.hero{border-radius:22px;overflow:hidden;box-shadow:var(--shadow);position:relative;background:var(--side)}
.hero img{width:100%;aspect-ratio:16/9;object-fit:cover}
.hero .cap{position:absolute;inset:auto 0 0 0;padding:40px 22px 16px;color:#FFF;
  background:linear-gradient(transparent,rgba(23,16,44,.82));display:flex;flex-direction:column;gap:4px}
.hero .cap .chips{display:flex;gap:6px;flex-wrap:wrap}
.hero h2{font-size:clamp(22px,4.2vw,32px);color:#FFF;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--chipbg);color:var(--chipink);
  font-size:12.5px;font-weight:700;padding:3px 11px;border-radius:999px;white-space:nowrap}
.chip.inv{background:rgba(255,255,255,.2);color:#FFF;backdrop-filter:blur(4px)}
.lead{margin:18px 2px 0;font-size:16.5px}
.lead b{color:var(--chipink);background:var(--chipbg);border-radius:6px;padding:0 5px;font-weight:700}

.sec{margin-top:30px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sec-h .ic{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;font-size:17px;
  background:var(--chipbg)}
.sec-h h3{font-size:20px}
.sec-h small{color:var(--muted);font-size:13px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px 20px}
.steps{display:flex;flex-direction:column;gap:0;counter-reset:st}
.st{display:flex;gap:14px;padding:13px 2px;border-bottom:1px dashed var(--line)}
.st:last-child{border-bottom:0}
.st .n{counter-increment:st;flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--display);font-size:15px;background:var(--gold);color:#2A2340}
.st .n::before{content:counter(st)}
.st .b{min-width:0;padding-top:2px}
.st .b b{font-weight:700}
.st .b .d{color:var(--muted);font-size:14.5px;margin-top:2px}
.st kbd{font-family:var(--body);font-size:13px;background:var(--sunken);border:1px solid var(--line);border-bottom-width:2px;
  border-radius:6px;padding:1px 7px;white-space:nowrap}

.pcard{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--violet);border-radius:16px;
  box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:9px}
.pcard+.pcard{margin-top:12px}
.pcard .ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pcard .pid{font-family:var(--display);font-size:13px;background:var(--violet);color:#FFF;border-radius:8px;padding:2px 9px}
.pcard .pt{font-weight:700;font-size:15px}
.pcard pre{margin:0;background:var(--sunken);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  font-family:var(--body);font-size:14.5px;line-height:1.6;white-space:pre-wrap;max-height:300px;overflow-y:auto}
.pcard .pr{display:flex;gap:8px;flex-wrap:wrap}
.copy{border:1px solid var(--line);background:var(--sunken);border-radius:999px;padding:6px 15px;font-size:13.5px;font-weight:700;
  display:inline-flex;align-items:center;gap:6px;transition:background .15s}
.copy:hover{background:var(--chipbg)}
.copy.ok{background:var(--teal);border-color:var(--teal);color:#FFF}

.tipbar{display:flex;gap:10px;background:var(--chipbg);border-radius:14px;padding:12px 15px;font-size:14.5px;color:var(--chipink)}
.tipbar+.tipbar{margin-top:8px}
.tipbar .em{flex:none}
.warn{background:#FCE8EF;color:#9C2F5B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .warn{background:#43202E;color:#F3A8C4}}
:root[data-theme="dark"] .warn{background:#43202E;color:#F3A8C4}

.links{display:flex;gap:10px;flex-wrap:wrap}
.lk{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:8px 16px;font-size:14px;font-weight:700;text-decoration:none;box-shadow:var(--shadow);transition:transform .12s}
.lk:hover{transform:translateY(-1px)}
.lk .dot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex:none}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px}
.mini .mh{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:4px}
.mini .mh .bd{width:26px;height:26px;flex:none;border-radius:9px;display:grid;place-items:center;font-size:14px;background:var(--chipbg)}
.mini p{margin:0;font-size:14px;color:var(--muted)}

.foot-nav{display:flex;gap:10px;margin-top:34px;flex-wrap:wrap}
.foot-nav button{flex:1;min-width:150px;border:1px solid var(--line);background:var(--surface);border-radius:16px;
  padding:13px 16px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:2px}
.foot-nav button small{color:var(--muted);font-size:12px}
.foot-nav button b{font-family:var(--display);font-weight:400;font-size:16px}
.foot-nav .nx{text-align:right;align-items:flex-end;background:linear-gradient(135deg,var(--gold),#F7C76E);border:0;color:#2A2340}
.foot-nav .nx small{color:rgba(42,35,64,.6)}
.donebar{margin-top:16px;display:flex;justify-content:center}
.donebar button{border:2px solid var(--teal);background:transparent;color:var(--teal);border-radius:999px;padding:9px 22px;font-weight:700}
.donebar button.on{background:var(--teal);color:#FFF}

.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.course-card{border:0;text-align:left;background:var(--surface);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);
  display:flex;flex-direction:column;padding:0;border:1px solid var(--line)}
.course-card img{aspect-ratio:16/8;object-fit:cover;width:100%}
.course-card .cb{padding:14px 18px 16px;display:flex;flex-direction:column;gap:4px}
.course-card .cb small{color:var(--muted);font-size:12.5px}
.course-card .cb b{font-family:var(--display);font-weight:400;font-size:18px}
.scrim{position:fixed;inset:0;background:rgba(20,14,40,.5);z-index:35;border:0;padding:0;display:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);
  background:var(--side);color:var(--sideink);border-radius:999px;padding:10px 22px;font-size:14px;box-shadow:var(--shadow);
  opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:60;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:860px){
  .side{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);transition:transform .22s;width:min(320px,86vw);
    padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .brand .x{display:grid;place-items:center}
  .top{display:flex;top:env(safe-area-inset-top,0px)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
  .scrim.show{display:block}
  .home-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">

      <button class="x" id="closeSide" aria-label="차례 닫기">×</button>

</div>

<script>
/* ───────── 데이터 ───────── */
const PADLET = { basic:"https://padlet.com/oneteacher/1106-google-s024z9aodxw5bmyagk8i", deep:"https://padlet.com/oneteacher/1120-ai-s024z9fywktddmfivb6b" };
const ESC = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

const COURSES = {
basic: {
  key:"basic", label:"기본과정", color:"#2C87DB",
  title:"잔소리 대신 클릭 한 번,\nGoogle로 굴러가는 우리 반",
  date:"11. 6.(금) 15:30~18:00 · 교육연구정보원 403호",
  art:"img/home.webp",
  intro:"파일을 보내고, 받고, 다시 모으는 하루는 오늘까지. 링크 하나면 모두 같은 문서에서 — 쓰고, 모으고, 정리하는 세 번의 클릭을 오늘 직접 해 봅니다.",
  parts:[["1차시","함께 쓰기 — 문서 · 슬라이드"],["2차시","모으기 — 설문 · Canva 시트"],["3차시","정리하기 — 화이트보드 · 드라이브"]],
  steps:[
  { id:"ready", tag:"시작하기", no:"0", title:"출발 준비", art:"img/home.webp",
    analogy:"여행 가방 싸기 — 딱 세 가지만 챙기면 출발할 수 있어요.",
    steps:[
      ["크롬 브라우저로 열기","다른 브라우저도 되지만, 오늘 쓰는 도구는 크롬에서 가장 매끄럽게 움직여요."],
      ["학교(교육용) Google 계정 로그인","개인 계정과 섞이지 않게 크롬 프로필을 분리해 두면 공유 사고가 확 줄어요."],
      ["앱 런처(점 아홉 개) 확인","오른쪽 위 ⋮⋮⋮ 을 누르면 문서 · 슬라이드 · 설문 · 시트 · 드라이브가 전부 여기 있어요."],
      ["공유 권한 세 단계 기억하기","👀 뷰어는 보기만(안내문 · 완성 자료) · 💬 댓글 작성자는 의견만(동료 검토) · ✏️ 편집자는 함께 쓰기(모둠 활동 · 취합)."]],
    tips:["\"링크가 있는 모든 사용자\"로 바꿀 땐 학생 개인정보가 들어 있는지 한 번 더 확인!"],
    warn:null,
    links:[["Google 홈","https://www.google.com"],["드라이브","https://drive.google.com"]] },
  { id:"doc", tag:"1차시 · 함께 쓰기", no:"1", title:"실습 1 · 문서로 모둠 글쓰기", art:"img/write.webp",
    analogy:"모둠 공책 한 권 — 네 명이 한 공책에 번갈아 쓰고, 선생님은 빨간펜 대신 댓글로.",
    steps:[
      ["새 문서 만들기","앱 런처 → 문서 → ＋ 빈 문서. 제목은 <b>\"6학년 과학 · 지층 탐구 모둠 보고서\"</b>처럼 학년 · 과목 · 모둠을 넣어요(드라이브 검색이 쉬워져요)."],
      ["공유 버튼 한 번으로 모둠 문서 만들기","오른쪽 위 파란 [공유] → 일반 액세스를 <b>링크가 있는 모든 사용자</b> → 역할을 <b>편집자</b>로 → [링크 복사] 후 클래스룸 · 메신저에 붙여넣기."],
      ["번갈아 쓰기","① 관찰 ② 형성 순서 ③ 모형 계획 ④ 더 알고 싶은 점 — 모둠원이 자기 칸에 이름을 달고 동시에 써요."],

/* ───────── 상태 ───────── */
let course = "basic", stepIdx = -1;   // -1 = 과정 홈
const doneKey = c => "et2026-done-"+c;
const loadDone = c => { try { return new Set(JSON.parse(localStorage.getItem(doneKey(c))||"[]")); } catch(e){ return new Set(); } };
const saveDone = (c,s) => { try { localStorage.setItem(doneKey(c), JSON.stringify([...s])); } catch(e){} };

/* ───────── 렌더 ───────── */
const $ = id => document.getElementById(id);
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove("show"),1600); }

function renderNav(){
  const c = COURSES[course], done = loadDone(course);
  $("swBasic").classList.toggle("on", course==="basic");
  $("swDeep").classList.toggle("on", course==="deep");
  $("navLabel").textContent = c.label + " 차례";
  const nav = $("nav"); nav.innerHTML = "";
  const home = document.createElement("button");
  home.innerHTML = `<span class="no">🏠</span><span class="nm">과정 안내</span><span class="ck">✓</span>`;
  home.classList.toggle("on", stepIdx===-1);
  home.onclick = () => go(course,-1);
  nav.appendChild(home);
  c.steps.forEach((s,i)=>{
    const b = document.createElement("button");
    b.innerHTML = `<span class="no">${s.no}</span><span class="nm">${s.title.replace(/^실습 \d+ · /,"")}</span><span class="ck">✓</span>`;
    b.classList.toggle("on", i===stepIdx);
    b.classList.toggle("done", done.has(s.id));
    b.onclick = () => go(course,i);
    nav.appendChild(b);
  });
}

function heroHTML(img, chips, title){
  return `<div class="hero"><img src="${img}" alt=""><div class="cap">
    <div class="chips">${chips.map(c=>`<span class="chip inv">${c}</span>`).join("")}</div>
    <h2>${title.replace(/\n/g,"<br>")}</h2></div></div>`;
}

function renderStep(){
  const c = COURSES[course], s = c.steps[stepIdx], done = loadDone(course);
  const stepsTitle = s.stepsTitle || "이렇게 해요";
  let h = heroHTML(s.art, [c.label, s.tag], s.title);
  h += `<p class="lead">${s.analogy}</p>`;
  if (s.cards) h += `<div class="sec"><div class="sec-h"><div class="ic">🧩</div><h3>${course==="basic"?"교과별로 이렇게":"한 단원의 흐름"}</h3></div>
    <div class="cards">${s.cards.map(cd=>`<div class="mini"><div class="mh"><span class="bd">${cd[0]}</span>${cd[1]}</div><p>${cd[2]}</p></div>`).join("")}</div></div>`;
  if (s.steps) h += `<div class="sec"><div class="sec-h"><div class="ic">👣</div><h3>${stepsTitle}</h3></div>
    <div class="card"><div class="steps">${s.steps.map(st=>`<div class="st"><span class="n"></span><div class="b"><b>${st[0]}</b><div class="d">${st[1]}</div></div></div>`).join("")}</div></div></div>`;
  if (s.prompts && s.prompts.length) h += `<div class="sec"><div class="sec-h"><div class="ic">📋</div><h3>붙여 넣을 프롬프트</h3><small>복사해서 그대로 써 보세요</small></div>
    ${s.prompts.map((p,i)=>`<div class="pcard"><div class="ph"><span class="pid">${p[0]}</span><span class="pt">${p[1]}</span></div>
      <pre id="pr-${i}">${ESC(p[2])}</pre><div class="pr"><button class="copy" data-pr="${i}">📋 복사하기</button></div></div>`).join("")}</div>`;
  if (s.warn) h += `<div class="sec"><div class="tipbar warn"><span class="em">⚠️</span><span>${s.warn}</span></div></div>`;
  if (s.tips && s.tips.length) h += `<div class="sec">${s.tips.map(t=>`<div class="tipbar"><span class="em">💡</span><span>${t}</span></div>`).join("")}</div>`;
  if (s.links && s.links.length) h += `<div class="sec"><div class="links">${s.links.map(l=>`<a class="lk" href="${l[1]}" target="_blank" rel="noopener"><span class="dot"></span>${l[0]} ↗</a>`).join("")}</div></div>`;
  h += `<div class="donebar"><button id="doneBtn" class="${done.has(s.id)?"on":""}">${done.has(s.id)?"✓ 해냈어요!":"다 하면 눌러요"}</button></div>`;
  const prev = stepIdx>0 ? c.steps[stepIdx-1] : null, next = stepIdx<c.steps.length-1 ? c.steps[stepIdx+1] : null;
  h += `<div class="foot-nav">`;
  h += prev ? `<button id="pv"><small>이전</small><b>← ${prev.title.replace(/^실습 \d+ · /,"")}</b></button>`
            : `<button id="pv"><small>처음</small><b>← 과정 안내</b></button>`;
  if (next) h += `<button class="nx" id="nx"><small>다음</small><b>${next.title.replace(/^실습 \d+ · /,"")} →</b></button>`;
  else h += `<button class="nx" id="nx"><small>처음으로</small><b>과정 안내 →</b></button>`;
  h += `</div>`;
  $("view").innerHTML = h;
  $("view").querySelectorAll(".copy").forEach(b=>{
    b.onclick = () => {
      const txt = $("pr-"+b.dataset.pr).textContent;
      const okUi = () => { b.classList.add("ok"); b.textContent="✓ 복사했어요"; toast("프롬프트를 복사했어요"); setTimeout(()=>{b.classList.remove("ok"); b.textContent="📋 복사하기";},1800); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(okUi).catch(()=>{ selectPre(b); });
      } else selectPre(b);
    };
  });
  function selectPre(b){
    const pre = $("pr-"+b.dataset.pr), r = document.createRange();
    r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    toast("길게 눌러 복사해 주세요");
  }
  $("doneBtn").onclick = () => {
    const d = loadDone(course);
    d.has(s.id) ? d.delete(s.id) : d.add(s.id);
    saveDone(course,d); renderStep(); renderNav();
  };
  $("pv").onclick = () => go(course, stepIdx-1>=-1?stepIdx-1:-1);
  $("nx").onclick = () => go(course, stepIdx<c.steps.length-1?stepIdx+1:-1);
  $("topTitle").textContent = c.label + " · " + s.title.replace(/^실습 \d+ · /,"");
}

function go(c, i, skipHash){
  course = c; stepIdx = i;
  if (!skipHash) { const h = i===-1 ? c : c+"-"+COURSES[c].steps[i].id; try{ location.hash = h; }catch(e){} }
  renderNav();
  i===-1 ? renderHome() : renderStep();
  $("main").scrollTo({top:0});
  closeSide();
}

/* 해시 라우팅: #basic, #deep, #basic-doc, #deep-gem … */
function fromHash(){
  const h = (location.hash||"").replace("#","");
  const m = h.match(/^(basic|deep)(?:-([a-z]+))?$/);
  if (!m) { go("basic",-1,true); return; }
  const c = m[1]; let i = -1;
  if (m[2]) { const idx = COURSES[c].steps.findIndex(s=>s.id===m[2]); if (idx>=0) i=idx; }
  go(c,i,true);
}
addEventListener("hashchange", fromHash);

/* 사이드바(모바일) */
function openSide(){ $("side").classList.add("open"); $("scrim").classList.add("show"); }
function closeSide(){ $("side").classList.remove("open"); $("scrim").classList.remove("show"); }
$("openSide").onclick = openSide; $("closeSide").onclick = closeSide; $("scrim").onclick = closeSide;
$("swBasic").onclick = () => go("basic",-1);
$("swDeep").onclick = () => go("deep",-1);

fromHash();
</script>

</body>
</html>
