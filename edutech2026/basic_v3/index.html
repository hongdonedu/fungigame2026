<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="에듀테크 활용 기본과정 2026. 11. 6.(금) — 잔소리 대신 클릭 한 번, Google로 굴러가는 우리 반: 실제 화면에 번호를 붙인 따라 하기, 복사해서 쓰는 프롬프트, 실습 자료">
<meta property="og:title" content="잔소리 대신 클릭 한 번, Google로 굴러가는 우리 반 — 연수 아카이브">
<meta property="og:image" content="https://hongdonedu.github.io/fungigame2026/edutech2026/art/cover_basic.webp">
<meta name="theme-color" content="#0d2142">
<title>잔소리 대신 클릭 한 번, Google로 굴러가는 우리 반 | 에듀테크 활용 기본과정 아카이브</title>
<link rel="icon" href="../art/gu_wave_i.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: 노트북LM의 '출처 패널'처럼 왼쪽 세로 시간표(단계·목표) + 오른쪽 노트 페이지 */
:root{
  --ink:#0f3266; --ink2:#1a73e8; --sun:#fbbc04; --mint:#1e8e3e; --coral:#ea4335;
  --paper:#f5f7fb; --card:#ffffff; --line:#dfe5ef; --text:#17223a; --muted:#5d6a80; --chip:#e9effa; --chipText:#1a73e8; --promptBg:#f2f6fd;
  --side:#0d2142; --sideText:#eef2f9; --sideMuted:#aab7cc; --sideActive:#1b3c72; --deep:#0d2142; --deepRGB:13,33,66;
  --shadow:0 8px 26px rgba(var(--deepRGB),.10);
  --fDisplay:'Jua','Noto Sans KR',sans-serif; --fBody:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; --fSoft:'Gowun Dodum','Noto Sans KR',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#0d1424; --card:#141e33; --line:#26344f; --text:#e8edf6; --muted:#9aa8c0; --chip:#1c2a45; --chipText:#8ab4f8; --promptBg:#17233b; --shadow:0 6px 22px rgba(0,0,0,.35); --ink:#ffd45e; --ink2:#8ab4f8; color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0d1424; --card:#141e33; --line:#26344f; --text:#e8edf6; --muted:#9aa8c0; --chip:#1c2a45; --chipText:#8ab4f8; --promptBg:#17233b; --shadow:0 6px 22px rgba(0,0,0,.35); --ink:#ffd45e; --ink2:#8ab4f8; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--text);font-family:var(--fBody);font-size:15.5px;line-height:1.65;word-break:keep-all}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--side)}
a{color:var(--ink2)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100%}
/* ---------- sidebar ---------- */
.side{background:var(--side);color:var(--sideText);position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow-y:auto;padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;scrollbar-width:thin}
.brand{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;padding:4px 6px 14px}
.brand img{width:52px;height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.brand b{font-family:var(--fDisplay);font-weight:900;font-size:19px;line-height:1.15;display:block}
.brand small{color:var(--sideMuted);font-size:12.5px}
.navhome{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;color:var(--sideText);text-decoration:none;font-weight:700;font-size:14.5px}
.navhome[aria-current="page"],.navhome:hover{background:var(--sideActive)}
.partlab{margin:18px 6px 6px;font-size:11.5px;letter-spacing:.1em;color:var(--sun);font-weight:700}
.stepnav{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;text-decoration:none;color:var(--sideText)}
.stepnav:hover{background:rgba(255,255,255,.07)}
.stepnav[aria-current="page"]{background:var(--sideActive);box-shadow:inset 3px 0 0 var(--sun)}
.stepnav .n{display:none;width:20px;height:20px;border-radius:50%;place-items:center;font-size:11px;font-weight:900;background:var(--mint);color:#fff}
.stepnav.done .n{display:grid}
.stepnav .t{font-weight:700;font-size:14.5px;line-height:1.3}
.sidelinks{margin-top:18px;border-top:1px solid rgba(255,255,255,.12);padding-top:12px;display:grid;gap:2px}
.sidelinks a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--sideText);text-decoration:none;font-size:14px}
.sidelinks a:hover,.sidelinks a[aria-current="page"]{background:var(--sideActive)}
.sidelinks img{width:28px;height:28px;object-fit:contain}
.prog{margin:16px 6px 0;font-size:12px;color:var(--sideMuted)}
.prog .bar{height:6px;border-radius:9px;background:rgba(255,255,255,.12);margin-top:6px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--sun);width:0;transition:width .4s}
/* ---------- topbar (mobile) ---------- */
.top{display:none}
/* ---------- main ---------- */
main{min-width:0;padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1060px;margin:0 auto}
h1,h2,h3{text-wrap:balance;line-height:1.3;margin:0}
h2{font-family:var(--fDisplay);font-weight:900;font-size:25px;color:var(--ink);letter-spacing:-.01em}
h3{font-size:17px;font-weight:900}
.eyebrow{font-size:12px;letter-spacing:.14em;font-weight:700;color:var(--ink2)}
.sec{margin-top:34px;display:grid;gap:14px}
.sechead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sechead p{margin:0;color:var(--muted);font-size:14px}
.cite{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--chipText);background:var(--chip);border-radius:999px;padding:2px 10px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 11px;background:var(--chip);color:var(--chipText)}
.chip.sun{background:var(--sun);color:#2a1d00}
/* hero */
.hero{position:relative;border-radius:26px;overflow:hidden;background:var(--deep);color:#fff;box-shadow:var(--shadow);aspect-ratio:16/8.2;max-width:100%}
.hero img{position:absolute;top:0;right:0;bottom:0;left:auto;width:64%;height:100%;object-fit:cover;object-position:28% center}
.hero .shade{position:absolute;inset:0;background:linear-gradient(90deg,var(--deep) 0%,var(--deep) 36%,rgba(var(--deepRGB),.55) 46%,rgba(var(--deepRGB),0) 60%)}
.hero .hcopy{position:relative;padding:clamp(20px,4vw,48px);max-width:560px;display:grid;gap:14px;height:100%;align-content:center}
.hero .tag{justify-self:start;background:#fff;color:var(--deep);font-weight:900;font-size:13px;border-radius:999px;padding:5px 14px}
.hero h1{font-family:var(--fDisplay);font-weight:900;font-size:clamp(28px,4.2vw,48px);line-height:1.22;letter-spacing:-.01em;text-shadow:0 4px 18px rgba(0,0,0,.35)}
.hero h1 em{font-style:normal;color:var(--sun)}
.hero p{margin:0;color:#dfe6f3;font-size:15px}
.hero .who{font-weight:700;color:#fff}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:10px 18px;font-weight:900;font-size:14.5px;text-decoration:none;background:var(--sun);color:#2a1d00}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;border:1.5px solid rgba(255,255,255,.4)}
.btn.line{background:var(--card);color:var(--ink2);border:1.5px solid var(--line)}
.btn.small{padding:6px 13px;font-size:13px}
/* timeline */
.timeline{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:10px}
.tl{display:flex;height:46px;border-radius:12px;overflow:hidden;gap:3px}
.tl a{display:grid;place-items:center;text-decoration:none;color:#fff;font-weight:900;font-size:13px;min-width:0;padding:0 4px;text-align:center;line-height:1.15}
.tl a small{display:block;font-weight:500;font-size:10.5px;opacity:.85}
.tlleg{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
/* part cards */
.parts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.part{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.part .pic{aspect-ratio:16/9;background:var(--deep);overflow:hidden}
.part .pic img{width:100%;height:100%;object-fit:cover;object-position:68% 50%}
.part .body{padding:14px 16px 16px;display:grid;gap:8px;align-content:start}
.part .num{font-family:var(--fDisplay);font-weight:700;font-size:13px;color:var(--ink2);letter-spacing:.06em}
.part h3{font-size:16px}
.part ol{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.part li a{display:flex;gap:8px;text-decoration:none;color:var(--text);font-size:13.5px;align-items:baseline}
.part li a b{font-family:var(--fDisplay);font-weight:900;color:var(--ink2);min-width:20px}
/* three panels */
.panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:6px}
.panel b{font-family:var(--fDisplay);font-weight:900;font-size:18px;color:var(--ink)}
.panel p{margin:0;font-size:14px;color:var(--muted)}
.panel .where{font-size:12px;font-weight:700;color:var(--chipText)}
.bookbox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.bookbox img{width:64px}
.bookbox p{margin:0;font-size:14px;color:var(--muted)}
/* step header */
.stephead{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:0;background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
.stephead .l{padding:24px 26px;display:grid;gap:12px;align-content:center}
.stephead .r{position:relative;background:var(--deep);min-height:200px}
.stephead .r img.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:70% 50%;opacity:.95}
.stephead .r img.ico{position:absolute;right:14px;bottom:10px;width:110px;filter:drop-shadow(0 10px 16px rgba(0,0,0,.35))}
.snum{display:flex;align-items:center;gap:12px}
.snum b{font-family:var(--fDisplay);font-weight:900;font-size:14px;color:#fff;background:var(--ink2);border-radius:999px;padding:4px 14px}
.snum span{color:var(--muted);font-size:13px;font-weight:700}
.stephead h1{font-family:var(--fDisplay);font-weight:900;font-size:clamp(22px,2.7vw,31px);color:var(--ink);letter-spacing:-.01em}
.goal{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;background:var(--promptBg);border-radius:14px;padding:12px 14px}
.goal i{font-style:normal;font-weight:900;color:#2a1d00;background:var(--sun);border-radius:8px;padding:2px 8px;font-size:12.5px;white-space:nowrap}
.goal p{margin:0;font-weight:700}
.intro{margin:0;max-width:72ch;font-family:var(--fSoft);font-size:16.5px;line-height:1.8}
/* files */
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.file{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;color:var(--text)}
.file:hover{border-color:var(--ink2)}
.file .k{width:44px;height:52px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:900;color:#fff;background:var(--coral)}
.file .k.png{background:var(--mint)} .file .k.txt{background:#7a7598} .file .k.hwp,.file .k.hwpx{background:#2b8fd6} .file .k.jpg{background:#d99a00} .file .k.xlsx{background:#1f8a4c}
.file b{display:block;font-size:14px;line-height:1.35}
.file small{color:var(--muted);font-size:12px}
.filebig{grid-template-columns:52px minmax(0,1fr) auto}
.filebig .dl{font-size:13px;font-weight:900;color:var(--ink2);white-space:nowrap}
/* todo */
.todo{counter-reset:t;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.todo li{counter-increment:t;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 48px;position:relative;font-weight:700;font-size:14px;line-height:1.45}
.todo li::before{content:counter(t);position:absolute;left:12px;top:11px;width:26px;height:26px;border-radius:50%;background:var(--ink2);color:#fff;display:grid;place-items:center;font-family:var(--fBody);font-weight:900;font-size:13px}
/* captures */
.caps{display:grid;gap:18px}
.cap{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:16px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.shot{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);cursor:zoom-in;background:#fff}
.shot img{display:block;width:100%;height:auto}
.mk{position:absolute;border:3px solid var(--coral);border-radius:6px;pointer-events:none}
.mk.green{border-color:var(--mint)}
.mk b{position:absolute;left:-13px;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:900;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.mk.green b{background:var(--mint)}
.capinfo{display:grid;gap:10px;align-content:start;padding:4px 2px}
.capinfo h3{font-size:16px}
.capinfo ol{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.capinfo li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:9px;font-size:14px;line-height:1.5}
.capinfo li b{width:24px;height:24px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font-size:12.5px}
.capinfo li.green b{background:var(--mint)}
/* formula */
.formula{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fx{border-radius:16px;padding:14px 16px;display:grid;gap:4px;background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c)}
.fx b{font-family:var(--fDisplay);font-weight:900;font-size:20px;color:var(--c)}
.fx span{font-size:13px;color:var(--muted)}
.fx em{font-style:normal;font-size:13.5px;font-weight:700}
/* prompts */
.prompts{display:grid;gap:14px}
.prompt{background:var(--promptBg);border:1.5px solid color-mix(in srgb,var(--ink2) 35%,transparent);border-radius:18px;padding:16px 18px;display:grid;gap:10px}
.phead{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pid{font-family:var(--fBody);font-weight:900;font-size:13px;color:#fff;background:var(--ink2);border-radius:8px;padding:2px 9px}
.phead h3{font-size:15.5px;flex:1 1 220px;min-width:0}
.pwhere{font-size:13px;color:var(--muted)}
.pwhere b{color:var(--text)}
.ptext{margin:0;white-space:pre-wrap;font-family:var(--fBody);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14.5px;line-height:1.75;max-height:none}
.pfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.copy{border:0;border-radius:999px;background:var(--ink2);color:#fff;font-weight:900;font-size:13.5px;padding:8px 16px;display:inline-flex;gap:6px;align-items:center}
.copy.ok{background:var(--mint)}
/* results */
.results{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.results.wide{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.res{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--card);cursor:zoom-in;padding:0}
.res img{display:block;width:100%;height:auto}
.res figcaption{font-size:12.5px;padding:8px 10px;color:var(--muted)}
/* tips */
.tips{display:grid;gap:8px}
.tip{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;background:var(--card);border:1px dashed color-mix(in srgb,var(--ink2) 45%,transparent);border-radius:14px;padding:12px 14px;font-size:14px}
.tip b{font-family:var(--fDisplay);font-weight:900;color:var(--ink2);font-size:14px}
.challenge{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:center;background:linear-gradient(120deg,var(--deep),var(--ink2));color:#fff;border-radius:18px;padding:14px 18px}
.challenge img{width:72px}
.challenge b{font-family:var(--fDisplay);font-weight:900;font-size:17px;color:var(--sun);display:block}
.challenge p{margin:0;font-size:14.5px}
/* checks */
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.check{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;text-align:left;color:var(--text)}
.check .box{width:28px;height:28px;border-radius:8px;border:2.5px solid var(--ink2);display:grid;place-items:center;color:#fff;font-weight:900}
.check.on .box{background:var(--mint);border-color:var(--mint)}
.check b{display:block;font-size:15.5px}
.check span{font-size:13.5px;color:var(--muted)}
/* footer nav */
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:40px;flex-wrap:wrap}
.pager a{flex:1 1 240px;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px;color:var(--text);display:grid;gap:2px}
.pager a small{color:var(--muted);font-size:12px}
.pager a b{font-size:15px}
.pager a.next{text-align:right}
.donebtn{border:2px solid var(--mint);background:transparent;color:var(--mint);font-weight:900;border-radius:999px;padding:9px 18px}
.donebtn.on{background:var(--mint);color:#fff}
/* prompt library */
.search{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search input{flex:1 1 260px;min-width:0;border:1.5px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:10px 16px;font:inherit}
.filter{border:1.5px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.filter[aria-pressed="true"]{background:var(--ink2);border-color:var(--ink2);color:#fff}
.empty{color:var(--muted);text-align:center;padding:30px}
/* character pipeline */
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.fl{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column}
.fl:not(:last-child)::after{content:'→';position:absolute;right:-16px;top:70px;font-family:var(--fDisplay);font-size:22px;color:var(--ink2);z-index:2}
.fl .pic{aspect-ratio:1/1;background:#fff8e6;border-radius:18px 18px 0 0;display:grid;place-items:center;overflow:hidden;cursor:zoom-in}
.fl .pic{position:relative}
.fl .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.fl .pic.cover img{width:100%;height:100%;object-fit:cover}
.fl .b{padding:10px 12px 12px;display:grid;gap:4px}
.fl .b i{font-style:normal;font-family:var(--fDisplay);font-size:14px;color:var(--ink2)}
.fl .b b{font-size:15px}
.fl .b span{font-size:13px;color:var(--muted)}
.fl .pin{margin-top:4px;grid-column:auto}
.fl .pin summary{padding:7px 10px;font-size:13px}
.fl .pin summary::after{content:'▾'}
.fl .pin[open] summary::after{content:'▴'}
.cutter{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.cutter img{width:100%;border-radius:12px;display:block}
.cutter b{font-family:var(--fDisplay);font-weight:900;font-size:19px;color:var(--ink)}

.refs{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px;display:grid;gap:3px}

/* lightbox */

body{font-synthesis:none}
h2,.stephead h1,.hero h1,.brand b,.part h3,.panel b,.fx b,.closing .ccap b,.discuss p,.challenge b,.tip b,.top b,.ap b,.pp b{font-weight:400}

/* roles */
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.role{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:4px;border-top:5px solid var(--c)}
.role .em{font-size:30px;line-height:1}

.role i{font-style:normal;font-size:12.5px;font-weight:900;color:var(--c)}
.role p{margin:0;font-size:13.5px;color:var(--muted)}
/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;counter-reset:pp}
.pp{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 16px 14px;display:grid;gap:4px;counter-increment:pp}
.pp::before{content:counter(pp);position:absolute;right:14px;top:10px;font-family:var(--fDisplay);font-size:34px;color:color-mix(in srgb,var(--ink2) 22%,transparent)}
.pp:not(:last-child)::after{content:'→';position:absolute;right:-14px;top:50%;transform:translateY(-50%);font-size:20px;color:var(--ink2);z-index:2}
.pp b{font-family:var(--fDisplay);font-size:22px;color:var(--ink)}
.pp i{font-style:normal;font-size:12.5px;font-weight:900;color:var(--ink2)}
.pp p{margin:0;font-size:13.5px;color:var(--muted)}
/* warn */
.warn{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;background:color-mix(in srgb,var(--coral) 9%,var(--card));border:2px solid color-mix(in srgb,var(--coral) 55%,transparent);border-radius:16px;padding:14px 16px;font-weight:700}
.warn span{font-size:24px}
/* apply */
.apply{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.ap{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:6px;align-content:start}
.ap .bd{justify-self:start;font-family:var(--fDisplay);font-size:15px;color:#fff;background:var(--ink2);border-radius:10px;padding:2px 10px}
.ap b{font-family:var(--fDisplay);font-size:19px;color:var(--ink)}
.ap p{margin:0;font-size:13.5px;color:var(--muted)}
/* formula 4 */
.formula.f4{grid-template-columns:repeat(4,minmax(0,1fr))}
/* home extras */
.other{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:16px;align-items:center;background:linear-gradient(120deg,var(--deep),var(--ink2));color:#fff;border-radius:20px;padding:16px 20px;text-decoration:none}

.mascot{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}

.hello{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 18px}
.hello img{width:110px}
.hello p{margin:0;font-family:var(--fSoft);font-size:16px;line-height:1.75}
.hello b{color:var(--ink2)}
.livebox .lh b{font-weight:400}
.lv.file{border-style:dashed}
.results .res img{aspect-ratio:16/10;object-fit:cover;object-position:left top}
.results.wide .res img{aspect-ratio:16/10}
@media (max-width:900px){.roles,.pipe,.formula.f4{grid-template-columns:repeat(2,minmax(0,1fr))}.pp:nth-child(2)::after{display:none}.other{grid-template-columns:1fr}.other img{display:none}.mascot{grid-template-columns:repeat(5,minmax(0,1fr))}}

<script>
const C=JSON.parse(document.getElementById('course').textContent);
const PADLET_URL=C.padlet;
const FILE_BASE='../files/';
const K='et26-'+C.key;
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stepById=Object.fromEntries(C.steps.map(s=>[s.id,s]));
const partById=Object.fromEntries(C.parts.map(p=>[p.id,p]));
const ICO=n=>'../art/'+n+'.webp';
let done={};try{done=JSON.parse(localStorage.getItem(K+'-done')||'{}')}catch(e){done={}}
const saveDone=()=>{try{localStorage.setItem(K+'-done',JSON.stringify(done))}catch(e){}};
let checks={};try{checks=JSON.parse(localStorage.getItem(K+'-checks')||'{}')}catch(e){checks={}}
function fileUrl(k){return FILE_BASE+encodeURIComponent(C.files[k].name)}
function linkOf(u){return u.startsWith('files:')?{href:fileUrl(u.slice(6)),file:true}:{href:u,file:false}}
function renderNav(){
  let h='';
  C.parts.forEach(p=>{
    h+=`<div class="partlab">PART ${p.num} · ${esc(p.title.split(' — ')[0])}</div>`;
    p.steps.forEach(id=>{const s=stepById[id];
      h+=`<a class="stepnav${done[id]?' done':''}" href="#${id}" data-view="${id}"><span class="t">${s.num}. ${esc(s.short)}</span><span class="n">✓</span></a>`;});
  });
  $('#stepNav').innerHTML=h;
  const n=Object.keys(done).filter(k=>done[k]).length;
  $('#progText').textContent=`완료 ${n} / ${C.steps.length}단계`;
  $('#progBar').style.width=(n/C.steps.length*100)+'%';
}
function shot(c,cls=''){
  const mk=(c.marks||[]).map(m=>`<span class="mk ${m[5]==='green'?'green':''}" style="left:${m[0]/c.w*100}%;top:${m[1]/c.h*100}%;width:${m[2]/c.w*100}%;height:${m[3]/c.h*100}%"><b>${m[4]}</b></span>`).join('');
  return `<div class="shot ${cls}" data-zoom="${esc(c.img)}" role="button" tabindex="0" aria-label="${esc(c.title)} 크게 보기"><img src="${esc(c.img)}" alt="${esc(c.title)}" loading="lazy" width="${c.w}" height="${c.h}">${mk}</div>`;
}
const PBY={};C.steps.forEach(s=>s.prompts.forEach(p=>PBY[p.id]=p));
function pin(pid,cls=''){const p=PBY[pid];if(!p)return '';
  return `<details class="pin ${cls}"><summary><span class="pid">${p.id}</span>${cls.includes('mini')?'📋 프롬프트':'📋 붙여 넣을 프롬프트'}</summary><pre class="ptext">${esc(p.text)}</pre><div class="pfoot"><button class="copy" data-copy="${p.id}">복사하기</button></div></details>`;}
function capCard(c){
  const colorOf=n=>{const m=(c.marks||[]).find(x=>x[4]===n);return m&&m[5]==='green'?'green':''};
  const at=n=>(c.pr||[]).filter(x=>x[0]===n).map(x=>pin(x[1])).join('');
  const li=(c.steps||[]).map((t,i)=>`<li class="${colorOf(i+1)}"><b>${i+1}</b><span>${esc(t)}</span>${at(i+1)}</li>`).join('');
  const solo=(c.pr||[]).filter(x=>x[0]===0).map(x=>pin(x[1],'solo')).join('');
  return `<div class="cap">${shot(c)}<div class="capinfo"><h3>${esc(c.title)}</h3>${li?`<ol>${li}</ol>`:''}${solo}</div></div>`;
}
function promptCard(p){
  return `<article class="prompt" id="${p.id}"><div class="phead"><span class="pid">${p.id}</span><h3>${esc(p.title)}</h3><span class="chip sun">${esc(p.tool)}</span></div>
  <div class="pwhere">붙여 넣을 곳 · <b>${esc(p.where)}</b></div>
  <pre class="ptext">${esc(p.text)}</pre>
  <div class="pfoot"><span></span><button class="copy" data-copy="${p.id}">복사하기</button></div></article>`;
}
function fileChip(k){const f=C.files[k];const kk=f.kind.toLowerCase();
  return `<a class="file" href="${fileUrl(k)}" target="_blank" rel="noopener" download><span class="k ${kk}">${f.kind}</span><span><b>${esc(f.label)}</b><small>${esc(f.use)} · ${f.size}</small></span></a>`;}
function liveBox(list){
  if(!list||!list.length) return '';
  return `<section class="sec"><div class="livebox"><div class="lh"><b>바로 열기 · 바로 받기</b><span>누르면 새 탭에서 열리거나 내려받아져요</span></div><div class="live">${list.map(([i,t,u])=>{const L=linkOf(u);return `<a class="lv${L.file?' file':''}" href="${esc(L.href)}" target="_blank" rel="noopener"${L.file?' download':''}>${i} ${esc(t)}${L.file?' ↓':' ↗'}</a>`}).join('')}</div></div></section>`;
}
function viewHome(){
  const parts=C.parts.map(p=>`<article class="part"><div class="pic"><img src="${p.art.replace('.webp','_s.webp')}" alt="${esc(p.title)} 그림" loading="lazy"></div><div class="body"><span class="num">PART ${p.num}</span><h3>${esc(p.title)}</h3><ol>${p.steps.map(id=>{const s=stepById[id];return `<li><a href="#${id}"><b>${s.num}.</b><span>${esc(s.short)}</span></a></li>`}).join('')}</ol></div></article>`).join('');
  const pipe=C.pipeline.map(([b,i,p])=>`<div class="pp"><i>${esc(i)}</i><b>${esc(b)}</b><p>${esc(p)}</p></div>`).join('');
  const gal=C.gallery.slice(0,4).map(g=>`<figure class="res" data-zoom="${g.img}" role="button" tabindex="0" style="margin:0"><img src="${g.img}" alt="${esc(g.title)}" loading="lazy"><figcaption><b style="color:var(--text)">${esc(g.title)}</b><br>${esc(g.tool)} · <a href="#${g.step}">STEP ${stepById[g.step].num}</a></figcaption></figure>`).join('');
  return `<section class="hero"><img src="${C.cover}" alt="선생님들과 마스코트 구르미가 반짝이는 디지털 카드에 둘러싸여 함께 웃는 교실 그림"><div class="shade"></div>
   <div class="hcopy"><span class="tag">${esc(C.meta.target)} · ${C.meta.date} ${C.meta.time}</span><h1>${C.hero.h1}</h1>
   <p>${esc(C.hero.lead)}</p><p class="who">${esc(C.meta.lecturer)} · ${esc(C.meta.place)}</p>
   <div class="btns"><a class="btn" href="#s0">STEP 0부터 따라 하기</a><a class="btn ghost" href="#files">실습 자료 받기</a><a class="btn ghost" href="${PADLET_URL}" target="_blank" rel="noopener">연수 패들렛 ↗</a></div></div></section>
  <section class="sec"><div class="hello"><img src="${ICO('gu_wave')}" alt="마스코트 구르미"><p>안녕하세요, 저는 <b>구르미</b>예요! 오늘은 <b>6학년 과학 ‘지층과 화석’ 한 단원</b>을 처음부터 끝까지 따라가요. 단계마다 <b>실제 화면에 번호</b>가 붙어 있고, 프롬프트는 <b>복사하기</b> 한 번이면 돼요. 화면을 누르면 크게 보여요.</p></div></section>
  <section class="sec"><div class="sechead"><h2>오늘의 흐름</h2><p>한 단원이 이렇게 굴러가요</p></div><div class="pipe">${pipe}</div></section>
  <section class="sec"><div class="parts">${parts}</div></section>
  <section class="sec"><div class="sechead"><h2>실제로 만든 결과물</h2><p>누르면 크게 · <a href="#gallery">전체 갤러리 →</a></p></div><div class="results">${gal}</div></section>
  <section class="sec"><div class="sechead"><h2>실습 자료</h2><p>내려받아 바로 쓰는 파일 · 프롬프트 ${Object.keys(PBY).length}개</p></div><div class="files">${Object.keys(C.files).map(fileChip).join('')}</div>
   <div class="btns"><a class="btn" href="${FILE_BASE+encodeURIComponent(C.zip)}" download>📦 한꺼번에 받기 (ZIP)</a><a class="btn line" href="${FILE_BASE+encodeURIComponent(C.card)}" target="_blank" rel="noopener">🧾 프롬프트 카드 PDF</a><a class="btn line" href="#prompts">📋 프롬프트 모음</a></div></section>
  <section class="sec"><a class="other" href="${C.other.href}"><img src="${C.key==='basic'?'../art/cover_deep_s.webp':'../art/cover_basic_s.webp'}" alt=""><span><b>${esc(C.other.label)}</b><span>${C.key==='basic'?'오늘 모은 응답과 보고서가, 학생마다 다른 피드백으로 돌아가는 다음 이야기':'설문 · 문서 · 시트 · 드라이브 · Sites — 피드백의 재료를 모으는 기본기'}</span></span><em>열기</em></a></section>`;
}
function viewStep(s){
  const p=partById[s.part];const i=C.steps.indexOf(s);const prev=C.steps[i-1],next=C.steps[i+1];
  let h=`<header class="stephead"><div class="l"><div class="snum"><b>STEP ${s.num}</b><span>PART ${p.num} · ${esc(p.title)}</span></div>
   <h1>${esc(s.title)}</h1><div class="chips">${s.caps.length?`<span class="chip">실제 화면 ${s.caps.length}장</span>`:''}${s.prompts.length?`<span class="chip">프롬프트 ${s.prompts.length}개</span>`:''}</div></div>
   <div class="r"><img class="art" src="${p.art.replace('.webp','_s.webp')}" alt="" loading="lazy"><img class="ico" src="${ICO(s.icon)}" alt=""></div></header>`;
  if(s.warn) h+=`<section class="sec"><div class="warn"><span>⚠️</span><div>${esc(s.warn)}</div></div></section>`;
  h+=liveBox(s.live);
  if(s.todo) h+=`<section class="sec"><div class="sechead"><h2>이렇게 따라 해요</h2></div><ol class="todo">${s.todo.map(t=>`<li>${esc(t)}</li>`).join('')}</ol></section>`;
  if(s.roles) h+=`<section class="sec"><div class="sechead"><h2>공유 권한 세 단계</h2><p>링크를 보내기 전에 하나만 고르기</p></div><div class="roles">${s.roles.map((r,k)=>`<div class="role" style="--c:${['#1a73e8','#f29900','#1e8e3e'][k]}"><span class="em">${r[0]}</span><b>${esc(r[1])}</b><i>${esc(r[2])}</i><p>${esc(r[3])}</p></div>`).join('')}</div></section>`;
  if(s.formula) h+=`<section class="sec"><div class="sechead"><h2>프롬프트 레시피 — 네 가지만</h2><p>한 번 적어 두면 답변만 바꿔 붙이면 돼요</p></div><div class="formula f4">${s.formula.map((f,k)=>`<div class="fx" style="--c:${['#e5484d','#2b8fd6','#2fae86','#e8a43c'][k]}"><b>${esc(f[0])}</b><em>예) ${esc(f[1])}</em><span>${esc(f[2])}</span></div>`).join('')}</div></section>`;
  if(s.caps&&s.caps.length) h+=`<section class="sec"><div class="sechead"><h2>실제 화면으로 보기</h2><p>번호 순서대로 · 누르면 크게 보여요</p></div><div class="caps">${s.caps.map(capCard).join('')}</div></section>`;
  if(s.prompts.length) h+=`<section class="sec"><div class="sechead"><h2>복사해서 쓰는 프롬프트</h2></div><div class="prompts">${s.prompts.map(promptCard).join('')}</div></section>`;
  if(s.apply) h+=`<section class="sec"><div class="sechead"><h2>${C.key==='basic'?'우리 교실에 바로 — 교과별 한 가지':'한 단원이 이렇게 흐릅니다'}</h2></div><div class="apply">${s.apply.map(a=>`<div class="ap"><span class="bd">${esc(a[0])}</span><b>${esc(a[1])}</b><p>${esc(a[2])}</p></div>`).join('')}</div></section>`;
  if(s.checks) h+=`<section class="sec"><div class="sechead"><h2>${C.key==='basic'?'클라우드 수업, 여섯 가지 약속':'AI 피드백, 여섯 가지 약속'}</h2><p>눌러서 우리 반 점검 표시</p></div><div class="checks">${s.checks.map((c,k)=>`<button class="check${checks[k]?' on':''}" data-check="${k}"><span class="box">${checks[k]?'✓':''}</span><span><b>${esc(c[0])}</b><span>${esc(c[1])}</span></span></button>`).join('')}</div></section>`;
  if(s.closing){const c=s.closing;h+=`<section class="sec"><div class="closing"><img src="${esc(c.img)}" alt="선생님들과 구르미가 함께 웃는 마무리 그림" loading="lazy"><div class="ccap"><p>${esc(c.lead)}</p><b>${esc(c.msg)}</b></div></div><div class="btns" style="justify-content:center"><a class="btn" href="${PADLET_URL}" target="_blank" rel="noopener">패들렛에 한 줄 후기 남기기 ↗</a><a class="btn line" href="#gallery">결과물 갤러리 보기</a></div></section>`;}
  if(s.tips||s.challenge) h+=`<section class="sec"><div class="tips">${(s.tips||[]).map(t=>`<div class="tip"><b>TIP</b><span>${esc(t)}</span></div>`).join('')}</div>${s.challenge?`<div class="challenge"><img src="${ICO('gu_idea')}" alt=""><div><b>더 해 보기</b><p>${esc(s.challenge)}</p></div></div>`:''}</section>`;
  h+=`<div class="pager">${prev?`<a href="#${prev.id}"><small>← 이전</small><b>STEP ${prev.num} · ${esc(prev.short)}</b></a>`:`<a href="#home"><small>← 처음</small><b>처음 화면</b></a>`}
   <button class="donebtn${done[s.id]?' on':''}" data-done="${s.id}">${done[s.id]?'✓ 완료했어요':'이 단계 완료 표시'}</button>
   ${next?`<a class="next" href="#${next.id}"><small>다음 →</small><b>STEP ${next.num} · ${esc(next.short)}</b></a>`:`<a class="next" href="#gallery"><small>다음 →</small><b>결과물 갤러리</b></a>`}</div>`;
  return h;
}
function viewFiles(){
  const keys=Object.keys(C.files);
  return `<section class="sec" style="margin-top:0"><div class="eyebrow">MATERIALS</div><h2>실습 자료 내려받기</h2><p class="intro">연수용 가상 자료입니다. 학생 이름 대신 번호만 들어 있어요. Word · 엑셀 파일은 드라이브에 올린 뒤 ‘Google 문서/시트로 열기’ 하면 오늘 실습 그대로 이어집니다.</p>
   <div class="btns"><a class="btn" href="${FILE_BASE+encodeURIComponent(C.zip)}" download>📦 한꺼번에 받기 (ZIP)</a><a class="btn line" href="${FILE_BASE+encodeURIComponent(C.card)}" target="_blank" rel="noopener">🧾 프롬프트 카드 PDF (${Object.keys(PBY).length}개)</a></div>
   <div class="files" style="grid-template-columns:1fr">${keys.map(k=>{const f=C.files[k];return `<a class="file filebig" href="${fileUrl(k)}" target="_blank" rel="noopener" download><span class="k ${f.kind.toLowerCase()}">${f.kind}</span><span><b>${esc(f.label)}</b><small>${esc(f.desc)}<br>쓰는 곳: ${esc(f.use)} · ${f.size}</small></span><span class="dl">받기 ↓</span></a>`}).join('')}</div></section>`;
}
let pf='all',pq='';
function viewPrompts(){
  const all=[];C.steps.forEach(s=>s.prompts.forEach(p=>all.push({...p,step:s})));
  const fl=all.filter(p=>(pf==='all'||p.step.id===pf)&&(!pq||(p.title+p.text+p.tool).includes(pq)));
  const btn=(id,lab)=>`<button class="filter" data-filter="${id}" aria-pressed="${pf===id}">${lab}</button>`;
  return `<section class="sec" style="margin-top:0"><div class="eyebrow">PROMPTS</div><h2>프롬프트 모음 · ${all.length}개</h2>
   <div class="search"><input id="pq" type="search" placeholder="찾을 말 (예: 루브릭, 설문, 홈페이지)" value="${esc(pq)}" aria-label="프롬프트 검색"></div>
   <div class="chips">${btn('all','전체')}${C.steps.filter(s=>s.prompts.length).map(s=>btn(s.id,`STEP ${s.num} ${s.short}`)).join('')}</div>
   <div class="prompts" id="plist">${fl.length?fl.map(p=>promptCard(p).replace('<h3>',`<h3><a href="#${p.step.id}" style="color:inherit;text-decoration:none">STEP ${p.step.num} · </a>`)).join(''):'<p class="empty">찾는 프롬프트가 없어요. 다른 말로 찾아보세요.</p>'}</div></section>`;
}
function viewGallery(){
  return `<section class="sec" style="margin-top:0"><div class="eyebrow">GALLERY</div><h2>결과물 갤러리</h2><p class="intro">오늘 실습 흐름 그대로 실제로 만든 화면입니다. 누르면 크게 보이고, 단계 이름을 누르면 만드는 방법으로 갑니다.</p>
   <div class="results wide">${C.gallery.map(g=>`<figure class="res" data-zoom="${g.img}" role="button" tabindex="0" style="margin:0"><img src="${g.img}" alt="${esc(g.title)}" loading="lazy"><figcaption><b style="color:var(--text)">${esc(g.title)}</b><br>${esc(g.tool)} · <a href="#${g.step}">STEP ${stepById[g.step].num} ${esc(stepById[g.step].short)}</a>${g.url?`<br><a class="go" href="${esc(g.url)}" target="_blank" rel="noopener">직접 풀어 보기 ↗</a>`:''}</figcaption></figure>`).join('')}</div>
   <div class="sechead" style="margin-top:20px"><h2>마스코트 구르미</h2><p>ChatGPT로 그린 연수 마스코트 — 자유롭게 써도 돼요</p></div>
   <div class="mascot">${['gu_wave','gu_point','gu_laptop','gu_check','gu_magnifier','gu_letter','gu_thumbs','gu_idea','gu_cheer'].map(n=>`<img src="${ICO(n)}" alt="구르미 ${n.slice(3)}" loading="lazy">`).join('')}</div></section>`;
}
function route(){
  let v=(location.hash||'#home').slice(1);
  if(!(v==='home'||v==='files'||v==='prompts'||v==='gallery'||stepById[v]||/^[AB]\d+$/.test(v))) v='home';
  let target=null;
  if(/^[AB]\d+$/.test(v)){const s=C.steps.find(s=>s.prompts.some(p=>p.id===v));target=v;v=s?s.id:'home';}
  const html=v==='home'?viewHome():v==='files'?viewFiles():v==='prompts'?viewPrompts():v==='gallery'?viewGallery():viewStep(stepById[v]);
  $('#view').innerHTML=html;
  document.querySelectorAll('[data-view]').forEach(a=>{if(a.dataset.view===v)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  $('#side').classList.remove('open');
  if(target){const el=document.getElementById(target);if(el)el.scrollIntoView({block:'start'});}else window.scrollTo(0,0);
  const t={home:C.meta.title,files:'실습 자료',prompts:'프롬프트 모음',gallery:'결과물 갤러리'}[v]||('STEP '+stepById[v].num+' · '+stepById[v].short);
  document.title=t+' | '+C.meta.target+' 아카이브';
}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1600)}
function copyText(txt,btn){
  const ok=()=>{btn.classList.add('ok');btn.textContent='복사됨 ✓';toast('복사했어요 — 붙여 넣으세요');setTimeout(()=>{btn.classList.remove('ok');btn.textContent='복사하기'},1800)};
  const fb=()=>{const pre=btn.closest('.prompt, .pin').querySelector('.ptext');const r=document.createRange();r.selectNodeContents(pre);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);toast('글자가 선택됐어요 — Ctrl+C로 복사하세요')};
  try{navigator.clipboard.writeText(txt).then(ok,fb)}catch(e){fb()}
}
function openLB(src){
  const card=document.querySelector(`[data-zoom="${CSS.escape(src)}"]`);
  const lb=document.createElement('div');lb.className='lb';lb.setAttribute('role','dialog');
  const inner=card&&card.classList.contains('shot')?card.outerHTML.replace('class="shot','class="shot big'):`<img src="${src}" alt="">`;
  lb.innerHTML=`<div class="in">${inner}</div><button class="x">닫기 ✕</button>`;
  lb.addEventListener('click',e=>{if(e.target===lb||e.target.classList.contains('x'))lb.remove()});
  document.addEventListener('keydown',function k(e){if(e.key==='Escape'){lb.remove();document.removeEventListener('keydown',k)}});
  document.body.appendChild(lb);
}
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-copy]');if(c){const p=PBY[c.dataset.copy];copyText(p.text,c);return}
  const z=e.target.closest('[data-zoom]');if(z&&!e.target.closest('.lb')&&!e.target.closest('a')){openLB(z.dataset.zoom);return}
  const d=e.target.closest('[data-done]');if(d){const id=d.dataset.done;done[id]=!done[id];saveDone();renderNav();d.classList.toggle('on',!!done[id]);d.textContent=done[id]?'✓ 완료했어요':'이 단계 완료 표시';if(done[id])toast('STEP '+stepById[id].num+' 완료!');return}
  const ck=e.target.closest('[data-check]');if(ck){const k=ck.dataset.check;checks[k]=!checks[k];try{localStorage.setItem(K+'-checks',JSON.stringify(checks))}catch(_){}ck.classList.toggle('on',!!checks[k]);ck.querySelector('.box').textContent=checks[k]?'✓':'';return}
  const f=e.target.closest('[data-filter]');if(f){pf=f.dataset.filter;route();return}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const z=e.target.closest&&e.target.closest('[data-zoom]');if(z)openLB(z.dataset.zoom)}});
document.addEventListener('input',e=>{if(e.target.id==='pq'){pq=e.target.value.trim();const pos=e.target.selectionStart;route();const i=$('#pq');i.focus();i.setSelectionRange(pos,pos)}});
$('#menuBtn').addEventListener('click',()=>$('#side').classList.toggle('open'));
$('#main').addEventListener('click',()=>$('#side').classList.remove('open'));
$('#padletLink').href=PADLET_URL;
window.addEventListener('hashchange',route);
renderNav();route();
</script>

</body>
</html>
