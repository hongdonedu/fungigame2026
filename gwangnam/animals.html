<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"><meta property="og:title" content="동물 분류 탐정"><meta property="og:description" content="3학년 과학 동물의 생활 – 특징에 따라 동물을 분류하는 웹앱"><meta property="og:image" content="https://hongdonedu.github.io/fungigame2026/gwangnam/shots/animals.jpg"><meta property="og:url" content="https://hongdonedu.github.io/fungigame2026/gwangnam/animals.html"><meta name="twitter:card" content="summary_large_image">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동물 분류 탐정</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jua', sans-serif;
            background-color: #fdfbf7; /* 따뜻한 배경색 */
            user-select: none; /* 아이들이 터치하다가 텍스트가 선택되는 것 방지 */
        }
        .card-enter {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
</head>
<body class="text-gray-800 pb-10">

    <div class="max-w-5xl mx-auto px-4 pt-8">
        
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-4xl md:text-5xl font-bold text-amber-500 mb-3 drop-shadow-md">🐾 동물 분류 탐정 🔎</h1>
            <p class="text-xl text-gray-600">특징에 따라 동물 친구들을 올바른 바구니에 나누어 담아주세요!</p>
        </header>

        <!-- Criteria Selection -->
        <div class="bg-white rounded-3xl shadow-md p-6 mb-8 border-4 border-amber-100">
            <h2 class="text-2xl text-center mb-4 text-amber-700">1. 먼저, 분류 기준을 골라주세요!</h2>
            <div class="flex flex-col md:flex-row justify-center gap-4">
                <button onclick="selectCriterion('wings')" id="btn-wings" class="criterion-btn flex-1 py-4 px-2 bg-blue-100 text-blue-700 rounded-2xl text-2xl hover:bg-blue-200 transition border-4 border-transparent shadow-sm">
                    🕊️ 날개가 있나요?
                </button>
                <button onclick="selectCriterion('legs4')" id="btn-legs4" class="criterion-btn flex-1 py-4 px-2 bg-green-100 text-green-700 rounded-2xl text-2xl hover:bg-green-200 transition border-4 border-transparent shadow-sm">
                    🐾 다리가 네 개인가요?
                </button>
                <button onclick="selectCriterion('water')" id="btn-water" class="criterion-btn flex-1 py-4 px-2 bg-cyan-100 text-cyan-700 rounded-2xl text-2xl hover:bg-cyan-200 transition border-4 border-transparent shadow-sm">
                    💧 물에서 사나요?
                </button>
            </div>
        </div>

        <!-- Game Area (Hidden until criterion is selected) -->
        <div id="game-area" class="hidden">
            
            <!-- Unsorted Animals -->
            <div class="bg-yellow-50 rounded-3xl shadow-inner p-6 mb-8 border-4 border-yellow-200 min-h-[160px]">
                <h3 class="text-xl text-yellow-700 mb-4 text-center">아직 분류되지 않은 동물 친구들 (카드를 눌러주세요)</h3>
                <div id="pool-container" class="grid grid-cols-4 md:grid-cols-6 gap-3">
                    <!-- Cards will be injected here -->
                </div>
            </div>

            <!-- Baskets -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <!-- Yes Basket -->
                <div class="bg-blue-50 border-4 border-blue-300 rounded-3xl p-6 min-h-[300px] flex flex-col relative">
                    <h3 class="text-3xl text-center text-blue-600 mb-4 bg-white py-2 rounded-full shadow-sm">⭕ 예 (그렇다)</h3>
                    <div id="yes-basket" class="flex-1 grid grid-cols-3 sm:grid-cols-4 gap-3 content-start">
                        <!-- Sorted items -->
                    </div>
                </div>
                
                <!-- No Basket -->
                <div class="bg-pink-50 border-4 border-pink-300 rounded-3xl p-6 min-h-[300px] flex flex-col relative">
                    <h3 class="text-3xl text-center text-pink-600 mb-4 bg-white py-2 rounded-full shadow-sm">❌ 아니오 (그렇지 않다)</h3>
                    <div id="no-basket" class="flex-1 grid grid-cols-3 sm:grid-cols-4 gap-3 content-start">
                        <!-- Sorted items -->
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="text-center">
                <button id="check-btn" onclick="checkAnswers()" class="hidden bg-amber-500 hover:bg-amber-600 text-white text-3xl py-4 px-10 rounded-full shadow-lg transform transition hover:scale-105">
                    ✔️ 정답 확인하기
                </button>
                <button id="reset-btn" onclick="resetGame()" class="hidden bg-gray-500 hover:bg-gray-600 text-white text-2xl py-3 px-8 rounded-full shadow-lg mt-4 mx-auto transform transition hover:scale-105">
                    🔄 다시 하기
                </button>
            </div>
        </div>
    </div>

    <!-- Action Modal (Ask Yes/No) -->
    <div id="action-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full mx-4 shadow-2xl transform scale-100 transition-transform">
            <div class="text-center mb-6">
                <span id="modal-emoji" class="text-6xl block mb-2"></span>
                <h3 class="text-3xl text-gray-800"><span id="modal-name" class="text-amber-500"></span> 은(는)</h3>
                <p id="modal-question" class="text-2xl text-blue-600 mt-2 font-bold"></p>
            </div>
            <div class="flex gap-4">
                <button onclick="moveTo('yes')" class="flex-1 bg-blue-100 hover:bg-blue-200 text-blue-700 border-2 border-blue-400 py-4 rounded-2xl text-2xl transition">
                    ⭕ 예
                </button>
                <button onclick="moveTo('no')" class="flex-1 bg-pink-100 hover:bg-pink-200 text-pink-700 border-2 border-pink-400 py-4 rounded-2xl text-2xl transition">
                    ❌ 아니오
                </button>
            </div>
            <button onclick="closeModal('action-modal')" class="w-full mt-4 bg-gray-100 text-gray-500 py-2 rounded-xl text-xl hover:bg-gray-200">취소</button>
        </div>
    </div>

    <!-- Alert Modal -->
    <div id="alert-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full mx-4 shadow-2xl text-center">
            <div class="text-5xl mb-4">🔔</div>
            <h3 id="alert-message" class="text-2xl text-gray-800 mb-6">메시지</h3>
            <button onclick="closeModal('alert-modal')" class="bg-amber-500 text-white px-8 py-3 rounded-full text-xl hover:bg-amber-600">확인</button>
        </div>
    </div>

    <!-- Result Modal -->
    <div id="result-modal" class="fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-3xl p-8 max-w-lg w-full mx-4 shadow-2xl text-center">
            <div id="result-icon" class="text-6xl mb-4"></div>
            <h2 id="result-title" class="text-4xl text-amber-500 mb-2">결과</h2>
            <p id="result-desc" class="text-2xl text-gray-600 mb-6"></p>
            <button onclick="closeModal('result-modal')" class="bg-amber-500 text-white px-10 py-3 rounded-full text-2xl hover:bg-amber-600">틀린 카드 확인하기</button>
        </div>
    </div>

    <script>
        // Data for 12 Animals
        const animals = [
            { id: 'sparrow', name: '참새', emoji: '🐦', wings: true, legs4: false, water: false, facts: { wings: '참새는 하늘을 나는 날개가 있어요.', legs4: '참새는 다리가 2개예요.', water: '참새는 주로 나무와 땅에서 살아요.' } },
            { id: 'dog', name: '개', emoji: '🐶', wings: false, legs4: true, water: false, facts: { wings: '개는 날개가 없어요.', legs4: '개는 다리가 4개예요.', water: '개는 땅에서 살아요.' } },
            { id: 'fish', name: '붕어', emoji: '🐟', wings: false, legs4: false, water: true, facts: { wings: '붕어는 날개 대신 지느러미가 있어요.', legs4: '붕어는 다리가 없어요.', water: '붕어는 물속에서 살아요.' } },
            { id: 'butterfly', name: '나비', emoji: '🦋', wings: true, legs4: false, water: false, facts: { wings: '나비는 예쁜 날개가 있어요.', legs4: '나비는 곤충이라 다리가 6개예요.', water: '나비는 땅과 하늘에서 살아요.' } },
            { id: 'cat', name: '고양이', emoji: '🐱', wings: false, legs4: true, water: false, facts: { wings: '고양이는 날개가 없어요.', legs4: '고양이는 다리가 4개예요.', water: '고양이는 땅에서 살아요.' } },
            { id: 'frog', name: '개구리', emoji: '🐸', wings: false, legs4: true, water: true, facts: { wings: '개구리는 날개가 없어요.', legs4: '개구리는 다리가 4개예요.', water: '개구리는 물과 땅을 오가며 살아요.' } },
            { id: 'dolphin', name: '돌고래', emoji: '🐬', wings: false, legs4: false, water: true, facts: { wings: '돌고래는 지느러미가 있어요.', legs4: '돌고래는 다리가 없어요.', water: '돌고래는 바다(물)에서 살아요.' } },
            { id: 'chicken', name: '닭', emoji: '🐔', wings: true, legs4: false, water: false, facts: { wings: '닭은 날개가 있어요.', legs4: '닭은 다리가 2개예요.', water: '닭은 땅에서 살아요.' } },
            { id: 'snake', name: '뱀', emoji: '🐍', wings: false, legs4: false, water: false, facts: { wings: '뱀은 날개가 없어요.', legs4: '뱀은 다리가 없어요.', water: '뱀은 주로 땅에서 살아요.' } },
            { id: 'turtle', name: '거북', emoji: '🐢', wings: false, legs4: true, water: true, facts: { wings: '거북은 날개가 없어요.', legs4: '거북은 다리가 4개예요.', water: '거북은 물과 땅을 오가며 살아요.' } },
            { id: 'bee', name: '벌', emoji: '🐝', wings: true, legs4: false, water: false, facts: { wings: '벌은 얇은 날개가 있어요.', legs4: '벌은 곤충이라 다리가 6개예요.', water: '벌은 주로 육지(공중)에서 활동해요.' } },
            { id: 'horse', name: '말', emoji: '🐴', wings: false, legs4: true, water: false, facts: { wings: '말은 날개가 없어요.', legs4: '말은 튼튼한 다리가 4개예요.', water: '말은 땅에서 살아요.' } }
        ];

        // Criteria details
        const criteriaDetails = {
            'wings': '날개가 있나요?',
            'legs4': '다리가 네 개인가요?',
            'water': '물에서 사나요?'
        };

        // State Variables
        let currentCriterion = null;
        let cardPositions = {}; // 'pool', 'yes', 'no'
        let isChecking = false;
        let selectedAnimalId = null;

        // Initialize positions
        function initPositions() {
            animals.forEach(a => cardPositions[a.id] = 'pool');
        }

        function selectCriterion(crit) {
            if (isChecking) {
                showAlert("이미 결과 확인을 마쳤어요. '다시 하기'를 눌러주세요!");
                return;
            }

            currentCriterion = crit;
            
            // Update button styles
            document.querySelectorAll('.criterion-btn').forEach(btn => {
                btn.classList.remove('ring-4', 'ring-amber-400', 'scale-105', 'bg-opacity-100');
                btn.classList.add('opacity-50');
            });
            const selectedBtn = document.getElementById(`btn-${crit}`);
            selectedBtn.classList.remove('opacity-50');
            selectedBtn.classList.add('ring-4', 'ring-amber-400', 'scale-105', 'bg-opacity-100');

            // Show Game Area
            document.getElementById('game-area').classList.remove('hidden');
            
            // Reset cards if criterion is changed mid-game
            initPositions();
            renderCards();
            updateCheckButton();
        }

        function handleCardClick(animalId) {
            if (isChecking) return;
            
            const animal = animals.find(a => a.id === animalId);
            selectedAnimalId = animal.id;

            // Set modal content
            document.getElementById('modal-emoji').innerText = animal.emoji;
            document.getElementById('modal-name').innerText = animal.name;
            document.getElementById('modal-question').innerText = `"${criteriaDetails[currentCriterion]}"`;

            // Show Modal
            document.getElementById('action-modal').classList.remove('hidden');
        }

        function moveTo(destination) {
            if (selectedAnimalId) {
                cardPositions[selectedAnimalId] = destination;
                selectedAnimalId = null;
                closeModal('action-modal');
                renderCards();
                updateCheckButton();
            }
        }

        function renderCards() {
            const pool = document.getElementById('pool-container');
            const yesBasket = document.getElementById('yes-basket');
            const noBasket = document.getElementById('no-basket');

            pool.innerHTML = '';
            yesBasket.innerHTML = '';
            noBasket.innerHTML = '';

            animals.forEach(animal => {
                const pos = cardPositions[animal.id];
                const card = document.createElement('div');
                
                // Card Styling
                let baseClasses = "card-enter bg-white rounded-2xl shadow-md cursor-pointer transform transition hover:-translate-y-2 hover:shadow-xl flex flex-col items-center justify-center p-3 border-2 border-gray-100 relative";
                
                if (isChecking) {
                    baseClasses = baseClasses.replace('cursor-pointer hover:-translate-y-2', 'cursor-default');
                    const expected = animal[currentCriterion] ? 'yes' : 'no';
                    
                    if (pos === expected) {
                        // Correct
                        baseClasses += " border-green-400 bg-green-50";
                        card.innerHTML = `
                            <div class="absolute -top-2 -right-2 bg-green-500 text-white rounded-full w-8 h-8 flex items-center justify-center text-xl font-bold shadow">O</div>
                        `;
                    } else {
                        // Incorrect
                        baseClasses += " border-red-400 bg-red-50 shake";
                        card.innerHTML = `
                            <div class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-8 h-8 flex items-center justify-center text-xl font-bold shadow">X</div>
                            <div class="absolute -bottom-8 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white text-sm py-1 px-3 rounded-lg whitespace-nowrap z-10 shadow-lg" style="font-family:'Noto Sans KR', sans-serif;">
                                ${animal.facts[currentCriterion]}
                            </div>
                        `;
                    }
                }

                card.className = baseClasses;
                if (!isChecking) {
                    card.onclick = () => handleCardClick(animal.id);
                }

                card.innerHTML += `
                    <span class="text-5xl mb-1">${animal.emoji}</span>
                    <span class="text-xl font-bold text-gray-700">${animal.name}</span>
                `;

                if (pos === 'pool') pool.appendChild(card);
                else if (pos === 'yes') yesBasket.appendChild(card);
                else if (pos === 'no') noBasket.appendChild(card);
            });
        }

        function updateCheckButton() {
            const allPlaced = Object.values(cardPositions).every(pos => pos !== 'pool');
            const checkBtn = document.getElementById('check-btn');
            if (allPlaced) {
                checkBtn.classList.remove('hidden');
            } else {
                checkBtn.classList.add('hidden');
            }
        }

        function checkAnswers() {
            const allPlaced = Object.values(cardPositions).every(pos => pos !== 'pool');
            if (!allPlaced) {
                showAlert("아직 바구니에 담지 않은 동물이 있어요!");
                return;
            }

            isChecking = true;
            document.getElementById('check-btn').classList.add('hidden');
            document.getElementById('reset-btn').classList.remove('hidden');

            let correctCount = 0;
            animals.forEach(animal => {
                const expected = animal[currentCriterion] ? 'yes' : 'no';
                if (cardPositions[animal.id] === expected) {
                    correctCount++;
                }
            });

            // Show Result Modal
            const resultIcon = document.getElementById('result-icon');
            const resultTitle = document.getElementById('result-title');
            const resultDesc = document.getElementById('result-desc');

            if (correctCount === 12) {
                resultIcon.innerText = '🎉';
                resultTitle.innerText = '완벽해요!';
                resultTitle.className = 'text-5xl text-green-500 mb-2';
                resultDesc.innerText = '12마리의 동물을 모두 올바르게 분류했어요!';
            } else {
                resultIcon.innerText = '🤔';
                resultTitle.innerText = '조금 아쉬워요!';
                resultTitle.className = 'text-5xl text-amber-500 mb-2';
                resultDesc.innerText = `12마리 중 ${correctCount}마리를 맞혔어요.\nX 표시된 카드의 이유를 읽어보세요!`;
            }

            document.getElementById('result-modal').classList.remove('hidden');
            renderCards(); // Trigger re-render to show O/X marks and reasons
        }

        function resetGame() {
            isChecking = false;
            currentCriterion = null;
            document.getElementById('game-area').classList.add('hidden');
            document.getElementById('reset-btn').classList.add('hidden');
            
            // Reset button styles
            document.querySelectorAll('.criterion-btn').forEach(btn => {
                btn.classList.remove('ring-4', 'ring-amber-400', 'scale-105', 'opacity-50');
            });

            initPositions();
        }

        // Utility Modals
        function showAlert(msg) {
            document.getElementById('alert-message').innerText = msg;
            document.getElementById('alert-modal').classList.remove('hidden');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        // Run on start
        window.onload = () => {
            initPositions();
        };
    </script>
</body>
</html>
